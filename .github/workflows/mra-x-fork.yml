name: MRA-X copy-on-write execution
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-fork.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_fork_audit.py --directory fork-audit
      - run: python3 tools/mra_x_fork_audit.py --directory fork-replay
      - name: Check deterministic mathematical evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','decision'): r.pop(key)
              return r
          r=stable('fork-audit/evidence.json')
          assert r==stable('fork-replay/evidence.json')
          assert len(r['rows'])==6 and r['controls']==11
          for method in ('singlepass','deep','fork'):
              rr=[x for y in r['rows'] for x in y[method]['rows']]
              assert len(rr)==96 and sum(x['optimum'] is not None for x in rr)==90
              assert tuple(sum(x[k] for x in rr) for k in ('actual','full','fresh','hits'))==(9181,37965,8804,2926)
              assert sum(x['forked'] for x in rr)==(84 if method=='fork' else 0)
          PY
