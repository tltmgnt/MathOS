name: Proctor F034 encoder-aware byte checker resources
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-encoder-byte-checker.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-encoder-byte-checker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-encoder-byte-checker
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-encoder-byte-checker
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsDecoderMeter.lean formal/ProctorDecimalBitWidth.lean formal/ProctorBinaryPrimitives.lean formal/ProctorCheckedBinaryScanner.lean formal/ProctorStructuralCounters.lean formal/ProctorFuelFreeParser.lean formal/ProctorIteratorDispatch.lean formal/ProctorIteratorOverhead.lean formal/ProctorParserMeterCompose.lean formal/ProctorInputSensitiveIterator.lean formal/ProctorAmortizedParser.lean formal/ProctorGrammarMeter.lean formal/ProctorAmortizedGrammar.lean formal/ProctorCheckedDecrement.lean formal/ProctorScannerCounters.lean formal/ProctorBytePrepass.lean formal/ProctorParserCounters.lean formal/ProctorNestedParser.lean formal/ProctorFuelFreeDecoder.lean formal/ProctorNarrowVisits.lean formal/ProctorBinaryScannerGates.lean formal/ProctorScannerResourceCompose.lean formal/ProctorEncodeVisits.lean formal/ProctorEncoderIntegration.lean formal/ProctorNestedEncoderAmortization.lean formal/ProctorEncoderGrammar.lean formal/ProctorEncoderByteChecker.lean formal/ProctorEncoderByteCheckerMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_ENCODER_BYTE_CHECKER_OK expected=8 envelope=12 pairs=96 malformed=8 positive=1' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-encoder-byte-checker")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["decode_projection","decode_bound","expected_projection","envelope_projection","expected_bound","envelope_bound","check_projection","check_bound","check_sound","check_fuel_free_agrees","combined_bounds"]
          for name in names:
              if f"'ProctorEncoderByteChecker.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorEncoderByteChecker.{name}")
          report = dict(scope="ENCODER_AWARE_BYTE_CHECKER_SELECTED_RESOURCES",
                        verified=names, axiom_gate=True, expected_controls=8, envelope_controls=12, pair_controls=96, malformed_controls=8, positive_controls=1,
                        encoder_aware_byte_checker_selected_bounds_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorEncoderByteChecker.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-encoder-byte-checker-evidence
          path: artifacts/f034-encoder-byte-checker/
