name: PNP signed Horn proof schemas v17.4
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_signed_horn*.py'
      - 'formal/PnpSignedHorn.lean'
      - 'tests/test_pnp_signed_horn.py'
      - '.github/workflows/pnp-proof-library-signed-horn.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_signed_horn.py' -v
          mkdir -p artifacts/pnp-signed-horn
          python -m mathos.research.pnp_evidence_benchmark --checkpoint artifacts/pnp-signed-horn/source.json > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark artifacts/pnp-signed-horn/source.json --checkpoint artifacts/pnp-signed-horn/scheduler.json > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark artifacts/pnp-signed-horn/source.json --scheduler artifacts/pnp-signed-horn/scheduler.json --checkpoint artifacts/pnp-signed-horn/failures.json > /dev/null
          python -m mathos.research.pnp_library_frontier --benchmark artifacts/pnp-signed-horn/source.json --scheduler artifacts/pnp-signed-horn/scheduler.json --failures artifacts/pnp-signed-horn/failures.json --checkpoint artifacts/pnp-signed-horn/v17.json > /dev/null
          python -m mathos.research.pnp_signed_horn_frontier --benchmark artifacts/pnp-signed-horn/source.json --scheduler artifacts/pnp-signed-horn/scheduler.json --failures artifacts/pnp-signed-horn/failures.json --v17 artifacts/pnp-signed-horn/v17.json --checkpoint artifacts/pnp-signed-horn/report.json
          python -m mathos.research.pnp_signed_horn_frontier --benchmark artifacts/pnp-signed-horn/source.json --scheduler artifacts/pnp-signed-horn/scheduler.json --failures artifacts/pnp-signed-horn/failures.json --v17 artifacts/pnp-signed-horn/v17.json --audit artifacts/pnp-signed-horn/report.json > artifacts/pnp-signed-horn/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-signed-horn-evidence
          path: artifacts/pnp-signed-horn/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpSignedHorn.lean | tee /tmp/pnp-horn-lean.txt
          for theorem in bodySound forwardSound conflictSound traceSound traceConflict; do
            grep -Fx "'PnpSignedHorn.$theorem' does not depend on any axioms" /tmp/pnp-horn-lean.txt
          done
