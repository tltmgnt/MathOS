name: Proctor F038 RE-X variable overlap alignment
on:
  push:
    branches: ['research/pnp-f038-rex-variable-overlap-alignment']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_rex_variable_overlap_alignment.js
          node mathos/research/f038_rex_variable_overlap_alignment.js | tee /tmp/alignment.txt
          grep -Fx 'F038_REX_VARIABLE_OVERLAP_ALIGNMENT_OK {"alphabet":38,"width":6,"logicalStates":444,"rules":16872,"states":41862,"bits":2553586,"counts":{"logicalCases":825,"physicalCases":45,"positiveCases":74,"negativeCases":751,"physicalPositive":11,"physicalNegative":34,"parentRows":873,"childRows":879,"physical":11231735,"logical":198001,"checkpoints":90,"physicalParentFlags":63,"physicalChildFlags":65,"malformed":13,"malformedTransitions":109276,"cutoffs":2},"scaling":[[1,80,150619,4012,568,[46163,63952,40504]],[2,98,228229,6216,694,[68897,99136,60196]],[4,134,431761,12064,946,[127973,192544,111244]],[8,206,1032073,29520,1450,[300557,471520,259996]],[16,350,3005689,87472,2458,[863453,1398112,744124]]],"digest":3392018395,"physicalDigest":1193114046}' /tmp/alignment.txt
          sed -n 's/^F038_REX_VARIABLE_OVERLAP_ALIGNMENT_OK //p' /tmp/alignment.txt > /tmp/alignment.json
          python -m mathos.research.validate_f038_rex_variable_overlap_alignment /tmp/alignment.json
          python -m mathos.research.tga_f038_rex_018 > /tmp/rex.json
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/rex.json') as f:
              rex=json.load(f)
          with open('/tmp/gap.json') as f:
              gap=json.load(f)
          assert rex['PNP_RESOLUTION_STATUS']==gap['PNP_RESOLUTION_STATUS']=='OPEN'
          assert rex['PROMOTION']=='NONE'
          assert rex['decision']=='PRESERVE_VARIABLE_LABEL_ALIGNMENT_NESTED_COST_OPEN'
          assert rex['governance']['decision']=='STOP_NO_AUTHORIZED_AFFORDABLE_TASK'
          assert all(v['status']=='BLOCKED' for v in rex['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in rex['global_routes'].values())
          assert len(rex['global_routes']['mathematical_resolution']['minimal_completion_sets'])==4
          assert gap['selector_route']['status']==gap['mathematical_resolution']['status']=='BLOCKED'
          print('F038_REX_VARIABLE_OVERLAP_ALIGNMENT_GATE_OK status=OPEN promotion=NONE')
          PY
