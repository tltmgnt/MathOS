name: Proctor F038 RE-X cost-awared bounded and full GAC
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-cost-aware']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only finite-control decoding, batched shuttles and bounds
        run: |
          node mathos/research/f038_rex_width_three_cost_audit.js > /tmp/d5o.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5o.json');a.equal(r.cases,73);a.equal(r.arith,20034);a.equal(r.accepted,88);a.equal(r.refused,58);a.equal(r.savings,82);a.equal(r.losses,0);a.equal(r.restored,146);a.equal(r.producerChecks,10);a.equal(r.producerRefusals,3);a.equal(r.runCases,68);a.equal(r.phaseCases,4);a.equal(r.runSavings,88);a.equal(r.runEqual,0);a.equal(r.runLoss,0);a.equal(r.producerSavings,8);a.equal(r.producerEqual,2);a.deepEqual(r.thresholds,['148080092','221923710']);console.log('D5O_COST_ORACLE_OK')"
          node mathos/research/f038_rex_width_three_cost_codec_audit.js > /tmp/d5o-codec.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5o-codec.json');a.equal(r.patterns,8190);a.equal(r.runPatterns,2224);a.equal(r.maskCases,512);a.equal(r.accepted,383);a.equal(r.refused,129);a.equal(r.maxProbe,36);console.log('D5O_EXHAUSTIVE_CODEC_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5O_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [all-active, ternary-chain, ternary-empty, reverse-chain-cap, radius-three-refusal, ternary-three-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_cost_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_cost_replay.js" "$mode" descriptor > /tmp/d5o.desc
          node "${p}_cost_replay.js" "$mode" fixtures > /tmp/d5o.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5o-native
          /tmp/d5o-native /tmp/d5o.desc /tmp/d5o.fixtures > /tmp/d5o-native.out
          python -m mathos.research.f038_rex_width_three_cost_native_verify /tmp/d5o.fixtures /tmp/d5o-native.out "$mode"
