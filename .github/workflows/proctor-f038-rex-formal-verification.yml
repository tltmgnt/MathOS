name: Proctor F038 RE-X formal verification and independent evidence gate
on:
  push:
    branches: ['research/pnp-f038-rex-formal-verification']
  pull_request:
    branches: ['research/pnp-f038-rex-formal-review-base']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formal/f038
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replay actual D7I exports and corruption controls
        working-directory: .
        run: |
          node mathos/research/f038_rex_fv04_audit.js > /tmp/fv04.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/fv04.json');a.equal(r.rows.length,7);a.equal(r.tamperRejected,9);a.deepEqual([...new Set(r.rows.map(x=>x.kind))].sort(),['hall','polarity-hall','signed-hall']);a.equal(r.rows.at(-1).k,405)"
      - name: Audit actual D7I projection resource counts and bit encoding
        working-directory: .
        run: |
          node mathos/research/f038_rex_fv05_audit.js > /tmp/fv05.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/fv05.json');a.equal(r.small,128);a.equal(r.cutoffs,432);a.equal(r.completions,256);a.equal(r.tamperRejected,3);a.deepEqual(r.rows.map(x=>[x.k,x.work,x.paths,x.bits]),[[30,384,18,2016],[189,4242,126,20952],[405,12024,288,52960],[1209,54132,936,196788]])"
      - name: Audit physical quotient and independent sparse-tape replay
        working-directory: .
        run: |
          node mathos/research/f038_rex_fv06_audit.js > /tmp/fv06.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/fv06.json');a.deepEqual([r.originalStates,r.quotientStates,r.descriptorBits,r.mapped,r.checks,r.corrupt,r.comparisons,r.cutoffs],[4934,3683,180471,4935,14802,3,42,28]);a.deepEqual(r.rows.map(x=>x.transitions),[2092,338,1520,3715,5379,198944,20047])"
      - name: Audit actual preprocessing, certificate and physical release composition
        working-directory: .
        run: |
          node mathos/research/f038_rex_fv07_audit.js > /tmp/fv07.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/fv07.json');a.equal(r.rows.length,8);a.equal(r.cutoffs,8);a.equal(r.rejected,9);a.deepEqual(r.rows.map(x=>x.status),['SAT','SAT','SAT','SAT','UNSAT','UNSAT','UNSAT','UNSAT']);a.deepEqual(r.rows.map(x=>x.transitions),[338,338,794,3577,2092,2092,2092,2092]);a.deepEqual(r.rows.map(x=>x.witness),[[0],[0,0],[1,1],[0,1,1],null,null,null,null])"
      - name: Independent exhaustive release audit
        working-directory: .
        run: |
          node mathos/research/f038_rex_fv08_audit.js > /tmp/fv08.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/fv08.json');a.deepEqual(r,{instances:384,sat:155,unsat:229,models:1117,positive:1117,invalidWitness:3625,falseUnsat:310,corrupt:916,cutoffs:384})"
      - name: Install pinned Lean toolchain via elan
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and fetch Mathlib cache
        run: |
          lean --version
          lake update
          lake exe cache get
      - name: Compile and reject admitted proofs
        run: |
          set -euo pipefail
          lake build F038Formal
          mkdir -p .lake/build/lib/lean/F038Formal
          lake env lean F038Formal.lean 2>&1 | tee /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/Certificate.olean F038Formal/Certificate.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/CertificateTests.olean F038Formal/CertificateTests.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/Reduction.olean F038Formal/Reduction.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/ReductionTests.olean F038Formal/ReductionTests.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/Bridge.olean F038Formal/Bridge.lean 2>&1 | tee -a /tmp/f038-lean.log
          for mode in plain mixed negative; do
            node ../../mathos/research/f038_rex_fv04_audit.js lean "$mode" > "/tmp/FV04_${mode}.lean"
            lake env lean "/tmp/FV04_${mode}.lean" 2>&1 | tee -a /tmp/f038-lean.log
          done
          lake env lean -o .lake/build/lib/lean/F038Formal/Resources.olean F038Formal/Resources.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/ResourcesTests.olean F038Formal/ResourcesTests.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/Physical.olean F038Formal/Physical.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/PhysicalTests.olean F038Formal/PhysicalTests.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/Composition.olean F038Formal/Composition.lean 2>&1 | tee -a /tmp/f038-lean.log
          lake env lean -o .lake/build/lib/lean/F038Formal/CompositionTests.olean F038Formal/CompositionTests.lean 2>&1 | tee -a /tmp/f038-lean.log
          if grep -E 'sorryAx|declaration uses .sorry.' /tmp/f038-lean.log; then exit 1; fi
          echo F038_FV02_CERTIFICATE_KERNEL_OK
          echo F038_FV03_REDUCTION_KERNEL_OK
          echo F038_FV04_RAW_BRIDGE_OK
          echo F038_FV05_RESOURCE_KERNEL_OK
          echo F038_FV06_PHYSICAL_QUOTIENT_OK
          echo F038_FV07_COMPOSITION_KERNEL_OK
      - name: Audit every named theorem and reject nonstandard axioms
        run: |
          set -euo pipefail
          python3 axiom_audit.py self-test
          python3 axiom_audit.py generate /tmp/F038AllAxioms.lean
          lake env lean /tmp/F038AllAxioms.lean 2>&1 | tee /tmp/f038-axioms.log
          python3 axiom_audit.py verify /tmp/f038-axioms.log > /tmp/f038-axioms.json
          echo F038_FV08_AXIOM_GATE_OK
      - name: Retain auditable verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f038-formal-verification-evidence
          if-no-files-found: warn
          path: |
            /tmp/f038-lean.log
            /tmp/f038-axioms.log
            /tmp/f038-axioms.json
            /tmp/fv04.json
            /tmp/fv05.json
            /tmp/fv06.json
            /tmp/fv07.json
            /tmp/fv08.json
            formal/f038/lake-manifest.json
