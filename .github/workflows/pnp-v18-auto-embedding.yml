name: PNP v18 automatic Hall embedding
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_hall_embedding_search.py'
      - 'mathos/research/pnp_hall_witness_memory.py'
      - 'mathos/research/pnp_bounded_matching.py'
      - 'mathos/research/pnp_signed_hall_subsystem.py'
      - 'tests/independent_pnp_v18_auto_embedding_*.py'
      - 'tests/independent_pnp_v18_hall_memory_probe.py'
      - '.github/workflows/pnp-v18-auto-embedding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/pnp-v18-auto-embedding
          PYTHONPATH=. python tests/independent_pnp_v18_auto_embedding_probe.py > artifacts/pnp-v18-auto-embedding/report.json
          python tests/independent_pnp_v18_auto_embedding_audit.py artifacts/pnp-v18-auto-embedding/report.json | tee artifacts/pnp-v18-auto-embedding/audit.json
          (cd artifacts/pnp-v18-auto-embedding && sha256sum report.json audit.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-v18-auto-embedding
          path: artifacts/pnp-v18-auto-embedding/
          if-no-files-found: error
