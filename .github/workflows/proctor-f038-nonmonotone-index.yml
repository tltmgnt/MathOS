name: Proctor F038 nonmonotone index barrier
on:
  push:
    branches: ['research/pnp-f038-nonmonotone-index-barrier']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f038_monotone_choice | tee /tmp/monotone.txt
          grep -Fx 'F038_MONOTONE_CHOICE_OK graphs=2184 branch_checks=4368 no_promise=1' /tmp/monotone.txt
          python -m mathos.research.f038_nonmonotone_index | tee /tmp/index.txt
          grep -Fx 'F038_NONMONOTONE_INDEX_OK graphs=514 branch_checks=1028 zero=257 one=257 distinct=98' /tmp/index.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_NONMONOTONE_INDEX_GATE_OK status=OPEN')
          PY
