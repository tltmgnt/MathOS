name: Proctor F038 unrestricted context fixed point
on:
  push:
    branches: ['research/pnp-f038-unrestricted-context-fixedpoint']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_context_fixedpoint.py
          python -m mathos.research.f038_unrestricted_context_fixedpoint | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_CONTEXT_FIXEDPOINT_OK {"counts":[30,545386,49416,22,12,56,287,84,48,287,133],"rank":9}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_CONTEXT_FIXEDPOINT_GATE_OK status=OPEN promotion=NONE')
          PY
