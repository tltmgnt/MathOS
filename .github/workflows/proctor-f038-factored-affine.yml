name: Proctor F038 factored affine messages
on:
  push:
    branches: ['research/pnp-f038-factored-affine-messages']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_factored_affine.py
          python -m mathos.research.f038_symbolic_affine | tee /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 up_checks=26320 down_checks=26320 projections=15528 direction_checks=11136 valid_directions=8587 repair_exists=4294 bad_empty=3424' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 up_checks=6336 down_checks=6336 projections=3616 direction_checks=6944 valid_directions=3328 repair_exists=896 bad_empty=0' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_HIGH_RANK_OK sizes=1,2,4,8,16,32 max_rank=64 half_flats_each=1 max_half_equations=32 corrupt_rejected=12' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_AFFINE_COVER_BARRIER_OK spaces=16,2825 flats=51,26387 contained=24,1944 max_sizes=4,16' /tmp/symbolic.txt
          python -m mathos.research.f038_factored_affine | tee /tmp/factored.txt
          grep -Fx 'F038_FACTORED_PROJECTION_OK cases=4096 membership_checks=32768 empty=832' /tmp/factored.txt
          grep -Fx 'F038_FACTORED_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 up_checks=26320 down_checks=26320 projections=15528 direction_checks=11136 valid_directions=8587 repair_exists=4294 bad_empty=3424' /tmp/factored.txt
          grep -Fx 'F038_FACTORED_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 up_checks=6336 down_checks=6336 projections=3616 direction_checks=6944 valid_directions=3328 repair_exists=896 bad_empty=0' /tmp/factored.txt
          grep -Fx 'F038_FACTORED_NAE_OK sizes=1,2,4,8,16,32 max_rank=96 max_half_factors=32 max_pieces_per_factor=6 corrupt_rejected=12' /tmp/factored.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_FACTORED_AFFINE_GATE_OK status=OPEN')
          PY
