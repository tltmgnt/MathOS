name: MRA-X edit-event world model
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-world.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_world.py --output world-evidence.json --model world-model.json
      - name: Verify deterministic evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          import mra_x_world as w
          import mra_x_gap_agent as g
          r=json.load(open('world-evidence.json'))
          m=json.load(open('world-model.json'))
          assert g.digest(m['model'])==m['sha256']==r['model_sha256']
          assert r['checks']==3984 and r['controls']==4
          assert r['training_samples']==170 and len(r['rows'])==18
          assert len(r['effects'])==157 and r['forecast_count']==332
          assert r['forecast_correct']==159
          assert r['brier'] < r['unconditional_brier']
          assert r['threshold'] is None and r['totals']=={'learned':47251,'baseline':47251}
          def stable(x):
              h=x.pop('evidence_sha256')
              assert g.digest(x)==h
              for k in ('times','geomean_ratio','worst_ratio','decision'): x.pop(k)
              return x
          assert stable(r)==stable(w.audit(Path('replay-model.json')))
          assert Path('world-model.json').read_bytes()==Path('replay-model.json').read_bytes()
          PY
