name: Proctor F037 checked folding audit
on:
  push:
    branches: ['research/pnp-f037-checked-folding']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f037_checked_folding | tee /tmp/folding.txt
          grep -Fx 'F037_CHECKED_FOLDING_OK random=128 multipartite=8 max_variables=144 rejection=3' /tmp/folding.txt
