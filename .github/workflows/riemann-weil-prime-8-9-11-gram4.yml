name: TECT-X fixed prime-active Weil 4D interval Gram
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_prime_eight_nine_eleven_gram4.py'
      - 'tests/test_riemann_weil_prime_eight_nine_eleven_gram4.py'
      - 'docs/research/TECTX_WEIL_PRIME_8_9_11_COMPACT_GRAM4.md'
      - '.github/workflows/riemann-weil-prime-8-9-11-gram4.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_prime_eight_nine_eleven_gram4.py'
      - 'tests/test_riemann_weil_prime_eight_nine_eleven_gram4.py'
      - 'docs/research/TECTX_WEIL_PRIME_8_9_11_COMPACT_GRAM4.md'
      - '.github/workflows/riemann-weil-prime-8-9-11-gram4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-prime-active-fourth-compact-Weil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned interval arithmetic
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Test real fourth Weil arithmetic direction and prime-power proof gate
        run: python -m unittest discover -s tests -p 'test_riemann_weil_prime_eight_nine_eleven_gram4.py' -v
      - name: Generate exact outward-rational arithmetic 4D Weil certificate
        run: |
          python -m mathos.research.riemann_weil_prime_eight_nine_eleven_gram4 --panels 256 --output artifacts/riemann/weil_prime_8_9_11_gram4.json
          python -m json.tool artifacts/riemann/weil_prime_8_9_11_gram4.json >/dev/null
      - name: Independently check rational eigenvalue and all interval LDL pivots
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_prime_8_9_11_gram4.json',encoding='utf-8') as file:
              r=json.load(file)
          assert r['status']=='FIXED_PRIME_ACTIVE_4D_WEIL_GRAM_CERTIFIED_GLOBAL_RH_OPEN'
          a=r['arithmetical_certification']
          inv=a['new_prime_support']
          assert inv['actual_prime_powers']==[8,9,11]
          assert inv['vanishing_mangoldt_candidates']==[10,12]
          assert set(a['new_prime_power_parts'])=={'8','9','11'}
          assert all(Fraction(x['interval'][1])<0 for x in a['new_prime_power_parts'].values())
          assert Fraction(a['new_archimedean_interval'][1])<0
          assert Fraction(a['new_pole_interval'][0])>0
          floor=Fraction(1,10000)
          assert Fraction(a['claimed_strict_lambda_lower'])==floor
          cert=a['rational_midpoint_residual_certificate']
          inv=Fraction(cert['inverse_infinity_norm_exact'])
          err=Fraction(cert['interval_error_infinity_norm_exact'])
          margin=Fraction(cert['strict_margin_above_shift_exact'])
          assert cert['proved_positive_definiteness'] and inv*err<1
          assert margin>0 and margin==1/inv-err
          M=a['full_symmetric_weil_matrix']
          assert len(M)==4 and all(len(row)==4 for row in M)
          assert all(M[i][j]==M[j][i] for i in range(4) for j in range(4))
          p=a['shifted_midpoint_rational_LDL_pivots']
          assert len(p)==4 and all(Fraction(v)>0 for v in p)
          flags=r['assurance']
          assert flags['actual_compact_four_dimensional_Weil_PSD']
          assert not flags['all_dimensional_Weil_PSD']
          assert not flags['full_positive_Weil_Hilbert_space']
          assert not flags['Riemann_hypothesis_proved']
          PY
