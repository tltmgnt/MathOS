          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          with open('/tmp/far.json') as f:
              far = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == far['PNP_RESOLUTION_STATUS'] == 'OPEN'
