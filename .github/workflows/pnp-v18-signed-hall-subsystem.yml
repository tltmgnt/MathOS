name: PNP v18 signed Hall subsystem
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_signed_hall_subsystem.py'
      - 'mathos/research/pnp_bounded_matching.py'
      - 'tests/independent_pnp_v18_signed_hall_probe.py'
      - '.github/workflows/pnp-v18-signed-hall-subsystem.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/pnp-v18-signed-hall
          PYTHONPATH=. python tests/independent_pnp_v18_signed_hall_probe.py | tee artifacts/pnp-v18-signed-hall/report.json
          (cd artifacts/pnp-v18-signed-hall && sha256sum report.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-v18-signed-hall-subsystem
          path: artifacts/pnp-v18-signed-hall/
          if-no-files-found: error
