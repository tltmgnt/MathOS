name: Proctor F038 affine repair elimination
on:
  push:
    branches: ['research/pnp-f038-affine-repair-elimination']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_affine_repair.py
          python -m mathos.research.f038_branchwidth_adapter | tee /tmp/adapter.txt
          grep -Fx 'F038_CONNECTIVITY_ORACLE_OK cases=219 cuts=3489 symmetry=3489 submodularity=79329 strict=34572' /tmp/adapter.txt
          grep -Fx 'F038_ARBITRARY_TREE_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 nodes=7860 joins=3074 pairs=11483 compatible=4000 entries=11676 max_width=3 projection_checks=18496' /tmp/adapter.txt
          grep -Fx 'F038_DISCOVERY_EXECUTION_OK cycles=8 sat=4 unsat=4 width_each=2 malformed_rejected=16 budget_rejected=8 corrupt_rejected=4' /tmp/adapter.txt
          python -m mathos.research.f038_affine_repair | tee /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 original=4736 remaining=466 deleted=4270 tautologies=3088 flips=1182 candidates=5451 exhausted=1181 fully_reduced=1360 model_checks=3470 restoration_steps=9438' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_FULL_OK formulas=256 sat=255 unsat=1 inconsistent=1 original=896 remaining=0 deleted=896 tautologies=0 flips=896 candidates=896 exhausted=0 fully_reduced=255 model_checks=1920 restoration_steps=6944' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_DENSE_OK sizes=3,8,16,32 deleted=647 retained=0 max_reduced_width=0 corrupt_rejected=8' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_NONCOORDINATE_OK direction=24 weight=2 single_bit_failures=5' /tmp/repair.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_AFFINE_REPAIR_GATE_OK status=OPEN')
          PY
