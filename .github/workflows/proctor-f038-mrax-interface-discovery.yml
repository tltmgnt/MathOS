name: Proctor F038 MRA-X interface discovery
on:
  push:
    branches: ['research/pnp-f038-mrax-interface-discovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_interface_discovery.py
          python -m mathos.research.f038_bounded_inference | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_BOUNDED_INFERENCE_OK {"binary":[256,417,1441,5764,896,3584,6400,1407,4993],"controls":8,"families":[[2,450,125,8,18],[3,2172,357,24,66],[4,6860,925,64,194]],"full":[256,865,1889,15112,224,1792,8960,5791,3169],"primary":[4096,27952,52528,420224,24108,192864,200704,34112,166592]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_interface_discovery | tee /tmp/interface.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/interface.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=discovery,ordinary_complete,machine_cost,short_proofs status=OPEN' /tmp/interface.txt
          grep -Fx 'F038_MRAX_INTERFACE_OK {"controls":4,"families":[[2,9,18,8],[3,29,66,24],[4,81,194,64]],"graphs":[1024,2048,65536,36160,209312,136046,12288,1840,7506,2900],"reduction":[8,512000,1000,20]}' /tmp/interface.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/interface.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/interface.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_INTERFACE_GATE_OK status=OPEN')
          PY
