name: MRA-X resource-rational planning
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-rational.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_rational.py --output rational-evidence.json --model rational-model.json
      - name: Verify deterministic evidence and zero shadow work
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          import mra_x_rational as r
          import mra_x_gap_agent as g
          x=json.load(open('rational-evidence.json'))
          m=json.load(open('rational-model.json'))
          assert g.digest(m['model'])==m['sha256']==x['model_sha256']
          assert x['checks']==1576 and x['controls']==8
          assert x['candidate']==4 and x['selected']==0
          assert x['baseline']['work']==17035 and x['active']['work']==17079
          assert x['active']['shadow_visits']==0 and x['active']['scores']==98
          def stable(x):
              h=x.pop('evidence_sha256')
              assert g.digest(x)==h
              for k in ('times','geomean_ratio','worst_ratio','decision'): x.pop(k)
              return x
          assert stable(x)==stable(r.audit(Path('replay-model.json')))
          assert Path('rational-model.json').read_bytes()==Path('replay-model.json').read_bytes()
          PY
