name: Proctor F036 monotone circuit barrier
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/f035_parity_projection_stress.py'
      - 'mathos/research/f035_static_lift_audit.py'
      - 'docs/research/tga-universal/PNP-F036-MONOTONE-CIRCUIT-BARRIER.md'
      - '.github/workflows/proctor-f036-monotone-circuit-barrier.yml'
  push:
    branches: ['research/pnp-f036-monotone-circuit-barrier']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f036-monotone-circuit-barrier
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f036-monotone-circuit-barrier
          python mathos/research/f035_parity_projection_stress.py | tee "$out/parity-stress.txt"
          grep -Fx "F035_PARITY_PROJECTION_STRESS_OK k=1..12" "$out/parity-stress.txt"
          python mathos/research/f035_static_lift_audit.py | tee "$out/static-lift.txt"
          grep -Fx "F035_STATIC_LIFT_AUDIT_OK assignments=4096 degrees=5 first_refutation_degree=6" "$out/static-lift.txt"
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorUnboundedCodec.lean formal/ProctorUnboundedRoundtrip.lean formal/ProctorResolutionBridge.lean formal/ProctorOrdinaryCompleteness.lean formal/ProctorEnvelopeCompleteness.lean formal/ProctorExecutableDiscovery.lean formal/ProctorBinarySquareDiscovery.lean formal/ProctorImplicationPathDiscovery.lean formal/ProctorPathCompilerCompleteness.lean formal/ProctorReachabilityCompleteness.lean formal/ProctorTwoCNFModel.lean formal/ProctorPathResourceBounds.lean formal/ProctorTotalTwoCNF.lean formal/ProctorFiniteModel.lean formal/ProctorSerializedTwoCNF.lean formal/ProctorDecimalEncoder.lean formal/ProctorEndToEndBytes.lean formal/ProctorWireTokenBounds.lean formal/ProctorDecimalSize.lean formal/ProctorTokenMagnitude.lean formal/ProctorPolynomialWireSize.lean formal/ProctorRankBitBounds.lean formal/ProctorBinaryByteSolver.lean formal/ProctorGeneralBranching.lean formal/ProctorSemanticProjection.lean formal/ProctorComponentFactorization.lean formal/ProctorAdaptiveElimination.lean formal/ProctorAffineBarrier.lean formal/ProctorNonlinearLift.lean formal/ProctorMonotoneCircuitBarrier.lean formal/ProctorMonotoneCircuitBarrierMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F036_MONOTONE_CIRCUIT_BARRIER_OK formulas=4096 rails=262144 sat=1280 unsat=2816 witnesses=6384' "$out/kernel.txt"
          python -m mathos.research.tga_pnp_resolution_gap > "$out/gap-report.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f036-monotone-circuit-barrier")
          lines = set((out / "kernel.txt").read_text().splitlines())
          groups = {"ProctorMonotoneCircuitBarrier":["row_correct","cover_correct","conflict_correct","rails_true","rails_consistent","model_covers","selected_true","consistent_cover_model","distinguishes","inequivalent_iff_sat","equivalent_iff_unsat"]}
          names = [f"{ns}.{name}" for ns, ds in groups.items() for name in ds]
          assert len(names)==11
          for name in names:
              if f"'{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: {name}")
          gap = json.loads((out/"gap-report.json").read_text())
          assert gap["PNP_RESOLUTION_STATUS"]=="OPEN"
          assert gap["mathematical_resolution"]["status"]=="BLOCKED"
          report = dict(scope="MONOTONE_CIRCUIT_BARRIER",
                        verified=names, axiom_gate=True, controls=262144,
                        ordinary_typed_completeness_verified=True,
                        ordinary_executable_generator_completeness_verified=True,
                        bound_envelope_completeness_verified=True,
                        universal_decimal_encoder_verified=True,
                        total_cost_semantics_verified=False,
                        polynomial_certificate_completeness_verified=False,
                        deterministic_polynomial_discovery_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256={ns:hashlib.sha256(Path("formal/"+ns+".lean").read_bytes()).hexdigest()
                                       for ns in groups})
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f036-monotone-circuit-barrier-evidence
          path: artifacts/f036-monotone-circuit-barrier/
