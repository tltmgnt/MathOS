name: Proctor F037 q-Horn audit
on:
  push:
    branches: ['research/pnp-f037-semantic-backdoor']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install scipy==1.17.0
      - run: |
          set -euo pipefail
          python -m mathos.research.f037_qhorn | tee /tmp/qhorn.txt
          grep -Fx 'F037_QHORN_OK random=256 dense=10 max_variables=98 mixed=1 rejection=3' /tmp/qhorn.txt
