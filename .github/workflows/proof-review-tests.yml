name: Proof review evaluation
on:
  push:
    paths: ['mathos/proof_review.py', 'tests/test_proof_review.py', 'benchmarks/proof_review/**', '.github/workflows/proof-review-tests.yml']
  pull_request:
    paths: ['mathos/proof_review.py', 'tests/test_proof_review.py', 'benchmarks/proof_review/**', '.github/workflows/proof-review-tests.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_proof_review.py' -v
      - run: python -m mathos.proof_review benchmarks/proof_review/example.json --repeats 5 > local-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-proof-review-local-report
          path: local-report.json
