name: Proctor F034 decimal bit width and ripple adder
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-decimal-bit-width.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-decimal-bit-width.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-decimal-bit-width
          python -m unittest discover -s tests -p 'test_tga_proctor_data_fixtures.py' -v
          python -m mathos.research.tga_proctor_data_fixtures artifacts/f034-decimal-bit-width/data
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-decimal-bit-width
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsDecoderMeter.lean formal/ProctorDecimalBitWidth.lean formal/ProctorDecimalBitWidthMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" -- "$out/data" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_DECIMAL_BIT_WIDTH_OK files=134 lexical_accept=127 lexical_reject=7 ripple=512 wide=1 word_controls=3' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-decimal-bit-width")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["radix_mono","digit_step","word_bound","wire_bound","token_width","ceiling_bits","natural_width","signed_width","full_adder_value","ripple_value","ripple_length","ripple_gates","ripple_gate_bound"]
          for name in names:
              if f"'ProctorDecimalBitWidth.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorDecimalBitWidth.{name}")
          report = dict(scope="DECODED_OPERAND_WIDTH_AND_RIPPLE_GATE_LEDGER",
                        verified=names, axiom_gate=True, files=134, ripple_controls=512, wide_controls=1,
                        word_controls=3, operand_width_gate=True, ripple_gate_bound_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorDecimalBitWidth.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-decimal-bit-width-evidence
          path: artifacts/f034-decimal-bit-width/
