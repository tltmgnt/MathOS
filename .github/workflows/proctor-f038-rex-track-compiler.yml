name: Proctor F038 RE-X product-track compiler
on:
  push:
    branches: ['research/pnp-f038-rex-track-compiler']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_rex_track_compiler.js
          node --check mathos/research/f038_rex_product_tracks.js
          node mathos/research/f038_rex_track_compiler.js | tee /tmp/track.txt
          grep -Fx 'F038_REX_TRACK_COMPILER_OK [{"mode":"complement","states":155,"bits":5739,"counts":{"cases":511,"transitions":376265,"cutoffs":9},"rows":[[0,7,[1,5,1],3,0],[1,95,[18,47,30],10,-6],[2,159,[41,61,57],14,-10],[3,239,[72,75,92],19,-14],[4,335,[111,89,135],24,-18],[5,447,[158,103,186],29,-22],[6,575,[213,117,245],34,-26],[7,719,[276,131,312],39,-30],[8,879,[347,145,387],44,-34]],"scaling":[[16,2735,[1203,257,1275],84,-66],[32,9519,[4451,481,4587],164,-130],[64,35375,[17091,929,17355],324,-258],[128,136239,[66947,1825,67467],644,-514],[256,534575,[264963,3617,265995],1284,-1026]]},{"mode":"prefixXor","states":170,"bits":6294,"counts":{"cases":511,"transitions":376265,"cutoffs":9},"rows":[[0,7,[1,5,1],3,0],[1,95,[18,47,30],10,-6],[2,159,[41,61,57],14,-10],[3,239,[72,75,92],19,-14],[4,335,[111,89,135],24,-18],[5,447,[158,103,186],29,-22],[6,575,[213,117,245],34,-26],[7,719,[276,131,312],39,-30],[8,879,[347,145,387],44,-34]],"scaling":[[16,2735,[1203,257,1275],84,-66],[32,9519,[4451,481,4587],164,-130],[64,35375,[17091,929,17355],324,-258],[128,136239,[66947,1825,67467],644,-514],[256,534575,[264963,3617,265995],1284,-1026]]}]' /tmp/track.txt
          node mathos/research/f038_rex_product_tracks.js | tee /tmp/product.txt
          grep -Fx 'F038_REX_PRODUCT_TRACKS_OK {"results":[{"mode":"prefixOr","states":371,"descriptionBits":14844,"n":{"cases":511,"valid":511,"rejected":0,"transitions":476085,"validTransitions":476085,"cutoffs":17,"skippedCells":0,"outputBits":3586},"scaling":[[16,3439,[1491,367,1581],100,16],[32,11935,[5539,687,5709],196,32],[64,44287,[21315,1327,21645],388,64],[128,170431,[83587,2607,84237],772,128]]},{"mode":"groupOr","states":607,"descriptionBits":26105,"n":{"cases":511,"valid":41,"rejected":470,"transitions":232975,"validTransitions":36279,"cutoffs":9,"skippedCells":210,"outputBits":74},"scaling":[[16,3243,[1491,367,1385],88,4],[32,11159,[5539,687,4933],172,8],[64,41199,[21315,1327,18557],340,16],[128,158111,[83587,2607,71917],676,32]]}],"micro":432,"microTransitions":3888,"invalidCodes":69,"bags":[[2,0,6,1,1,694],[2,1,12,2,0,1985],[2,2,24,4,2,6547],[2,3,48,8,0,23591],[3,0,8,1,1,1048],[3,1,24,3,3,6522],[3,2,72,9,6,50976],[3,3,216,27,21,436626]],"bagRows":150,"bagOutputs":55,"bagTransitions":527989,"generic":{"cases":254,"transitions":143184,"invalidRules":6},"selector":{"selector_inputs":260,"prefix_valid":34,"prefix_timeouts":260,"group_valid":1,"group_blank":259}}' /tmp/product.txt
          node mathos/research/f038_rex_product_tracks.js --description > /tmp/prefix.txt
          node mathos/research/f038_rex_product_tracks.js --description --group-or > /tmp/group.txt
          python -m mathos.research.f038_rex_product_replay /tmp/prefix.txt /tmp/group.txt
          python -m mathos.research.tga_f038_rex_002 > /tmp/rex.json
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/rex.json') as f:
              rex=json.load(f)
          with open('/tmp/gap.json') as f:
              gap=json.load(f)
          assert rex['PNP_RESOLUTION_STATUS']==gap['PNP_RESOLUTION_STATUS']=='OPEN'
          assert rex['PROMOTION']=='NONE'
          assert rex['decision']=='PRESERVE_PRODUCT_COMPILER_FULL_SOLVER_OPEN'
          assert rex['governance']['decision']=='STOP_NO_AUTHORIZED_AFFORDABLE_TASK'
          assert all(v['status']=='BLOCKED' for v in rex['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in rex['global_routes'].values())
          assert len(rex['global_routes']['mathematical_resolution']['minimal_completion_sets'])==4
          assert gap['selector_route']['status']==gap['mathematical_resolution']['status']=='BLOCKED'
          print('F038_REX_PRODUCT_GATE_OK status=OPEN promotion=NONE')
          PY
