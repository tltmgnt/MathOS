name: Proctor F036 recoloring certificate audit
on:
  push:
    branches: ['research/pnp-f036-recoloring-certificate']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f036_recoloring_certificate | tee /tmp/recoloring.txt
          grep -Fx 'F036_RECOLORING_OK unsat=42 sat=14 extra=14 random=256 rejection=3' /tmp/recoloring.txt
