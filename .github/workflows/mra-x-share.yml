name: MRA-X immutable structural sharing
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-share.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_share_audit.py --directory share-audit
      - name: Replay mathematical and ownership checks
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          import mra_x_share_audit as v
          import mra_x_archive as a
          root=Path('share-replay')
          root.mkdir()
          methods={'fork':v.f.Store,'owned':v.o.Store,'share':v.sh.Store}
          rows=[]
          for name,d,edits in v.corpus():
              results={label:v.run(cls,root/f'{name}-{label}.sqlite',d,edits,True)[0] for label,cls in methods.items()}
              rows.append(dict(name=name,**results))
          controls=v.controls(root)
          first=json.load(open('share-audit/evidence.json'))
          h=first.pop('evidence_sha256')
          assert a.digest(first)==h
          assert rows==first['rows'] and controls==first['controls']==20
          for method in methods:
              rr=[x for y in rows for x in y[method]['rows']]
              assert len(rr)==96 and sum(x['optimum'] is not None for x in rr)==90
              assert tuple(sum(x[k] for x in rr) for k in ('actual','full','fresh','hits'))==(19012,56058,19003,3319)
          totals={k:sum(y['share']['sharing'][k] for y in rows) for k in rows[0]['share']['sharing']}
          assert totals==dict(factors_reused=8761,factors_new=2055,records_reused=3832,records_new=1160,routes_reused=3384,routes_new=1704,receipts_reused=3319)
          PY
