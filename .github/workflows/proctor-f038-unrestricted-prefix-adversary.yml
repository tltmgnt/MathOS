name: Proctor F038 unrestricted prefix adversary
on:
  push:
    branches: ['research/pnp-f038-unrestricted-prefix-adversary']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_prefix_adversary.py
          python -m mathos.research.f038_unrestricted_universal_search | tee /tmp/prior.txt
          grep -Fx 'F038_UNRESTRICTED_SEARCH_OK {"controls":5,"failures":[[0,1,0,95,128,10,8,1024],[1,3,32,63,76,234,712,1024],[2,7,78,17,17,556,1724,1024],[3,15,78,17,17,556,1724,1024],[4,31,95,0,0,675,2098,1024],[5,63,95,0,0,675,2098,1024],[6,127,95,0,0,675,2098,1024]],"first":[0,32,46,0,17,0,0],"schedule":[256,95,1792,11008,473,192,128]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_prefix_adversary | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_PREFIX_OK {"blind":[[8,10,1,0,0,0,1,1],[12,12,2,0,0,0,1,1],[16,13,3,0,0,0,1,1],[24,15,5,0,0,0,1,1],[8,20,1,5832,5832,1620,2,-1],[12,21,2,5832,5832,1980,2,1]],"controls":4,"embedding":[256,16384,512,95,5120,32],"geometry":[[8,1,576,585,553,545,10,1,0],[12,2,2048,2061,1901,1889,12,2,0],[16,3,4992,5009,4561,4545,13,1,0],[24,5,17344,17369,15609,15585,15,2,0],[32,7,41728,41761,37281,37249,16,1,0],[64,15,341504,341569,301889,301825,19,1,0],[128,31,2763776,2763905,2430593,2430465,22,1,1]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_PREFIX_GATE_OK status=OPEN')
          PY
