name: Proctor F038 MRA-X mixed polymorphisms
on:
  push:
    branches: ['research/pnp-f038-mrax-mixed-polymorphisms']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_mixed_polymorphisms.py
          python -m mathos.research.f038_interface_discovery | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_INTERFACE_OK {"controls":4,"families":[[2,9,18,8],[3,29,66,24],[4,81,194,64]],"graphs":[1024,2048,65536,36160,209312,136046,12288,1840,7506,2900],"reduction":[8,512000,1000,20]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_mixed_polymorphisms | tee /tmp/mixed.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/mixed.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=discovery,ordinary_complete,machine_cost,short_proofs status=OPEN' /tmp/mixed.txt
          grep -Fx 'F038_MRAX_MIXED_TYPES_OK {"controls":5,"mixed":[1024,912,112,262144,31968,960,11952,11952],"source":[2,1,1],"tables":[256,16384,4650,4586,15936,8568,12]}' /tmp/mixed.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/mixed.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/mixed.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_MIXED_TYPES_GATE_OK status=OPEN')
          PY
