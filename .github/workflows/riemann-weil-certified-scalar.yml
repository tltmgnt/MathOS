name: TECT-X certified Weil archimedean scalar
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_certified_scalar.py'
      - 'tests/test_riemann_weil_certified_scalar.py'
      - 'docs/research/TECTX_WEIL_CERTIFIED_ARCHIMEDEAN_SCALAR.md'
      - '.github/workflows/riemann-weil-certified-scalar.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_certified_scalar.py'
      - 'tests/test_riemann_weil_certified_scalar.py'
      - 'docs/research/TECTX_WEIL_CERTIFIED_ARCHIMEDEAN_SCALAR.md'
      - '.github/workflows/riemann-weil-certified-scalar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certified-one-dimensional-positivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned interval arithmetic
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Recheck inherited prime-tail proof arithmetic
        run: python -m unittest discover -s tests -p 'test_riemann_weil_prime_tail.py' -v
      - name: Check outward digamma, integration, and scalar enclosure
        run: python -m unittest discover -s tests -p 'test_riemann_weil_certified_scalar.py' -v
      - name: Build portable rational-endpoint certificate
        run: |
          python -m mathos.research.riemann_weil_certified_scalar --panels 4096 --output artifacts/riemann/weil_certified_scalar.json
          python -m json.tool artifacts/riemann/weil_certified_scalar.json > /dev/null
      - name: Fail closed on nonpositive exact endpoints or RH promotion
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_certified_scalar.json',encoding='utf-8') as f:
              report=json.load(f)
          out=report['components_outward_rationals']
          low,high=[Fraction(x) for x in out['full_G_eigenvalue']]
          assert 0 < low <= high
          assert Fraction(out['prime_power_abs_tail']) > 0
          assert Fraction(out['archimedean_abs_tail'][1]) > 0
          assert report['assurance']['one_test_function_positive_enclosed']
          assert not report['assurance']['all_three_dimensional_Weil_Gram_enclosed']
          assert not report['assurance']['all_admissible_test_functions_positive']
          assert not report['assurance']['riemann_hypothesis_proved']
          PY
