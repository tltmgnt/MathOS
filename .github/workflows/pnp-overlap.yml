name: PNP overlap boundary scoped checks
on:
  push:
    paths:
      - 'formal/PnpOverlapBoundary.lean'
      - 'mathos/research/pnp_overlap_boundary.py'
      - 'mathos/research/pnp_overlap_certificates.py'
      - 'mathos/research/pnp_overlap_adaptive.py'
      - 'mathos/research/pnp_overlap_obstructions.py'
      - 'mathos/research/pnp_overlap_semantic.py'
      - 'mathos/research/pnp_overlap_recovery.py'
      - 'mathos/research/pnp_overlap_order.py'
      - 'tests/test_pnp_overlap_boundary.py'
      - 'tests/test_pnp_overlap_certificates.py'
      - 'tests/test_pnp_overlap_adaptive.py'
      - 'tests/test_pnp_overlap_obstructions.py'
      - 'tests/test_pnp_overlap_semantic.py'
      - 'tests/test_pnp_overlap_recovery.py'
      - 'tests/test_pnp_overlap_order.py'
      - 'docs/research/papers/PNP-OVL-001*'
      - '.github/workflows/pnp-overlap.yml'
  pull_request:
    paths:
      - 'formal/PnpOverlapBoundary.lean'
      - 'mathos/research/pnp_overlap_boundary.py'
      - 'mathos/research/pnp_overlap_certificates.py'
      - 'mathos/research/pnp_overlap_adaptive.py'
      - 'mathos/research/pnp_overlap_obstructions.py'
      - 'mathos/research/pnp_overlap_semantic.py'
      - 'mathos/research/pnp_overlap_recovery.py'
      - 'mathos/research/pnp_overlap_order.py'
      - 'tests/test_pnp_overlap_boundary.py'
      - 'tests/test_pnp_overlap_certificates.py'
      - 'tests/test_pnp_overlap_adaptive.py'
      - 'tests/test_pnp_overlap_obstructions.py'
      - 'tests/test_pnp_overlap_semantic.py'
      - 'tests/test_pnp_overlap_recovery.py'
      - 'tests/test_pnp_overlap_order.py'
      - 'docs/research/papers/PNP-OVL-001*'
      - '.github/workflows/pnp-overlap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p artifacts/pnp-overlap
          set -o pipefail
          python -m unittest discover -s tests -p 'test_pnp_overlap_boundary.py' -v 2>&1 | tee artifacts/pnp-overlap/python.txt
          python -m mathos.research.pnp_overlap_boundary > artifacts/pnp-overlap/enumeration.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_certificates.py' -v 2>&1 | tee artifacts/pnp-overlap/certificate-tests.txt
          python -m mathos.research.pnp_overlap_certificates > artifacts/pnp-overlap/certificates.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_adaptive.py' -v 2>&1 | tee artifacts/pnp-overlap/adaptive-tests.txt
          python -m mathos.research.pnp_overlap_adaptive > artifacts/pnp-overlap/adaptive.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_obstructions.py' -v 2>&1 | tee artifacts/pnp-overlap/obstruction-tests.txt
          python -m mathos.research.pnp_overlap_obstructions > artifacts/pnp-overlap/obstructions.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_semantic.py' -v 2>&1 | tee artifacts/pnp-overlap/semantic-tests.txt
          python -m mathos.research.pnp_overlap_semantic > artifacts/pnp-overlap/semantic.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_recovery.py' -v 2>&1 | tee artifacts/pnp-overlap/recovery-tests.txt
          python -m mathos.research.pnp_overlap_recovery > artifacts/pnp-overlap/recovery.json
          python -m unittest discover -s tests -p 'test_pnp_overlap_order.py' -v 2>&1 | tee artifacts/pnp-overlap/order-tests.txt
          python -m mathos.research.pnp_overlap_order > artifacts/pnp-overlap/order.json
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean --version | tee artifacts/pnp-overlap/lean-version.txt
          lean -DwarningAsError=true formal/PnpOverlapBoundary.lean 2>&1 | tee artifacts/pnp-overlap/lean.txt
          for theorem in gadget_forward gadget_lift selector_sound selector_complete parity_slice_forward parity_slice_reverse conflicting_equal_rows; do
            grep -Fx "'PnpOverlapBoundary.$theorem' does not depend on any axioms" artifacts/pnp-overlap/lean.txt
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-overlap-scoped-evidence
          path: artifacts/pnp-overlap/
          if-no-files-found: error
