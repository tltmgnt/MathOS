name: PNP certified conflict learning
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_conflict_*.py'
      - 'tests/test_pnp_conflict_learning.py'
      - 'formal/PnpConflictLearning.lean'
      - '.github/workflows/pnp-conflict-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_pnp_adaptive_decision.py' -v
          python -m unittest discover -s tests -p 'test_pnp_v16_stress.py' -v
          python -m unittest discover -s tests -p 'test_pnp_hall_certificate.py' -v
          python -m unittest discover -s tests -p 'test_pnp_conflict_learning.py' -v
          mkdir -p artifacts/pnp-conflict
          python -m mathos.research.pnp_evidence_benchmark --checkpoint artifacts/pnp-conflict/source.json > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark artifacts/pnp-conflict/source.json --checkpoint artifacts/pnp-conflict/scheduler.json > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark artifacts/pnp-conflict/source.json --scheduler artifacts/pnp-conflict/scheduler.json --checkpoint artifacts/pnp-conflict/failures.json > /dev/null
          python -m mathos.research.pnp_conflict_frontier --benchmark artifacts/pnp-conflict/source.json --scheduler artifacts/pnp-conflict/scheduler.json --failures artifacts/pnp-conflict/failures.json --checkpoint artifacts/pnp-conflict/report.json | tee artifacts/pnp-conflict/summary.json
      - run: |
          python -m mathos.research.pnp_conflict_frontier --benchmark artifacts/pnp-conflict/source.json --scheduler artifacts/pnp-conflict/scheduler.json --failures artifacts/pnp-conflict/failures.json --audit artifacts/pnp-conflict/report.json --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-conflict-learning-evidence
          path: artifacts/pnp-conflict/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpConflictLearning.lean | tee /tmp/pnp-conflict-lean.txt
          for theorem in resolveSound contradictionDischargesAssumption; do
            grep -Fx "'PnpConflictLearning.$theorem' does not depend on any axioms" /tmp/pnp-conflict-lean.txt
          done
