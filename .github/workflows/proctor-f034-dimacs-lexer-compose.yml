name: Proctor F034 DIMACS complete lexer meter
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-dimacs-lexer-compose.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-dimacs-lexer-compose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-dimacs-lexer-compose
          python -m unittest discover -s tests -p 'test_tga_proctor_dimacs_fixtures.py' -v
          python -m mathos.research.tga_proctor_dimacs_fixtures artifacts/f034-dimacs-lexer-compose/data
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-dimacs-lexer-compose
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsLexerComposeMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" -- "$out/data" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_LEX_COMPOSE_OK files=73 hand_controls=6' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-dimacs-lexer-compose")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["bind_value","bind_bound","signed_aux_value","signed_aux_bound","word_budget_linear","signed_words_value","signed_words_bound","body_value","body_bound","numbers_value","numbers_bound","rest_value","rest_bound","after_header_value","after_header_bound","lex_value","lex_bound"]
          for name in names:
              if f"'ProctorDimacsLexerCompose.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorDimacsLexerCompose.{name}")
          report = dict(scope="SELECTED_DIMACS_COMPLETE_LEXER_CHARGES",
                        verified=names, axiom_gate=True, fixtures=73,
                        hand_controls=6, complete_lexer_selected_charge_bound_verified=True,
                        complete_lexer_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorDimacsLexerCompose.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-dimacs-lexer-compose-evidence
          path: artifacts/f034-dimacs-lexer-compose/
