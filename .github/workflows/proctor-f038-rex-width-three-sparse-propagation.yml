name: Proctor F038 RE-X sparse bounded and full GAC
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-sparse-propagation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent sparse and dense equivalence, full GAC and bounds
        run: |
          node mathos/research/f038_rex_width_three_sparse_audit.js > /tmp/d5l.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5l.json');a.equal(r.count,68);a.equal(r.arith,20034);a.equal(r.activeChecks,92);a.equal(r.boundedAccepted,39);a.equal(r.fullAccepted,39);a.equal(r.fullGain,0);a.equal(r.fullLoss,0);a.equal(r.cap,1);a.equal(r.empty,28);a.equal(r.clockChecks,78);a.equal(r.strictSavings,22);a.deepEqual(r.thresholds,['142418016','213430596']);console.log('D5L_SPARSE_ORACLE_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5L_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [ternary-chain, ternary-empty, reverse-chain-cap, radius-three-refusal, ternary-three-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_sparse_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_sparse_replay.js" "$mode" descriptor > /tmp/d5l.desc
          node "${p}_sparse_replay.js" "$mode" fixtures > /tmp/d5l.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5l-native
          /tmp/d5l-native /tmp/d5l.desc /tmp/d5l.fixtures > /tmp/d5l-native.out
          python -m mathos.research.f038_rex_width_three_sparse_native_verify /tmp/d5l.fixtures /tmp/d5l-native.out "$mode"
