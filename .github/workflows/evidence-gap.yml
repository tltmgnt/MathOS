name: Research evidence gap gate
on:
  pull_request:
    paths:
      - 'mathos/evidence_gap.py'
      - 'tests/test_evidence_gap.py'
      - 'docs/implementation/RESEARCH_EVIDENCE_GAP.md'
      - '.github/workflows/evidence-gap.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/evidence_gap.py'
      - 'tests/test_evidence_gap.py'
      - 'docs/implementation/RESEARCH_EVIDENCE_GAP.md'
      - '.github/workflows/evidence-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify offline evidence lineage and negative controls
        run: python -m unittest discover -s tests -p 'test_evidence_gap.py' -v
      - name: Compile audit module
        run: python -m py_compile mathos/evidence_gap.py
