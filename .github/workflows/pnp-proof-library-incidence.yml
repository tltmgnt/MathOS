name: PNP signed incidence retrieval v17.10
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_library_incidence*.py'
      - 'tests/test_pnp_library_incidence.py'
      - '.github/workflows/pnp-proof-library-incidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_library_incidence.py' -v
          mkdir -p artifacts/pnp-incidence
          python -m mathos.research.pnp_evidence_benchmark --checkpoint artifacts/pnp-incidence/source.json > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark artifacts/pnp-incidence/source.json --checkpoint artifacts/pnp-incidence/scheduler.json > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark artifacts/pnp-incidence/source.json --scheduler artifacts/pnp-incidence/scheduler.json --checkpoint artifacts/pnp-incidence/failures.json > /dev/null
          python -m mathos.research.pnp_library_frontier --benchmark artifacts/pnp-incidence/source.json --scheduler artifacts/pnp-incidence/scheduler.json --failures artifacts/pnp-incidence/failures.json --checkpoint artifacts/pnp-incidence/v17.json > /dev/null
          python -m mathos.research.pnp_library_incidence_frontier --benchmark artifacts/pnp-incidence/source.json --scheduler artifacts/pnp-incidence/scheduler.json --failures artifacts/pnp-incidence/failures.json --v17 artifacts/pnp-incidence/v17.json --checkpoint artifacts/pnp-incidence/report.json
          python -m mathos.research.pnp_library_incidence_frontier --benchmark artifacts/pnp-incidence/source.json --scheduler artifacts/pnp-incidence/scheduler.json --failures artifacts/pnp-incidence/failures.json --v17 artifacts/pnp-incidence/v17.json --audit artifacts/pnp-incidence/report.json > artifacts/pnp-incidence/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-incidence-retrieval-evidence
          path: artifacts/pnp-incidence/
          if-no-files-found: ignore
