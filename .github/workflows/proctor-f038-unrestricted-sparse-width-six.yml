name: Proctor F038 unrestricted sparse width six
on:
  push:
    branches: ['research/pnp-f038-unrestricted-sparse-width-six']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_sparse_width_six.js
          node mathos/research/f038_unrestricted_sparse_width_six.js | tee /tmp/current.txt
          grep -Fx 'F038_SPARSE_WIDTH_SIX_OK {"fixtures":12,"totals":[334,48259,121170,3984,33280,8710,8246,464,187330,20820,19808,518144,19808],"controls":[[3,108,108,54,9],[5,2000,2000,500,25],[9,46656,46656,5832,81],[17,1257728,1257728,78608,289]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_SPARSE_WIDTH_SIX_GATE_OK status=OPEN promotion=NONE')
          PY
