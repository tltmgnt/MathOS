name: PNP asymptotic family convergence
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_triple_parity.py'
      - 'formal/PnpTripleParity.lean'
      - '.github/workflows/pnp-asymptotic-frontier.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_triple_parity.py'
      - 'formal/PnpTripleParity.lean'
      - '.github/workflows/pnp-asymptotic-frontier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_triple_parity.py' -v
          python -m unittest discover -s tests -p 'test_pnp_hypothesis_synthesis.py' -v
          mkdir -p artifacts/pnp-asymptotic
          python -m mathos.research.pnp_asymptotic_frontier --checkpoint artifacts/pnp-asymptotic/checkpoint.json > artifacts/pnp-asymptotic/report.json
          python -c "import json; r=json.load(open('artifacts/pnp-asymptotic/report.json')); assert r['completion']=='scoped_family_research_completed' and len(r['probes'])==12 and all(p['v6_certificate_replayed'] for p in r['probes']) and r['universal_obligation']=='unresolved'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-asymptotic-evidence
          path: artifacts/pnp-asymptotic/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          mkdir -p artifacts/pnp-asymptotic-formal
          lean -DwarningAsError=true formal/PnpTripleParity.lean | tee artifacts/pnp-asymptotic-formal/lean.txt
          for theorem in localReduction allBlocks satEquivalence seedFamily; do
            grep -Fx "'PnpTripleParity.$theorem' does not depend on any axioms" artifacts/pnp-asymptotic-formal/lean.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-asymptotic-formal-evidence
          path: artifacts/pnp-asymptotic-formal/
