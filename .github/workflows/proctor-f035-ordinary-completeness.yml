name: Proctor F035 ordinary typed refutation completeness
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'docs/research/tga-universal/PNP-F035-ORDINARY-COMPLETENESS.md'
      - '.github/workflows/proctor-f035-ordinary-completeness.yml'
  push:
    branches: [main, 'research/pnp-f035-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f035-ordinary-completeness
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f035-ordinary-completeness
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorUnboundedCodec.lean formal/ProctorUnboundedRoundtrip.lean formal/ProctorResolutionBridge.lean formal/ProctorOrdinaryCompleteness.lean formal/ProctorOrdinaryCompletenessMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F035_ORDINARY_COMPLETENESS_OK pairs=16 singles=4 empty=2 sparse=1 zero=1' "$out/kernel.txt"
          python -m mathos.research.tga_pnp_resolution_gap > "$out/gap-report.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f035-ordinary-completeness")
          lines = set((out / "kernel.txt").read_text().splitlines())
          groups = {"ProctorOrdinaryCompleteness": ["clause_alternative","formula_alternative","false_row","lookup_exists","reach_trans","reach_mem","weaken_reach","resolve_reach","cover_branch","covered_false","split_complete","row_var_mem","variable_mem","reach_refutation","reach_trace","empty_complete","sequential_complete","typed_complete","typed_iff"]}
          names = [f"{ns}.{name}" for ns, ds in groups.items() for name in ds]
          assert len(names)==19
          for name in names:
              if f"'{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: {name}")
          gap = json.loads((out/"gap-report.json").read_text())
          assert gap["PNP_RESOLUTION_STATUS"]=="OPEN"
          assert gap["mathematical_resolution"]["status"]=="BLOCKED"
          report = dict(scope="ORDINARY_TYPED_REFUTATION_COMPLETENESS",
                        verified=names, axiom_gate=True, controls=24,
                        ordinary_typed_completeness_verified=True,
                        executable_generator_refinement_verified=False,
                        bound_envelope_completeness_verified=False,
                        universal_decimal_encoder_verified=False,
                        total_cost_semantics_verified=False,
                        polynomial_certificate_completeness_verified=False,
                        deterministic_polynomial_discovery_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256={ns:hashlib.sha256(Path("formal/"+ns+".lean").read_bytes()).hexdigest()
                                       for ns in groups})
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f035-ordinary-completeness-evidence
          path: artifacts/f035-ordinary-completeness/
