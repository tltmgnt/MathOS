name: Proctor F036 fractional capacity audit
on:
  push:
    branches: ['research/pnp-f036-fractional-capacity']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install scipy==1.17.0
      - run: |
          set -euo pipefail
          python -m mathos.research.f036_fractional_capacity | tee /tmp/fractional-capacity.txt
          grep -Fx 'F036_FRACTIONAL_CAPACITY_OK unsat=36 sat=12 random=256 rejection=3 unknown=1' /tmp/fractional-capacity.txt
