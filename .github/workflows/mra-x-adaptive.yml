name: MRA-X adaptive structural edit
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-adaptive.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-adaptive.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_adaptive.py --output adaptive-evidence.json
      - name: Verify reproducible non-timing evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_adaptive as a
          import mra_x_gap_agent as g
          r=json.load(open('adaptive-evidence.json'))
          def stable(x):
              h=x.pop('evidence_sha256')
              assert g.digest(x)==h
              x.pop('performance')
              return x
          assert len(r['rows'])==120 and r['controls']==5
          assert all(x['actual']<=x['upper']<=x['full'] for x in r['rows'])
          expected={'actual':13171,'upper':13501,'full':34813,'hits':2123,'fixed':19744,'fixed_hierarchy':13025,'fresh':32850,'order_changed':18}
          assert all(sum(x[k] for x in r['rows'])==v for k,v in expected.items())
          assert stable(r)==stable(a.audit())
          PY
