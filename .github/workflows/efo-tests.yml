name: MathOS EFO Unit Tests

on:
  push:
    branches: [main]
    paths:
      - 'mathos/efo.py'
      - 'tests/test_mathos_efo.py'
      - '.github/workflows/efo-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  efo-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline EFO unit tests
        run: python -m unittest discover -s tests -p 'test_mathos_efo.py' -v
