name: MRA-X adaptive proof synthesis
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-proofarbitrate.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-proofarbitrate.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Z3 from Ubuntu package sources
        run: |
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libz3-4
      - run: python3 tools/mra_x_proofarbitrate_audit.py --directory proof-audit
      - run: python3 tools/mra_x_proofarbitrate_audit.py --directory proof-replay
      - name: Check deterministic proof synthesis and fallback evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_boundproof as p
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert p.digest(r)==h
              for key in ('timings','totals_ns'): r.pop(key)
              return r
          r=stable('proof-audit/evidence.json')
          assert r==stable('proof-replay/evidence.json')
          assert len(r['rows'])==240 and len(r['controls'])==14
          assert sum(x['optimum'] is not None for x in r['rows'])==209
          assert sum(x['methods']['selector']['kind']=='partition' for x in r['rows'])==238
          for mode,nodes,rows,bytes_ in [('original',5317,168588,544544),('cached',5317,168588,544544),('adaptive',4181,138103,537517)]:
              rr=[x['methods'][mode] for x in r['rows']]
              assert sum(x['receipt']['nodes'] for x in rr)==nodes
              assert sum(x['receipt']['row_checks'] for x in rr)==rows
              assert sum(x['bytes'] for x in rr)==bytes_
          assert sum(x['methods']['selector']['bytes'] for x in r['rows'])==537403
          assert sum(x['result']=='unsat' for x in r['symbolic'])==2
          assert sum(x['result']=='sat' for x in r['symbolic'])==1
          PY
