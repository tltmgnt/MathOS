name: Proctor F037 adversarial selector audit
on:
  push:
    branches: ['research/pnp-f037-adversarial-selector']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install scipy==1.17.0
      - run: |
          set -euo pipefail
          python -m mathos.research.f037_adversarial_selector | tee /tmp/adversarial.txt
          grep -Fx 'F037_ADVERSARIAL_SELECTOR_OK bounded_pairs=1024 variables=3 vocabulary=26 witness=1' /tmp/adversarial.txt
