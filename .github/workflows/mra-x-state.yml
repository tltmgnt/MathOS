name: MRA-X durable state
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-state.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-state.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_state.py --output state-evidence.json
      - name: Verify deterministic evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_state as s
          import mra_x_gap_agent as g
          r=json.load(open('state-evidence.json'))
          assert r==s.audit()
          h=r.pop('evidence_sha256')
          assert g.digest(r)==h
          assert len(r['rows'])==120 and r['restarts']==36 and r['controls']==7
          expected={'rebuilt':36,'actual':23989,'full':33897,'feasible':108}
          assert all(sum(x[k] for x in r['rows'])==v for k,v in expected.items())
          PY
