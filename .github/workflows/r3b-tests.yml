name: Omega R3B Benchmark Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free benchmark tests
        run: python -m unittest discover -s tests -p 'test_r3b*.py' -v
      - name: Verify report CLI
        run: python -m mathos.r3b_report --help
