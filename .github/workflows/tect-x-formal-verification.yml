name: TECT-X independently typed finite-topology Lean proof certificates

on:
  pull_request:
    paths:
      - 'formal/TECTXFiniteTopology*.lean'
      - 'docs/research/TECT_X_FORMAL*'
      - 'mathos/research/tect_x_formal_certificates.py'
      - 'mathos/research/tect_x_intelligent_proof_verifier.py'
      - 'docs/research/TECT_X_PROOF_VERIFIER_CASES.v1.json'
      - 'docs/research/TECT_X_THEMATIC_REGISTER.v1.json'
      - 'tests/test_tect_x_formal_certificates.py'
      - 'mathos/research/tect_x_general_graph_certificates.py'
      - 'docs/research/TECT_X_FINITE_GRAPH_CERTIFICATES.v1.json'
      - 'tests/test_tect_x_general_graph_certificates.py'
      - '.github/workflows/tect-x-formal-verification.yml'
  push:
    branches: [main]
    paths:
      - 'formal/TECTXFiniteTopology*.lean'
      - 'docs/research/TECT_X_FORMAL*'
      - 'mathos/research/tect_x_formal_certificates.py'
      - 'mathos/research/tect_x_intelligent_proof_verifier.py'
      - 'docs/research/TECT_X_PROOF_VERIFIER_CASES.v1.json'
      - 'docs/research/TECT_X_THEMATIC_REGISTER.v1.json'
      - 'tests/test_tect_x_formal_certificates.py'
      - 'mathos/research/tect_x_general_graph_certificates.py'
      - 'docs/research/TECT_X_FINITE_GRAPH_CERTIFICATES.v1.json'
      - 'tests/test_tect_x_general_graph_certificates.py'
      - '.github/workflows/tect-x-formal-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Source audit is not kernel verification
        run: |
          python -m mathos.research.tect_x_formal_certificates \
            --report artifacts/tect-x/formal/static-audit.json
          python -m unittest discover -s tests -p 'test_tect_x_formal_certificates.py' -v
      - name: Independently enumerate finite graph F2 cycles (not kernel check)
        run: |
          python -m mathos.research.tect_x_general_graph_certificates \
            --report artifacts/tect-x/formal/graphs-source-audit.json
          python -m unittest discover -s tests -p 'test_tect_x_general_graph_certificates.py' -v
      - name: Python syntax checks
        run: |
          python -m py_compile mathos/research/tect_x_formal_certificates.py tests/test_tect_x_formal_certificates.py mathos/research/tect_x_general_graph_certificates.py tests/test_tect_x_general_graph_certificates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tect-x-formal-static-audit-not-kernel-check
          path: |
            artifacts/tect-x/formal/static-audit.json
            artifacts/tect-x/formal/graphs-source-audit.json
          if-no-files-found: ignore
          retention-days: 14

  pinned-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install and pin Lean 4.14.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Independently type-check finite F2 claims and audit all transitive axioms
        run: |
          python -m mathos.research.tect_x_formal_certificates \
            --check-lean --lean "$HOME/.elan/bin/lean" \
            --report artifacts/tect-x/formal/kernel-replay.json \
            --artifact-dir artifacts/tect-x/formal
      - name: Bind exact finite certificate back into TGA without mathematical promotion
        run: |
          python -m mathos.research.tect_x_intelligent_proof_verifier \
            --verify-lean-certificate --lean "$HOME/.elan/bin/lean" \
            --report artifacts/tect-x/formal/tga-with-lean.json
      - name: Independently kernel-check all bounded graph cycle spaces and basis injectivity
        run: |
          python -m mathos.research.tect_x_general_graph_certificates \
            --check-lean --lean "$HOME/.elan/bin/lean" \
            --artifact-dir artifacts/tect-x/formal/general-f2 \
            --report artifacts/tect-x/formal/general-f2/report.json
      - name: Retain kernel replay and finite-scope proof module only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tect-x-finite-f2-lean-kernel-4-14-not-clay-proof
          path: artifacts/tect-x/formal/
          if-no-files-found: ignore
          retention-days: 14
