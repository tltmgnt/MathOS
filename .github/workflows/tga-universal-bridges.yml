name: TGA universal implication analysis
on:
  push:
    paths:
      - 'docs/research/tga-universal/**'
      - 'mathos/research/tga_universal_bridges.py'
      - 'tests/test_tga_universal_bridges.py'
      - '.github/workflows/tga-universal-bridges.yml'
  pull_request:
    paths:
      - 'docs/research/tga-universal/**'
      - 'mathos/research/tga_universal_bridges.py'
      - 'tests/test_tga_universal_bridges.py'
      - '.github/workflows/tga-universal-bridges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_tga_universal_bridges.py' -v
      - run: |
          mkdir -p artifacts/tga-universal
          python -m mathos.research.tga_universal_bridges > artifacts/tga-universal/report.json
          cat artifacts/tga-universal/report.json
      - run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.millennium_docx import verify
          p=Path('docs/research/tga-universal/TGA-U001.md')
          d=p.with_suffix('.docx')
          verify(p,d)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tga-universal-bridges
          path: |
            artifacts/tga-universal/report.json
            docs/research/tga-universal/TGA-U001.docx
          if-no-files-found: error
