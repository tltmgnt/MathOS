name: TECT-X global theta Fredholm xi identity
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_theta_fredholm.py'
      - 'tests/test_riemann_theta_fredholm.py'
      - 'docs/research/TECTX_RH_GLOBAL_THETA_FREDHOLM.md'
      - '.github/workflows/riemann-theta-fredholm.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_theta_fredholm.py'
      - 'tests/test_riemann_theta_fredholm.py'
      - 'docs/research/TECTX_RH_GLOBAL_THETA_FREDHOLM.md'
      - '.github/workflows/riemann-theta-fredholm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theta-global-xi-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check theta analytic normalization and adversarial boundaries
        run: python -m unittest discover -s tests -p 'test_riemann_theta_fredholm.py' -v
      - name: Produce theta Fredholm diagnostic
        run: |
          python -m mathos.research.riemann_theta_fredholm --panels 4096 --xmax 12 --theta-terms 8 --output artifacts/riemann/theta_fredholm_xi.json
          python -m json.tool artifacts/riemann/theta_fredholm_xi.json > /dev/null
      - name: No false Hilbert-Polya or RH certification
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/theta_fredholm_xi.json', encoding='utf-8') as file:
              data = json.load(file)
          assert data['status'] == 'GLOBAL_XI_DIVISOR_FROM_CLASSICAL_THETA_IDENTITY_NOT_HILBERT_POLYA'
          assert not any(data['assurance'].values())
          assert not data['operator']['is_fixed_self_adjoint_operator']
          assert data['operator']['zero_correspondence_is_from_preexisting_xi_identity']
          assert not data['computation']['numerical_zero_certification']
          PY
