name: TECT-X Hilbert-Polya trace identity gate
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_trace_identity_gate.py'
      - 'tests/test_riemann_trace_identity_gate.py'
      - 'docs/research/TECTX_RH_HILBERT_POLYA_TRACE_IDENTITY_GATE.md'
      - '.github/workflows/riemann-trace-identity-gate.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_trace_identity_gate.py'
      - 'tests/test_riemann_trace_identity_gate.py'
      - 'docs/research/TECTX_RH_HILBERT_POLYA_TRACE_IDENTITY_GATE.md'
      - '.github/workflows/riemann-trace-identity-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  determinant-trace-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fixed Jacobi input regression
        run: python -m unittest discover -s tests -p 'test_riemann_fixed_jacobi.py' -v
      - name: Run determinant and prime-trace adversarial tests
        run: python -m unittest discover -s tests -p 'test_riemann_trace_identity_gate.py' -v
      - name: Generate matrix determinant and trace audit
        run: |
          python -m mathos.research.riemann_trace_identity_gate --size 256 --output artifacts/riemann/trace_identity_gate.json
          python -m json.tool artifacts/riemann/trace_identity_gate.json > /dev/null
      - name: Reject global xi factorization and RH promotion
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/trace_identity_gate.json', encoding='utf-8') as stream:
              report = json.load(stream)
          det = report['infinite_regularized_determinant']
          assert report['status'] == 'GLOBAL_ZERO_FREE_FACTOR_IDENTITY_REFUTED_FOR_FIXED_JACOBI'
          assert det['determinant_nonzero_at_first_zeta_ordinate'] is True
          assert det['zero_free_entire_multiplier_exists'] is False
          assert not any(report['assurance'].values())
          assert report['arithmetic_trace_obligation']['global_identity_proved'] is False
          assert all(v.startswith('OPEN') for v in report['proof_obligations'].values())
          PY
