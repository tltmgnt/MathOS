name: MRA-X deterministic proof guard
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-proofguard.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Train comparator once
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import mra_x_proofeconomics_audit as v
          import mra_x_boundproof as p
          from pathlib import Path
          Path('frozen-model.json').write_bytes(p.canonical(v.train()))
          PY
      - run: python3 tools/mra_x_proofguard_audit.py --model frozen-model.json --directory guard-audit
      - run: python3 tools/mra_x_proofguard_audit.py --model frozen-model.json --directory guard-replay
      - name: Verify deterministic evidence and charged budget
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from collections import Counter
          import mra_x_boundproof as p
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert p.digest(r)==h
              r.pop('timings')
              return r
          r=stable('guard-audit/evidence.json')
          assert r==stable('guard-replay/evidence.json')
          assert len(r['rows'])==180 and len(r['controls'])==15
          assert len({x['name'] for x in r['rows']})==36
          assert sum(x['methods']['guard']['receipt']['optimum'] is not None for x in r['rows'])==130
          assert Counter(x['methods']['guard']['reason'] for x in r['rows'])==dict(direct=138,structure_guard=27,converted=15)
          assert sum(x['methods']['guard']['baseline_units']*x['reads'] for x in r['rows'])==494202
          assert sum(x['methods']['guard']['projected_units'] for x in r['rows'])==453020
          for x in r['rows']:
              a=x['methods']['guard']; b=a['baseline_units']*x['reads']
              assert a['extra_units']<=b//8
              if a['kind']=='partition': assert 10*a['projected_units']<=9*b
              else: assert 8*a['projected_units']<=9*b
              assert all(m['receipt']['optimum']==a['receipt']['optimum'] and m['receipt']['problem_sha256']==a['receipt']['problem_sha256'] for m in x['methods'].values())
          PY
