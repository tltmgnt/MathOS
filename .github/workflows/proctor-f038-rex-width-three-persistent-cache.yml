name: Proctor F038 RE-X persistent residual block cache
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-persistent-cache']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent graph, edge-list, traces and candidate ceilings
        run: |
          node mathos/research/f038_rex_width_three_persistent_cache_audit.js > /tmp/d6k.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6k.json');for(const [k,v] of Object.entries({cases:679,modes:1358,cacheBuilds:72,cacheBlocks:360,cacheMaskBits:18180,cacheDirBits:8966,cacheChecks:3060,cachedCandidates:2174,cachedComponents:886,firstEntries:288,laterEntries:598,localRewinds:1288,oldISteps:55342459,sat:1116,unsat:242,probeStarts:256,probeAborts:78,directResumes:6,probeTrials:658,probeSat:178,probeUnsat:0,conditioned:72,one:16,two:56,twoSat:40,twoUnsat:16,prefixConflicts:22,cacheHits:84,conditionedSat:52,conditionedUnsat:20,fallback:1068,early:218,visits:4520,conflicts:2668,components:7022,separators:288,localChecks:4520,graphChecks:7022,improved:44,regressed:1096,tied:218,oldSteps:55400063,newSteps:51876507}))a.equal(r[k],v,k);a.deepEqual(r.ir,[14099,14098]);const h=r.rows.find(x=>x.name==='hard-two-4-sat');a.equal(h.clock,9112116022);a.equal(h.oldClock,20844546480);console.log('D6K_PERSISTENT_CACHE_OK')"
      - name: Independent separator-conditioned host reference
        run: |
          node mathos/research/f038_rex_width_three_separator_reference.js > /tmp/d6k-separator.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6k-separator.json');for(const [k,v] of Object.entries({cases:513,sat:451,unsat:62,selected:73,one:49,two:24,assignments:280,candidates:5661}))a.equal(r[k],v,k);console.log('D6K_SEPARATOR_REFERENCE_OK')"
      - name: Hard connected separator family
        run: |
          node mathos/research/f038_rex_width_three_two_prefix_hard.js > /tmp/d6k-hard.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6k-hard.json');a.equal(r.cases,4);a.equal(r.modes,8);const s=r.rows.find(x=>x.m===3&&!x.unsat&&!x.full);a.equal(s.visits,82);a.equal(s.oldVisits,1489);a.equal(s.clock,9450537036);a.equal(s.oldClock,53785925578);console.log('D6K_HARD_SEPARATOR_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D6K_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [empty, empty-domain, cross-sat, one-prefix-sat, one-prefix-unsat, two-prefix-unsat, two-prefix-sat, prefix-pair, easy-two-center, direct-resume, hard-2-sat, hard-3-sat, hard-4-sat]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector replay, quotient and cutoff
        run: node --max-old-space-size=4096 mathos/research/f038_rex_width_three_persistent_cache_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native original-format replay and one-short cutoff
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node --max-old-space-size=4096 "${p}_persistent_cache_replay.js" "$mode" descriptor > /tmp/d6k.desc
          node "${p}_persistent_cache_replay.js" "$mode" fixtures > /tmp/d6k.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d6k-native
          /tmp/d6k-native /tmp/d6k.desc /tmp/d6k.fixtures > /tmp/d6k-native.out
          python -m mathos.research.f038_rex_width_three_persistent_cache_native_verify /tmp/d6k.fixtures /tmp/d6k-native.out "$mode"
