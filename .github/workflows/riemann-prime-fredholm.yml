name: TECT-X prime Fredholm arithmetic RH boundary
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_prime_fredholm.py'
      - 'tests/test_riemann_prime_fredholm.py'
      - 'docs/research/TECTX_RH_PRIME_FREDHOLM_BOUNDARY.md'
      - '.github/workflows/riemann-prime-fredholm.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_prime_fredholm.py'
      - 'tests/test_riemann_prime_fredholm.py'
      - 'docs/research/TECTX_RH_PRIME_FREDHOLM_BOUNDARY.md'
      - '.github/workflows/riemann-prime-fredholm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prime-determinant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check prime Fredholm model, traces, Euler tails and negative boundaries
        run: python -m unittest discover -s tests -p 'test_riemann_prime_fredholm.py' -v
      - name: Produce reproducible finite operator report
        run: |
          python -m mathos.research.riemann_prime_fredholm --sigma 2 --height 0 --prime-bound 997 --depth 6 --output artifacts/riemann/prime_fredholm.json
          python -m json.tool artifacts/riemann/prime_fredholm.json > /dev/null
      - name: Prevent promotion of half-plane identity to global RH proof
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/prime_fredholm.json', encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['status'] == 'PROVED_HALF_PLANE_ONLY_GLOBAL_ZERO_CORRESPONDENCE_OPEN'
          assert not any(report['assurance'].values())
          assert report['operator_theorem']['global_identity'] == 'NOT_DERIVED'
          assert report['operator_theorem']['nontrivial_zero_correspondence'] == 'NOT_DERIVED'
          PY
