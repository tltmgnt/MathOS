name: MRA-X incremental certificate materialization
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-material.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_material_audit.py --directory material-audit
      - run: python3 tools/mra_x_material_audit.py --directory material-replay
      - name: Check deterministic mathematical evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','decision'): r.pop(key)
              return r
          r=stable('material-audit/evidence.json')
          assert r==stable('material-replay/evidence.json')
          assert len(r['rows'])==6 and r['controls']==29
          for method in ('fork','owned','share','material'):
              rr=[x for y in r['rows'] for x in y[method]['rows']]
              assert len(rr)==96 and sum(x['optimum'] is not None for x in rr)==90
              assert tuple(sum(x[k] for x in rr) for k in ('actual','full','fresh','hits'))==(12435,43954,11812,2998)
          totals={key:sum(y['material']['material'][key] for y in r['rows']) for key in ('packed_hits','packed_misses')}
          assert totals==dict(packed_hits=6455,packed_misses=2281)
          PY
