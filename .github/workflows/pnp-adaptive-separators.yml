name: PNP adaptive certified separators
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_adaptive_separators.py'
      - '.github/workflows/pnp-adaptive-separators.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_adaptive_separators.py'
      - '.github/workflows/pnp-adaptive-separators.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_adaptive_separators.py' -v
          python -m unittest discover -s tests -p 'test_pnp_generalized_escape.py' -v
          mkdir -p artifacts/pnp-adaptive
          python -m mathos.research.pnp_adaptive_separators > artifacts/pnp-adaptive/report.json
          python -c "import json; r=json.load(open('artifacts/pnp-adaptive/report.json')); assert [x['adaptive']['status'] for x in r['controls']]==['sat_witness','unsat_tree','unknown'] and r['universal_obligation']=='unresolved'"
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-adaptive-separator-evidence
          path: artifacts/pnp-adaptive/
