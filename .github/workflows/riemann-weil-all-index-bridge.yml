name: TECT-X Weil all-index and canonical test topology bridge
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_all_index_bridge.py'
      - 'tests/test_riemann_weil_all_index_bridge.py'
      - 'docs/research/TECTX_WEIL_ALL_INDEX_AND_TEST_TOPOLOGY_BRIDGE.md'
      - '.github/workflows/riemann-weil-all-index-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_all_index_bridge.py'
      - 'tests/test_riemann_weil_all_index_bridge.py'
      - 'docs/research/TECTX_WEIL_ALL_INDEX_AND_TEST_TOPOLOGY_BRIDGE.md'
      - '.github/workflows/riemann-weil-all-index-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-index-and-test-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exact rational all-index spectral floors and compact test enumeration
        run: python -m unittest discover -s tests -p 'test_riemann_weil_all_index_bridge.py' -v
      - name: Generate test-topology proof obligation report
        run: |
          python -m mathos.research.riemann_weil_all_index_bridge --dimension 32 --bump-count 24 --output artifacts/riemann/weil_all_index_bridge.json
          python -m json.tool artifacts/riemann/weil_all_index_bridge.json >/dev/null
      - name: Independent exact rational and negative-PSD trust boundary gate
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_all_index_bridge.json', encoding='utf-8') as f:
              r=json.load(f)
          s=r['existing_signed_operator']
          assert Fraction(s['unconditional_all_index_lower']) == -Fraction(10000,3)*(1-Fraction(1,4**32))
          assert Fraction(s['given_prefix3_bound_for_all_m_ge_3']) == -Fraction(1875,4)
          assert not s['nonnegative_floor_for_all_dimensions_proved']
          d=r['canonical_weil_domain']
          assert d['basis_countably_infinite']
          assert d['span_dense_in_D_LF_topology']
          assert d['W_continuous_on_D']
          assert not d['all_finite_bump_Gram_psd_proved']
          assert not r['gaussian_vs_compact_bump']['prior_family_inside_Cc_infinity_log_coordinate']
          assert not any(r['assurance'].values())
          PY
