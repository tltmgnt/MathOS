name: Lean-first registered claim gate

on:
  pull_request:
    paths:
      - 'formal/SATSupport.lean'
      - 'docs/research/LEAN_FIRST_CLAIMS.v1.json'
      - 'mathos/research/lean_first.py'
      - 'tests/test_lean_first.py'
      - 'docs/implementation/LEAN_FIRST.md'
      - '.github/workflows/lean-first-claims.yml'
  push:
    branches: [main]
    paths:
      - 'formal/SATSupport.lean'
      - 'docs/research/LEAN_FIRST_CLAIMS.v1.json'
      - 'mathos/research/lean_first.py'
      - 'tests/test_lean_first.py'
      - 'docs/implementation/LEAN_FIRST.md'
      - '.github/workflows/lean-first-claims.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-lean-claim-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run registry and failure-path tests without Lean
        run: |
          python -m unittest discover -s tests -p 'test_lean_first.py' -v
          python -m mathos.research.lean_first inspect --output artifacts/lean-first/inspect-only.json
      - name: Install pinned Lean 4.14.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Independently replay all registered propositions and axiom audits
        run: |
          python -m mathos.research.lean_first verify \
            --lean "$HOME/.elan/bin/lean" \
            --output artifacts/lean-first/kernel-replay.json
          python -m json.tool artifacts/lean-first/kernel-replay.json >/dev/null
      - name: Confirm Lean rejects a false theorem
        shell: bash
        run: |
          printf 'example : False := by trivial\n' >/tmp/MathOSFalseTheorem.lean
          if lean /tmp/MathOSFalseTheorem.lean >/tmp/mathos-false-control.log 2>&1; then
            echo "::error::Lean accepted the deliberately false proof control"
            exit 1
          fi
          echo "False theorem rejected as expected"
      - name: Retain scoped proof audit, not a research certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathos-lean-first-bounded-claims
          path: artifacts/lean-first/
          if-no-files-found: ignore
          retention-days: 14
