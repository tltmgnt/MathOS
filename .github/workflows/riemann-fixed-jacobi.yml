name: TECT-X fixed Jacobi Hilbert-Polya negative control
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_fixed_jacobi.py'
      - 'tests/test_riemann_fixed_jacobi.py'
      - 'docs/research/TECTX_RH_FIXED_JACOBI_HILBERT_POLYA_GATE.md'
      - '.github/workflows/riemann-fixed-jacobi.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_fixed_jacobi.py'
      - 'tests/test_riemann_fixed_jacobi.py'
      - 'docs/research/TECTX_RH_FIXED_JACOBI_HILBERT_POLYA_GATE.md'
      - '.github/workflows/riemann-fixed-jacobi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-arithmetic-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run fixed Jacobi and spectral mismatch adversarial tests
        run: python -m unittest discover -s tests -p 'test_riemann_fixed_jacobi.py' -v
      - name: Produce finite Jacobi counting evidence
        run: |
          python -m mathos.research.riemann_fixed_jacobi --count 256 --output artifacts/riemann/fixed_jacobi.json
          python -m json.tool artifacts/riemann/fixed_jacobi.json > /dev/null
      - name: Reject Hilbert-Polya or RH proof promotion
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/fixed_jacobi.json', encoding='utf-8') as source:
              report = json.load(source)
          op = report['operator']
          assert op['is_fixed_self_adjoint']
          assert not op['is_hilbert_polya_realization']
          assert op['first_ordinate_spectral_mismatch']
          assert not any(report['assurance'].values())
          for row in report['finite_diagnostic']['counting_rows']:
              assert row['unperturbed_lower'] <= row['jacobi_count_below'] <= row['unperturbed_upper']
          PY
