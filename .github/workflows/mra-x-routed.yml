name: MRA-X routed verification
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-routed.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_routed_audit.py --directory routed-audit
      - run: python3 tools/mra_x_routed_audit.py --directory routed-replay
      - name: Check deterministic mathematical evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','decision'): r.pop(key)
              return r
          r=stable('routed-audit/evidence.json')
          assert r==stable('routed-replay/evidence.json')
          assert len(r['rows'])==9 and r['controls']==14
          for policy,expected in [('full',(17803,36911,0,77532,0)),('incremental',(17803,15054,2269,33371,0)),('routed',(17803,15054,2269,33371,8157))]:
              rows=[x for y in r['rows'] for x in y[policy]]
              assert len(rows)==108 and sum(x['optimum'] is not None for x in rows)==99
              assert tuple(sum(x[k] for x in rows) for k in ('actual','fresh','hits','lookups','routes'))==expected
          PY
