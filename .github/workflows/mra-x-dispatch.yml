name: MRA-X learned dispatch
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-dispatch.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-dispatch.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_dispatch.py --output dispatch-evidence.json
      - name: Verify evidence without requiring a specific timing result
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_gap_agent as g
          import mra_x_dispatch as d
          r=json.load(open('dispatch-evidence.json'))
          h=r.pop('evidence_sha256')
          assert g.digest(r)==h
          assert g.digest(r['model'])==r['model_sha256']
          assert len(r['train'])==len(r['holdout'])==18
          assert sum(x['checks'] for x in r['train']+r['holdout'])==1980
          assert r['controls']==4
          assert all(d.choose(r['model'],x['features'])==x['selected'] for x in r['holdout'])
          assert not ({x['instances_sha256'] for x in r['train']} & {x['instances_sha256'] for x in r['holdout']})
          PY
