name: Proctor F038 branchwidth adapter
on:
  push:
    branches: ['research/pnp-f038-branchwidth-adapter']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_branchwidth_adapter.py
          python -m mathos.research.f038_separator_discovery | tee /tmp/discovery.txt
          grep -Fx 'F038_SEPARATOR_OPTIMUM_OK cases=219 states=3489 split_trials=7154 trees=7135 rank_checks=3489 balanced_worse=51 width_hist=26,42,146,5 corrupt_rejected=219' /tmp/discovery.txt
          grep -Fx 'F038_SEPARATOR_ALL_TREE_BARRIER_OK sizes=3,4,5 widths=2,3,4 bounds=2,3,4 states=8,64,1024 split_trials=6,301,28501' /tmp/discovery.txt
          grep -Fx 'F038_SEPARATOR_CYCLE_DISCOVERY_OK sizes=3,4,7,8,15,16,31,32 bad_widths=3,4,7,8,15,16,31,32 optimal_width_each=2 max_rank=32' /tmp/discovery.txt
          python -m mathos.research.f038_branchwidth_adapter | tee /tmp/adapter.txt
          grep -Fx 'F038_CONNECTIVITY_ORACLE_OK cases=219 cuts=3489 symmetry=3489 submodularity=79329 strict=34572' /tmp/adapter.txt
          grep -Fx 'F038_ARBITRARY_TREE_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 nodes=7860 joins=3074 pairs=11483 compatible=4000 entries=11676 max_width=3 projection_checks=18496' /tmp/adapter.txt
          grep -Fx 'F038_DISCOVERY_EXECUTION_OK cycles=8 sat=4 unsat=4 width_each=2 malformed_rejected=16 budget_rejected=8 corrupt_rejected=4' /tmp/adapter.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_BRANCHWIDTH_ADAPTER_GATE_OK status=OPEN')
          PY
