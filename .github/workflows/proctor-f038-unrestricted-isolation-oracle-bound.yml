name: Proctor F038 unrestricted isolation oracle bound
on:
  push:
    branches: ['research/pnp-f038-unrestricted-isolation-oracle-bound']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_isolation_oracle_bound.py
          python -m mathos.research.f038_unrestricted_isolation_oracle_bound | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_ISOLATION_ORACLE_BOUND_OK {"inequalities":803,"layouts":[[2,31,37914,12,27,512,729,8,216,84],[3,50,161851,39,216,19683,46656,8,1728,662],[4,69,428744,84,729,262144,531441,8,5832,2232]],"peels":[[1,1,0,1,1],[2,5,2,1,2],[3,37,30,1,3],[4,697,712,1,4]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_ISOLATION_ORACLE_BOUND_GATE_OK status=OPEN promotion=NONE')
          PY
