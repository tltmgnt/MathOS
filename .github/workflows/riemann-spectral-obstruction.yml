name: TECT-X RH spectral obstruction
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_spectral_obstruction.py'
      - 'tests/test_riemann_spectral_obstruction.py'
      - 'docs/research/TECTX_RH_SPECTRAL_DILATION_OBSTRUCTION.md'
      - '.github/workflows/riemann-spectral-obstruction.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_spectral_obstruction.py'
      - 'tests/test_riemann_spectral_obstruction.py'
      - 'docs/research/TECTX_RH_SPECTRAL_DILATION_OBSTRUCTION.md'
      - '.github/workflows/riemann-spectral-obstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-spectral-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test exact dilation spectrum counts and noncertification
        run: python -m unittest discover -s tests -p 'test_riemann_spectral_obstruction.py' -v
      - name: Produce finite audit artifact
        run: |
          python -m mathos.research.riemann_spectral_obstruction --max-radius 12 --phase-numerator 1 --phase-denominator 2 --output artifacts/riemann/spectral_obstruction.json
          python -m json.tool artifacts/riemann/spectral_obstruction.json > /dev/null
      - name: Confirm no RH proof promotion
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/spectral_obstruction.json', encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['status'] == 'BOUNDED_TOY_SPECTRAL_AUDIT_NOT_RH_PROOF'
          assert not any(report['assurance'].values())
          assert all(row['unit_interval_increment'] == 1 for row in report['fixed_log_interval']['exact_sample_rows'])
          PY
