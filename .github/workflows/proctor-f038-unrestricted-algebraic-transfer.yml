name: Proctor F038 unrestricted algebraic transfer
on:
  push:
    branches: ['research/pnp-f038-unrestricted-algebraic-transfer']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_algebraic_transfer.py
          python -m mathos.research.f038_unrestricted_algebraic_transfer | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_ALGEBRAIC_TRANSFER_OK {"accepts":235,"checks":2688,"rows":[[2,8,4096,2923,4096,516,4,2,4],[3,8,69984,13698,157464,19688,4,2,4]],"traceAccepts":0,"traceChecks":3223}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_ALGEBRAIC_TRANSFER_GATE_OK status=OPEN promotion=NONE')
          PY
