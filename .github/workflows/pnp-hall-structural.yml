name: PNP Hall structural certificate route
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_hall_*.py'
      - 'tests/test_pnp_hall_certificate.py'
      - 'formal/PnpHallCertificate.lean'
      - '.github/workflows/pnp-hall-structural.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_pnp_adaptive_decision.py' -v
          python -m unittest discover -s tests -p 'test_pnp_v16_stress.py' -v
          python -m unittest discover -s tests -p 'test_pnp_hall_certificate.py' -v
          mkdir -p artifacts/pnp-hall
          python -m mathos.research.pnp_evidence_benchmark --checkpoint artifacts/pnp-hall/source.json > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark artifacts/pnp-hall/source.json --checkpoint artifacts/pnp-hall/scheduler.json > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark artifacts/pnp-hall/source.json --scheduler artifacts/pnp-hall/scheduler.json --checkpoint artifacts/pnp-hall/failures.json > /dev/null
          python -m mathos.research.pnp_hall_frontier --benchmark artifacts/pnp-hall/source.json --scheduler artifacts/pnp-hall/scheduler.json --failures artifacts/pnp-hall/failures.json --checkpoint artifacts/pnp-hall/report.json | tee artifacts/pnp-hall/summary.json
      - run: |
          python -m mathos.research.pnp_hall_frontier --benchmark artifacts/pnp-hall/source.json --scheduler artifacts/pnp-hall/scheduler.json --failures artifacts/pnp-hall/failures.json --audit artifacts/pnp-hall/report.json --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-hall-evidence
          path: artifacts/pnp-hall/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpHallCertificate.lean | tee /tmp/pnp-hall-lean.txt
          for theorem in exclusiveSelectionInjective deficientSelectionImpossible; do
            grep -Fx "'PnpHallCertificate.$theorem' does not depend on any axioms" /tmp/pnp-hall-lean.txt
          done
