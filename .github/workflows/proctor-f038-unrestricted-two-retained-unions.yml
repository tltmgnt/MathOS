name: Proctor F038 unrestricted two retained unions
on:
  push:
    branches: ['research/pnp-f038-unrestricted-two-retained-unions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_two_retained_unions.js
          node mathos/research/f038_unrestricted_two_retained_unions.js | tee /tmp/current.txt
          grep -Fx 'F038_TWO_RETAINED_UNIONS_OK {"fixtures":16,"totals":[466,0,40,54283,22424,51303,0,2980,0,161560],"forced":[560,186,1187,108566,56639,98888,3315,2980,3383,323120],"frequencyChecks":2112,"unionChecks":170880,"boundChecks":7680,"blockChecks":44000,"greedyChecks":55320,"pairBuilds":12928,"controls":[[3,36,36,54],[5,400,400,500],[9,5184,5184,5832],[17,73984,73984,78608]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_TWO_RETAINED_UNIONS_GATE_OK status=OPEN promotion=NONE')
          PY
