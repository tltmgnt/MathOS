name: Proctor F038 affine bijunctive certificates
on:
  push:
    branches: ['research/pnp-f038-affine-bijunctive-certificates']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_affine_interface.py
          python -m mathos.research.f038_resolution_certificate | tee /tmp/resolution.txt
          grep -Fx 'F038_RESOLUTION_CERTIFICATE_OK graphs=4 charges=284 branch_checks=568 assignments=131728 witnesses=284 clauses=6672 minimal_supports=17652 balanced_cuts=196 cube_cuts=276 max_edges=8 max_clauses=18' /tmp/resolution.txt
          python -m mathos.research.f038_affine_interface | tee /tmp/affine.txt
          grep -Fx 'F038_AFFINE_INTERFACE_OK systems=512 inconsistent=271 consistent=241 bijunctive=237 non_bijunctive=4 projection_checks=1928 closure_checks=4560 hybrid_cases=15168 sat=6972 unsat=8196' /tmp/affine.txt
          grep -Fx 'F038_AFFINE_MIXED_BARRIER_OK cases=4096 parameters=32768 local_checks=851968 source_sat=1360 feasible=2304 max_variables=25 max_rows=12 max_clauses=36' /tmp/affine.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_AFFINE_INTERFACE_GATE_OK status=OPEN')
          PY
