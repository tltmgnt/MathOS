name: Proctor F038 semantic repair projection
on:
  push:
    branches: ['research/pnp-f038-semantic-repair-projection']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_semantic_repair.py
          python -m mathos.research.f038_affine_repair | tee /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 original=4736 remaining=466 deleted=4270 tautologies=3088 flips=1182 candidates=5451 exhausted=1181 fully_reduced=1360 model_checks=3470 restoration_steps=9438' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_FULL_OK formulas=256 sat=255 unsat=1 inconsistent=1 original=896 remaining=0 deleted=896 tautologies=0 flips=896 candidates=896 exhausted=0 fully_reduced=255 model_checks=1920 restoration_steps=6944' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_DENSE_OK sizes=3,8,16,32 deleted=647 retained=0 max_reduced_width=0 corrupt_rejected=8' /tmp/repair.txt
          grep -Fx 'F038_AFFINE_REPAIR_NONCOORDINATE_OK direction=24 weight=2 single_bit_failures=5' /tmp/repair.txt
          python -m mathos.research.f038_semantic_repair | tee /tmp/semantic.txt
          grep -Fx 'F038_SEMANTIC_REPAIR_OK formulas=4096 candidates=24576 bad_empty=18160 queries=163216 forbidden=32168 semantic_exists=20556 local_exists=9088 strict=11468 direction_checks=196608 semantic_directions=149184 local_directions=16936 repairs=4716' /tmp/semantic.txt
          grep -Fx 'F038_SEMANTIC_2CNF_OK formulas=256 candidates=1024 bad_empty=672 queries=3936 forbidden=944 semantic_exists=792 local_exists=304 strict=488 direction_checks=4096 semantic_directions=2840 local_directions=400 repairs=160' /tmp/semantic.txt
          grep -Fx 'F038_SEMANTIC_REPAIR_REDUCTIONS_OK sources=256 sat=255 unsat=1 projection_checks=8192 fixed_checks=256' /tmp/semantic.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_SEMANTIC_REPAIR_GATE_OK status=OPEN')
          PY
