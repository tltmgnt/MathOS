name: Proctor F038 affine separator
on:
  push:
    branches: ['research/pnp-f038-affine-separator']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_affine_separator.py
          python -m mathos.research.f038_affine_direct_sum | tee /tmp/direct.txt
          grep -Fx 'F038_AFFINE_DIRECT_SUM_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 blocks=1136 constants=1680 probes=3312 failed=1344 witnesses=1360 max_rank=3 max_block=3 rank_sum=1599 projection_checks=3890 certificates=2736' /tmp/direct.txt
          grep -Fx 'F038_AFFINE_DIRECT_SUM_FULL_OK formulas=256 sat=255 unsat=1 inconsistent=1 blocks=252 constants=0 probes=1904 failed=896 witnesses=255 max_rank=3 max_block=3 rank_sum=728 projection_checks=1907 certificates=1' /tmp/direct.txt
          grep -Fx 'F038_AFFINE_DIRECT_SUM_CONNECTED_OK sizes=2,4,8,16,32 instances=10 max_global_rank=32 max_block_rank=1 corrupt_rejected=10' /tmp/direct.txt
          python -m mathos.research.f038_affine_separator | tee /tmp/separator.txt
          grep -Fx 'F038_AFFINE_SEPARATOR_OK formulas=4096 sat=1360 unsat=2736 inconsistent=2384 nodes=7860 leaves=4786 joins=3074 entries=11948 leaf_trials=10226 join_trials=12666 compatible=4308 max_boundary=3 max_leaf=3 projection_checks=18496 empty_roots=352' /tmp/separator.txt
          grep -Fx 'F038_AFFINE_SEPARATOR_FULL_OK formulas=256 sat=255 unsat=1 inconsistent=1 nodes=1543 leaves=899 joins=644 entries=8559 leaf_trials=6947 join_trials=27280 compatible=3264 max_boundary=3 max_leaf=3 projection_checks=12000 empty_roots=0' /tmp/separator.txt
          grep -Fx 'F038_AFFINE_SEPARATOR_CYCLE_OK sizes=3,4,7,8,15,16,31,32 widths=3,2,4,2,4,2,4,2 sat=4 unsat=4 max_global_rank=32 corrupt_rejected=8' /tmp/separator.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_AFFINE_SEPARATOR_GATE_OK status=OPEN')
          PY
