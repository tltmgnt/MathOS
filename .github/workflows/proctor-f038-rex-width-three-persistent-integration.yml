name: Proctor F038 RE-X persistent multi-scope GAC
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-persistent-integration']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Persistent field framing, direct propagation and candidate validation
        run: |
          node mathos/research/f038_rex_width_three_persistent_integration_audit.js > /tmp/d5w.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5w.json');a.equal(r.cases,263);a.equal(r.accepted,520);a.equal(r.refused,6);a.equal(r.regressions,520);a.equal(r.streamChecks,526);a.equal(r.arith,20034);console.log('D5W_PERSISTENT_GAC_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5W_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [all-active, ternary-chain, ternary-empty, reverse-chain-cap, radius-three-refusal, ternary-three-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_persistent_integration_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_persistent_integration_replay.js" "$mode" descriptor > /tmp/d5w.desc
          node "${p}_persistent_integration_replay.js" "$mode" fixtures > /tmp/d5w.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5w-native
          /tmp/d5w-native /tmp/d5w.desc /tmp/d5w.fixtures > /tmp/d5w-native.out
          python -m mathos.research.f038_rex_width_three_persistent_integration_native_verify /tmp/d5w.fixtures /tmp/d5w-native.out "$mode"
