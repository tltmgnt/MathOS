name: TECT-X arithmetic spectral RH negative control
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_arithmetic_spectral.py'
      - 'tests/test_riemann_arithmetic_spectral.py'
      - 'docs/research/TECTX_RH_ARITHMETIC_SPECTRAL_TRACE.md'
      - '.github/workflows/riemann-arithmetic-spectral.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_arithmetic_spectral.py'
      - 'tests/test_riemann_arithmetic_spectral.py'
      - 'docs/research/TECTX_RH_ARITHMETIC_SPECTRAL_TRACE.md'
      - '.github/workflows/riemann-arithmetic-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  density-vs-zero-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run adversarial spectral model tests
        run: python -m unittest discover -s tests -p 'test_riemann_arithmetic_spectral.py' -v
      - name: Produce bounded arithmetic spectrum and trace report
        run: |
          python -m mathos.research.riemann_arithmetic_spectral --max-index 2048 --epsilon 1 --output artifacts/riemann/arithmetic_spectral.json
          python -m json.tool artifacts/riemann/arithmetic_spectral.json > /dev/null
      - name: Enforce that matching zero counts cannot certify RH
        run: |
          python - <<'PY'
          import json
          with open('artifacts/riemann/arithmetic_spectral.json', encoding='utf-8') as file:
              report = json.load(file)
          assert report['status'] == 'DENSITY_MATCHES_BUT_ZERO_IDENTITY_REFUTED_FOR_THIS_OPERATOR'
          assert not any(report['assurance'].values())
          assert report['spectrum_and_trace']['first_ordinate_mismatch'] is True
          assert report['spectrum_and_trace']['trace_identity_status'] == 'NOT_DERIVED'
          assert report['spectrum_and_trace']['prime_explicit_formula_status'] == 'NOT_DERIVED'
          for r in report['zero_count_comparison']['rows']:
              assert r['count_bracket_lower'] <= r['arithmetic_count'] <= r['count_bracket_upper']
          PY
