name: Proctor F038 unrestricted batched colors
on:
  push:
    branches: ['research/pnp-f038-unrestricted-batched-colors']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_batched_colors.py
          python -m mathos.research.f038_unrestricted_batched_colors | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_BATCHED_COLORS_OK {"fixtures":17,"sums":[28,4532,4079,303,37246,10652,1033,4114,127872,1867396,7196,18088,986112,31123]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_BATCHED_COLORS_GATE_OK status=OPEN promotion=NONE')
          PY
