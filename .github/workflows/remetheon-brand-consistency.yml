name: REMETHEON brand consistency (not product or trademark certification)

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/brand/**'
      - 'docs/research/TECT_X_INTELLIGENT_PROOF_VERIFIER.md'
      - 'docs/research/TECT_X_FORMAL_VERIFICATION.md'
      - 'docs/research/TECT_X_TYPED_ARGUMENT_VERIFICATION.md'
      - 'tests/test_remetheon_branding.py'
      - '.github/workflows/remetheon-brand-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/brand/**'
      - 'docs/research/TECT_X_INTELLIGENT_PROOF_VERIFIER.md'
      - 'docs/research/TECT_X_FORMAL_VERIFICATION.md'
      - 'docs/research/TECT_X_TYPED_ARGUMENT_VERIFICATION.md'
      - 'tests/test_remetheon_branding.py'
      - '.github/workflows/remetheon-brand-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-scope-and-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify brand identity, links, scoped capabilities and legacy compatibility
        run: |
          python -m unittest discover -s tests -p 'test_remetheon_branding.py' -v
      - name: Validate canonical JSON metadata and Python test syntax
        run: |
          python -m json.tool docs/brand/remetheon.brand.json > /dev/null
          python -m py_compile tests/test_remetheon_branding.py
