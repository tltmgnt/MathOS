name: MRA-X indexed repair
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-indexed.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-indexed.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_indexed.py --output indexed-evidence.json
      - name: Verify stable evidence without asserting timing
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_indexed as i
          import mra_x_gap_agent as g
          r=json.load(open('indexed-evidence.json'))
          assert len(r['rows'])==270 and r['controls']==8
          expected={'actual':25412,'fixed':25412,'meta':21960,'full':94488,'recomputed':2308,'skipped':7052,'changed_messages':2219,'feasible':252}
          assert all(sum(x[k] for x in r['rows'])==v for k,v in expected.items())
          def stable(x):
              h=x.pop('evidence_sha256')
              assert g.digest(x)==h
              for k in ('performance','ratios','worst','decision'): x.pop(k)
              return x
          assert stable(r)==stable(i.audit())
          PY
