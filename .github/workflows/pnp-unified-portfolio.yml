name: PNP unified research portfolio
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_unified_portfolio.py'
      - 'formal/PnpUnified.lean'
      - 'formal/PnpRecursive.lean'
      - '.github/workflows/pnp-unified-portfolio.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_unified_portfolio.py'
      - 'formal/PnpUnified.lean'
      - 'formal/PnpRecursive.lean'
      - '.github/workflows/pnp-unified-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_unified_portfolio.py' -v
          python -m unittest discover -s tests -p 'test_pnp_recursive_separators.py' -v
          mkdir -p artifacts/pnp-unified
          python -m mathos.research.pnp_general_frontier --checkpoint artifacts/pnp-unified/checkpoint.json > artifacts/pnp-unified/report.json
          python -c "import json; r=json.load(open('artifacts/pnp-unified/report.json')); assert r['completion']=='scoped_portfolio_research_completed' and all(x['report']['decision']!='unknown' for x in r['controls']) and r['universal_obligation']=='unresolved'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-unified-evidence
          path: artifacts/pnp-unified/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          mkdir -p artifacts/pnp-unified-formal
          lean -DwarningAsError=true formal/PnpUnified.lean | tee artifacts/pnp-unified-formal/unified.txt
          for theorem in chain liftSat liftUnsat liftVerdict noConflict; do
            grep -Fx "'PnpUnified.$theorem' does not depend on any axioms" artifacts/pnp-unified-formal/unified.txt
          done
          lean -DwarningAsError=true formal/PnpRecursive.lean | tee artifacts/pnp-unified-formal/recursive.txt
          for theorem in bothSound eitherSound treeSound knownSat knownUnsat; do
            grep -Fx "'PnpRecursive.$theorem' does not depend on any axioms" artifacts/pnp-unified-formal/recursive.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-unified-formal-evidence
          path: artifacts/pnp-unified-formal/
