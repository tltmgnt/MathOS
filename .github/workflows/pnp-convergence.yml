name: PNP bidirectional convergence scoped regression
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_convergence.py'
      - 'formal/PnpConvergenceBoundary.lean'
      - 'docs/research/PNP_CONVERGENCE_V3.md'
      - '.github/workflows/pnp-convergence.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_convergence.py'
      - 'formal/PnpConvergenceBoundary.lean'
      - 'docs/research/PNP_CONVERGENCE_V3.md'
      - '.github/workflows/pnp-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_convergence.py' -v
          python -m unittest discover -s tests -p 'test_pnp_outcome_engine.py' -v
          mkdir -p artifacts/pnp-convergence
          python -m mathos.research.pnp_convergence --arena --checkpoint artifacts/pnp-convergence/checkpoint.json > artifacts/pnp-convergence/report.json
          python -c "import json; r=json.load(open('artifacts/pnp-convergence/report.json')); assert r['completion']=='scoped_structural_convergence' and r['evidence']['adversarial_arena']['sat']==[True,False] and r['universal_obligation']=='unresolved'"
          python -m mathos.research.pnp_convergence_dashboard artifacts/pnp-convergence/report.json artifacts/pnp-convergence/dashboard.html
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-convergence-scoped-evidence
          path: artifacts/pnp-convergence/

  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          mkdir -p artifacts/pnp-convergence-formal
          python3 -m mathos.research.pnp_formal_bridge > artifacts/pnp-convergence-formal/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-convergence-formal-evidence
          path: artifacts/pnp-convergence-formal/
