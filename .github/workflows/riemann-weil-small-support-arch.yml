name: TECT-X actual compact-bump Weil archimedean Gram
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_small_support_gram.py'
      - 'tests/test_riemann_weil_small_support_gram.py'
      - 'docs/research/TECTX_WEIL_SMALL_SUPPORT_ARCH_GRAM.md'
      - '.github/workflows/riemann-weil-small-support-arch.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_small_support_gram.py'
      - 'tests/test_riemann_weil_small_support_gram.py'
      - 'docs/research/TECTX_WEIL_SMALL_SUPPORT_ARCH_GRAM.md'
      - '.github/workflows/riemann-weil-small-support-arch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-bump-actual-arithmetic-gram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Adversarial exact rational Weil entry bounds and restricted positivity
        run: python -m unittest discover -s tests -p 'test_riemann_weil_small_support_gram.py' -v
      - name: Generate compact-bump Weil outer interval report
        run: |
          python -m mathos.research.riemann_weil_small_support_gram --count 3 --output artifacts/riemann/weil_small_support_gram.json
          python -m json.tool artifacts/riemann/weil_small_support_gram.json >/dev/null
      - name: Independent rational arithmetic and fail-closed RH gate
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_small_support_gram.json',encoding='utf-8') as file:
              r=json.load(file)
          assert r['status']=='ALL_INDEX_SMALL_SUPPORT_PSD_FROM_CLASSICAL_THEOREM_GLOBAL_RH_OPEN'
          assert r['arithmetic_gram_enclosures']['entry_count']==6
          assert not r['arithmetic_gram_enclosures']['bounds_are_tight_quadrature_enclosures']
          assert not r['arithmetic_gram_enclosures']['individual_archimedean_integrals_numerically_evaluated']
          for entry in r['arithmetic_gram_enclosures']['entries']:
              assert Fraction(entry['archimedean_entry_lower']) <= 0
              assert Fraction(entry['archimedean_entry_upper']) > 0
              assert entry['pole_term_exact']=='0/1'
              assert entry['prime_power_term_exact']=='0/1'
              if entry['i']==entry['j']:
                  assert Fraction(entry['theorem_based_diagonal_lower'])>0
                  assert Fraction(entry['theorem_based_diagonal_lower'])<Fraction(entry['archimedean_entry_upper'])
          assert r['infinite_dimensional_positive_subspace']['all_finite_Gram_Hm_PSD_for_this_RESTRICTED_family']
          assert not r['infinite_dimensional_positive_subspace']['full_canonical_Weil_test_core']
          assert not any(r['assurance'].values())
          PY
