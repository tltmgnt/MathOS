name: Proctor F034 boundary encoder integration
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-encoder-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-encoder-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-encoder-integration
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-encoder-integration
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsDecoderMeter.lean formal/ProctorDecimalBitWidth.lean formal/ProctorBinaryPrimitives.lean formal/ProctorCheckedBinaryScanner.lean formal/ProctorStructuralCounters.lean formal/ProctorFuelFreeParser.lean formal/ProctorIteratorDispatch.lean formal/ProctorIteratorOverhead.lean formal/ProctorParserMeterCompose.lean formal/ProctorInputSensitiveIterator.lean formal/ProctorAmortizedParser.lean formal/ProctorGrammarMeter.lean formal/ProctorAmortizedGrammar.lean formal/ProctorCheckedDecrement.lean formal/ProctorScannerCounters.lean formal/ProctorBytePrepass.lean formal/ProctorParserCounters.lean formal/ProctorNestedParser.lean formal/ProctorFuelFreeDecoder.lean formal/ProctorNarrowVisits.lean formal/ProctorBinaryScannerGates.lean formal/ProctorScannerResourceCompose.lean formal/ProctorEncodeVisits.lean formal/ProctorEncoderIntegration.lean formal/ProctorEncoderIntegrationMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_ENCODER_INTEGRATION_OK scanner=781 boundary=8 lists=1122 headers=8 exact=4' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-encoder-integration")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["core_bound","scan_projection","tokenize_projection","tokenize_bound","resource_bounds","header_bound","list_account","list_projection","list_bound"]
          for name in names:
              if f"'ProctorEncoderIntegration.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorEncoderIntegration.{name}")
          report = dict(scope="BOUNDARY_ENCODER_INTEGRATION",
                        verified=names, axiom_gate=True, scanner_controls=781, boundary_controls=8, list_controls=1122, header_controls=8, exact_controls=4,
                        boundary_encoder_integration_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorEncoderIntegration.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-encoder-integration-evidence
          path: artifacts/f034-encoder-integration/
