name: TECT-X uniform Hilbert-Polya perturbation exclusion
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_uniform_hp_barrier.py'
      - 'tests/test_riemann_uniform_hp_barrier.py'
      - 'docs/research/TECTX_RH_UNIFORM_HILBERT_POLYA_BARRIER.md'
      - '.github/workflows/riemann-uniform-hp-barrier.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_uniform_hp_barrier.py'
      - 'tests/test_riemann_uniform_hp_barrier.py'
      - 'docs/research/TECTX_RH_UNIFORM_HILBERT_POLYA_BARRIER.md'
      - '.github/workflows/riemann-uniform-hp-barrier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-operator-exclusion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check exact rational perturbation barrier and unsafe-claim rejection
        run: python -m unittest discover -s tests -p 'test_riemann_uniform_hp_barrier.py' -v
      - name: Reproduce mathematical exclusion evidence
        run: |
          python -m mathos.research.riemann_uniform_hp_barrier --sample-size 128 --output artifacts/riemann/uniform_hp_barrier.json
          python -m json.tool artifacts/riemann/uniform_hp_barrier.json > /dev/null
      - name: Fail closed on RH proof and zero correspondence
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/uniform_hp_barrier.json', encoding='utf-8') as file:
              report = json.load(file)
          assert report['status'] == 'UNIFORM_BOUNDED_PERTURBATION_FAMILY_REFUTED_AS_HILBERT_POLYA'
          assert Fraction(report['strict_certified_rational_inputs']['margin_strictly_greater_than']) > 0
          assert report['obstruction']['zero_free_factor_identity_possible'] is False
          assert not any(report['assurance'].values())
          PY
