name: Proctor F034 binary proof identifier range refinement
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-binary-proof-range.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-binary-proof-range.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-binary-proof-range
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-binary-proof-range
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsDecoderMeter.lean formal/ProctorDecimalBitWidth.lean formal/ProctorBinaryPrimitives.lean formal/ProctorCheckedBinaryScanner.lean formal/ProctorStructuralCounters.lean formal/ProctorFuelFreeParser.lean formal/ProctorIteratorDispatch.lean formal/ProctorIteratorOverhead.lean formal/ProctorParserMeterCompose.lean formal/ProctorInputSensitiveIterator.lean formal/ProctorAmortizedParser.lean formal/ProctorGrammarMeter.lean formal/ProctorAmortizedGrammar.lean formal/ProctorCheckedDecrement.lean formal/ProctorScannerCounters.lean formal/ProctorBytePrepass.lean formal/ProctorParserCounters.lean formal/ProctorNestedParser.lean formal/ProctorFuelFreeDecoder.lean formal/ProctorNarrowVisits.lean formal/ProctorBinaryScannerGates.lean formal/ProctorScannerResourceCompose.lean formal/ProctorEncodeVisits.lean formal/ProctorCheckerBinaryTests.lean formal/ProctorBinaryLookup.lean formal/ProctorBinaryReferences.lean formal/ProctorDecodedWidth.lean formal/ProctorBinaryInputBinding.lean formal/ProctorBinaryProofRange.lean formal/ProctorBinaryProofRangeMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_BINARY_PROOF_RANGE_OK steps=96 terminals=288 mixed=144 wide=2 decoded=20 positive=1' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-binary-proof-range")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["refs_value","refs_bound","step_value","step_bound","batch_value","batch_bound","support_value","support_bound","groups_value","groups_bound","block_value","block_bound","terminal_value","terminal_bound","proof_value","proof_bound","decoded_proof_fit","decoded_proof_value","decoded_check_value","decoded_check_sound"]
          for name in names:
              if f"'ProctorBinaryProofRange.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorBinaryProofRange.{name}")
          report = dict(scope="BINARY_PROOF_IDENTIFIER_RANGE_REFINEMENT",
                        verified=names, axiom_gate=True, step_controls=96, terminal_controls=288, mixed_controls=144, wide_controls=2, decoded_controls=20, positive_controls=1,
                        binary_proof_range_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorBinaryProofRange.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-binary-proof-range-evidence
          path: artifacts/f034-binary-proof-range/
