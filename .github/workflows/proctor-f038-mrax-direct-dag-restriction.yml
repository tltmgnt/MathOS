name: Proctor F038 MRA-X direct DAG restriction
on:
  push:
    branches: ['research/pnp-f038-mrax-direct-dag-restriction']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_direct_dag_restriction.py
          python -m mathos.research.f038_selector_restriction_formulas | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_SELECTOR_FORMULAS_OK {"blocks":[[6,2,1,2,2,4,2],[12,4,2,4,12,48,24],[24,8,3,8,56,336,168],[48,16,4,16,480,3840,2400],[96,32,5,32,2976,29760,26784]],"controls":4,"formulas":[4096,28672,77824,46320,4],"mux":[[1,4,4,8,16,4,4,16],[2,7,16,64,512,32,32,256],[3,12,256,2048,262144,1024,1024,16384]],"sharing":[[1,3,4,2,4],[2,6,10,4,8],[4,12,46,16,32],[8,24,766,256,512]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_direct_dag_restriction | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_DIRECT_DAG_OK {"controls":4,"isa":[[1,2,5,6,4,8,8,16],[2,4,14,27,16,40,48,256],[3,8,35,84,64,160,208,16384]],"restrictions":[[3,4096,12288,49152,98304,21280,40448,4,5,6],[4,4096,8192,32768,131072,13344,15360,2,2,2]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_DIRECT_DAG_GATE_OK status=OPEN')
          PY
