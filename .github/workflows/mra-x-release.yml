name: MRA-X compressed checkpoint release audit
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-release.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_release_audit.py --directory release-audit
      - run: python3 tools/mra_x_release_audit.py --directory release-replay
      - name: Verify deterministic mathematical evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','decision'): r.pop(key)
              return r
          r=stable('release-audit/evidence.json')
          assert r==stable('release-replay/evidence.json')
          assert len(r['rows'])==6 and r['controls']==19
          assert [(x['version'],x['optimum']) for x in r['crashes']]==[(1,0),(2,-7)]
          for method,expected in [('full',(12354,37715,37715,0)),('routed',(12354,37715,11780,2429)),('candidate',(12354,37715,11780,2429))]:
              rows=[x for y in r['rows'] for x in y[method]['rows']]
              assert len(rows)==108 and sum(x['optimum'] is not None for x in rows)==102
              assert tuple(sum(x[k] for x in rows) for k in ('actual','full','fresh','hits'))==expected
          PY
