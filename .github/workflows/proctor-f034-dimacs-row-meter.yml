name: Proctor F034 DIMACS row meter
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-dimacs-row-meter.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-dimacs-row-meter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-dimacs-row-meter
          python -m unittest discover -s tests -p 'test_tga_proctor_dimacs_fixtures.py' -v
          python -m mathos.research.tga_proctor_dimacs_fixtures artifacts/f034-dimacs-row-meter/data
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-dimacs-row-meter
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsRowMeterMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" -- "$out/data" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_DIMACS_ROW_METER_OK files=73 lexed=63 parsed=56 hand_controls=12' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-dimacs-row-meter")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["row_aux_value","row_aux_good","row_value","row_good","row_bound","row_count","rows_aux_value","rows_aux_bound","rows_value","rows_bound","lex_token_bound","decode_rows_value","decode_rows_bound"]
          for name in names:
              if f"'ProctorDimacsRowMeter.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorDimacsRowMeter.{name}")
          report = dict(scope="SELECTED_DIMACS_ROW_PARSER_CHARGES",
                        verified=names, axiom_gate=True, fixtures=73,
                        hand_controls=12, row_stage_selected_charge_bound_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorDimacsRowMeter.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-dimacs-row-meter-evidence
          path: artifacts/f034-dimacs-row-meter/
