name: Proctor F038 unrestricted adaptive quotients
on:
  push:
    branches: ['research/pnp-f038-unrestricted-adaptive-quotients']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_adaptive_quotients.js
          node mathos/research/f038_unrestricted_adaptive_quotients.js | tee /tmp/current.txt
          grep -Fx 'F038_ADAPTIVE_QUOTIENTS_OK {"fixtures":16,"totals":[30,0,0,530448,34962464,529412,35,23805,0,30,35,127],"weightsChecks":15,"controls":[[2,4,33,9,936,7],[3,8,97,17,2808,22],[4,16,257,33,7488,62],[5,32,641,65,18720,158],[6,64,1537,129,44928,382]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_ADAPTIVE_QUOTIENTS_GATE_OK status=OPEN promotion=NONE')
          PY
