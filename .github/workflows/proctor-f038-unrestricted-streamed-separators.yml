name: Proctor F038 unrestricted streamed separators
on:
  push:
    branches: ['research/pnp-f038-unrestricted-streamed-separators']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_streamed_separators.py
          python -m mathos.research.f038_unrestricted_streamed_separators --repo | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_STREAMED_SEPARATORS_OK {"exponents":["10","62/7","62/21"],"fixtures":18,"nested":[243,[0,256,1344,65536,765,522,0,0],[0,257,1349,65536,765,522,0,0]],"sums":[3331,32611,612,328,2704,64243,2060096,7068,4573,2495,427]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_STREAMED_SEPARATORS_GATE_OK status=OPEN promotion=NONE')
          PY
