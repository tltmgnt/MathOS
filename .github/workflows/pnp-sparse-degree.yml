name: PNP compressed algebraic degree
on:
  push:
    paths:
      - 'mathos/research/pnp_sparse_degree*.py'
      - 'mathos/research/pnp_degree_closure.py'
      - 'mathos/research/pnp_boolean_lift.py'
      - 'mathos/research/pnp_component_parity.py'
      - 'tests/test_pnp_sparse_degree.py'
      - '.github/workflows/pnp-sparse-degree.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_sparse_degree*.py'
      - 'mathos/research/pnp_degree_closure.py'
      - 'mathos/research/pnp_boolean_lift.py'
      - 'mathos/research/pnp_component_parity.py'
      - 'tests/test_pnp_sparse_degree.py'
      - '.github/workflows/pnp-sparse-degree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_sparse_degree.py' -v
          mkdir -p artifacts/pnp-sparse-degree
          python -m mathos.research.pnp_sparse_degree_frontier --checkpoint artifacts/pnp-sparse-degree/report.json > /dev/null
          python -m mathos.research.pnp_sparse_degree_frontier --audit artifacts/pnp-sparse-degree/report.json > artifacts/pnp-sparse-degree/audit.json
          python -c "import json; r=json.load(open('artifacts/pnp-sparse-degree/report.json')); print(json.dumps(r['summary'],indent=2)); assert r['completion']=='completed' and r['summary']['max_verified_variables']==64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-sparse-degree-evidence
          path: artifacts/pnp-sparse-degree/
          if-no-files-found: ignore
