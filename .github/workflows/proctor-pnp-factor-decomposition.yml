name: Proctor PNP factor decomposition
on:
  push:
    paths:
      - 'formal/ProctorFactorDecomposition.lean'
      - 'mathos/research/tga_proctor_factor_decomposition*.py'
      - 'mathos/research/tga_proctor_unrestricted_scope.py'
      - 'tests/test_tga_proctor_factor_decomposition.py'
      - 'docs/research/tga-universal/PNP-F025.md'
      - '.github/workflows/proctor-pnp-factor-decomposition.yml'
  pull_request:
    paths:
      - 'formal/ProctorFactorDecomposition.lean'
      - 'mathos/research/tga_proctor_factor_decomposition*.py'
      - 'mathos/research/tga_proctor_unrestricted_scope.py'
      - 'tests/test_tga_proctor_factor_decomposition.py'
      - 'docs/research/tga-universal/PNP-F025.md'
      - '.github/workflows/proctor-pnp-factor-decomposition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -p 'test_tga_proctor_unrestricted_scope.py' -v
      - run: python -m unittest discover -s tests -p 'test_tga_proctor_factor_decomposition.py' -v
      - run: python -m mathos.research.tga_proctor_factor_decomposition_audit --output-dir artifacts/pnp-factor-decomposition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-f025-decomposition-evidence
          path: artifacts/pnp-factor-decomposition/
          if-no-files-found: error
