name: Proctor F038 unrestricted sparse relation fusion
on:
  push:
    branches: ['research/pnp-f038-unrestricted-sparse-relation-fusion']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_sparse_relation_fusion.py
          python -m mathos.research.f038_unrestricted_sparse_relation_fusion --repo | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_SPARSE_RELATION_FUSION_OK {"fixtures":16,"sums":[74,1739,34624,2824,74026,7811,525824,134508,34624]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_SPARSE_RELATION_FUSION_GATE_OK status=OPEN promotion=NONE')
          PY
