name: TGA finite theorem prover
on:
  pull_request:
    paths:
      - 'mathos/tga_theorem.py'
      - 'tests/test_tga_theorem.py'
      - 'docs/implementation/TGA_FINITE_THEOREM_PROVER.md'
      - '.github/workflows/tga-theorem.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/tga_theorem.py'
      - 'tests/test_tga_theorem.py'
      - 'docs/implementation/TGA_FINITE_THEOREM_PROVER.md'
      - '.github/workflows/tga-theorem.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-entailment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run finite theorem prover and adversarial certificate tests
        run: python -m unittest discover -s tests -p 'test_tga_theorem.py' -v
      - name: Check Python syntax
        run: python -m py_compile mathos/tga_theorem.py
