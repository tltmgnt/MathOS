name: TECT-X actual first two LF-core Weil arithmetic Gram
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_lf_core_first_2x2.py'
      - 'tests/test_riemann_weil_lf_core_first_2x2.py'
      - 'docs/research/TECTX_WEIL_LF_CORE_FIRST_2X2.md'
      - '.github/workflows/riemann-weil-lf-core-first-2x2.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_lf_core_first_2x2.py'
      - 'tests/test_riemann_weil_lf_core_first_2x2.py'
      - 'docs/research/TECTX_WEIL_LF_CORE_FIRST_2X2.md'
      - '.github/workflows/riemann-weil-lf-core-first-2x2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-first-LF-core-two-dimensional-Weil:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin directed interval arithmetic
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Test actual first 2x2 LF-core full arithmetic Weil matrix
        run: python -m unittest discover -s tests -p 'test_riemann_weil_lf_core_first_2x2.py' -v
      - name: Reproduce normalized full prime and archimedean rational Gram
        run: |
          python -m mathos.research.riemann_weil_lf_core_first_2x2 --output artifacts/riemann/weil_lf_core_first_2x2.json
          python -m json.tool artifacts/riemann/weil_lf_core_first_2x2.json >/dev/null
      - name: Independently verify every rational entry and Schur margin
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_lf_core_first_2x2.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r['schema']=='mathos_tectx_weil_lf_core_first_2x2/1'
          assert r['status']=='FIXED_FIRST_TWO_LF_CORE_WEIL_GRAM_POSITIVE_GLOBAL_RH_OPEN'
          a=r['arithmetic']
          assert [(x['n'],x['von_mangoldt_base']) for x in a['prime_power_inventory']]==[
              (2,2),(3,3),(4,2),(5,5),(7,7)]
          assert r['basis']['cross_convolution_support']==['0/1','2/1']
          assert a['gamma_global_second_derivative_upper']==300
          assert Fraction(a['gamma_signed_trapezoid_error_exact'])==Fraction(200,2048**2)
          p_lo,p_hi=map(Fraction,a['offdiagonal_pole_interval'])
          a_lo,a_hi=map(Fraction,a['offdiagonal_archimedean_interval'])
          q_lo,q_hi=map(Fraction,a['offdiagonal_prime_interval'])
          c_lo,c_hi=map(Fraction,a['offdiagonal_full_raw_Weil_interval'])
          d_lo,d_hi=map(Fraction,a['diagonal_full_raw_Weil_interval'])
          m_lo,m_hi=map(Fraction,a['normalizing_mass_interval'])
          # Independently reassemble outward bounds; never merely trust
          # the reported normalized eigenvalue result.
          assert p_lo>0 and a_hi<0 and q_hi<0
          assert p_lo+a_lo+q_lo<=c_lo<=c_hi<=p_hi+a_hi+q_hi
          assert d_lo>0 and m_lo>0
          c_abs=max(abs(c_lo),abs(c_hi))
          raw_margin=d_lo-c_abs
          assert raw_margin==Fraction(a['exact_raw_diagonal_dominance_margin'])
          assert raw_margin>0
          normalized=raw_margin/(m_hi**2)
          assert normalized==Fraction(a['exact_normalized_diagonal_dominance_margin'])
          assert normalized>Fraction(1,10000)
          assert d_lo-c_abs**2/d_lo==Fraction(a['exact_raw_second_Schur_pivot_lower'])
          assert Fraction(a['exact_raw_second_Schur_pivot_lower'])>0
          G=a['full_normalized_Gram_2x2']
          assert len(G)==2 and all(len(row)==2 for row in G)
          assert G[0][1]==G[1][0] and G[0][0]==G[1][1]
          flags=r['assurance']
          assert flags['first_2x2_LF_core_Gram_certified']
          assert not flags['all_finite_LF_core_Gram_PSD']
          assert not flags['all_admissible_test_functions_positive']
          assert not flags['Riemann_hypothesis_proved']
          assert not flags['global_positive_Weil_Hilbert_completion']
          PY
