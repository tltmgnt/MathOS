name: MRA-X content-addressed transactions
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-cas.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_cas_audit.py --directory cas-audit
      - run: python3 tools/mra_x_cas_audit.py --directory cas-replay
      - name: Check deterministic mathematical evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','decision'): r.pop(key)
              # SQLite layout can vary by version/platform, unlike mathematical results.
              for row in r['rows']:
                  for policy in ('routed','cas'): row[policy].pop('physical')
              return r
          r=stable('cas-audit/evidence.json')
          assert r==stable('cas-replay/evidence.json')
          assert len(r['rows'])==6 and r['controls']==13
          for policy in ('routed','cas'):
              rows=[x for y in r['rows'] for x in y[policy]['rows']]
              assert len(rows)==72 and sum(x['optimum'] is not None for x in rows)==66
              assert tuple(sum(x[k] for x in rows) for k in ('actual','full','fresh','hits'))==(9783,25474,9720,1590)
          assert sum(x['cas']['payload']+x['cas']['manifest'] for x in r['rows'])==593476
          assert sum(x['routed']['payload'] for x in r['rows'])==1215988
          PY
