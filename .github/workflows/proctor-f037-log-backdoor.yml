name: Proctor F037 logarithmic backdoor audit
on:
  push:
    branches: ['research/pnp-f037-log-backdoor']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f037_log_backdoor | tee /tmp/backdoor.txt
          grep -Fx 'F037_LOG_BACKDOOR_OK formulas=4096 budgets=3 components=128 cube=256 rejection=3' /tmp/backdoor.txt
