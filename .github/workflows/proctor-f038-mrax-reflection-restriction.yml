name: Proctor F038 MRA-X reflection restriction
on:
  push:
    branches: ['research/pnp-f038-mrax-reflection-restriction']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_reflection_restriction.py
          python -m mathos.research.f038_reflection_transfer | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_REFLECTION_OK {"controls":5,"full":[256,2048,52488,1024,255,1,5120,1024],"primary":[256,2048,52488,192,95,161,3328,1024],"transfers":162}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_reflection_restriction | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,short_proofs,discovery,machine_cost status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_REFLECTION_RESTRICTION_OK {"controls":3,"large":[[8,256,175],[16,65536,343],[32,4294967296,679]],"small":[[1,64,7,57,2,1024,272,28],[2,1024,49,975,4,131072,18496,49],[3,16384,343,16041,8,0,0,70]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_REFLECTION_RESTRICTION_GATE_OK status=OPEN')
          PY
