name: MRA-X portable certificates
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-portable.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-portable.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Z3 from Ubuntu package sources
        run: |
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libz3-4
      - run: python3 tools/mra_x_portable.py --directory portable-audit
      - run: python3 tools/mra_x_portable.py --directory portable-replay
      - run: cmp portable-audit/evidence.json portable-replay/evidence.json
      - name: Verify evidence totals
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_kernel as k
          r=json.load(open('portable-audit/evidence.json'))
          h=r.pop('evidence_sha256')
          assert k.digest(r)==h
          assert len(r['rows'])==94 and r['controls']==17 and r['global_queries']==73
          assert sum(x['optimum'] is not None for x in r['rows'])==38
          assert sum(x['visits'] for x in r['rows'])==20591
          assert sum(x['lookups'] for x in r['rows'])==38944
          PY
