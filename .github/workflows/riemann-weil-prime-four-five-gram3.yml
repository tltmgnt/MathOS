name: TECT-X certified compact Weil 3x3 with prime powers 2 4 5
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_prime_four_five_gram3.py'
      - 'tests/test_riemann_weil_prime_four_five_gram3.py'
      - 'docs/research/TECTX_WEIL_PRIME_4_5_COMPACT_GRAM3.md'
      - '.github/workflows/riemann-weil-prime-four-five-gram3.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_prime_four_five_gram3.py'
      - 'tests/test_riemann_weil_prime_four_five_gram3.py'
      - 'docs/research/TECTX_WEIL_PRIME_4_5_COMPACT_GRAM3.md'
      - '.github/workflows/riemann-weil-prime-four-five-gram3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-weil-prime-four-five-three-dimensional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned outward interval arithmetic
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Validate prime-active actual Weil 3x3 and negative controls
        run: python -m unittest discover -s tests -p 'test_riemann_weil_prime_four_five_gram3.py' -v
      - name: Generate portable full arithmetic matrix certificate
        run: |
          python -m mathos.research.riemann_weil_prime_four_five_gram3 --panels 256 --output artifacts/riemann/weil_prime_four_five_gram3.json
          python -m json.tool artifacts/riemann/weil_prime_four_five_gram3.json >/dev/null
      - name: Independent rational Gershgorin and LDL and non-RH evidence gates
        run: |
          python - <<'PY'
          from fractions import Fraction
          import json
          with open('artifacts/riemann/weil_prime_four_five_gram3.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r['status']=='FIXED_PRIME_2_4_5_3D_WEIL_GRAM_POSITIVE_GLOBAL_RH_OPEN'
          a=r['arithmetic']
          assert a['prime_support']['short_prime_powers']==[2]
          assert a['prime_support']['long_prime_powers']==[4,5]
          assert set(a['new_prime_power_components'])=={'4','5'}
          for component in a['new_prime_power_components'].values():
              assert Fraction(component['interval'][1])<0
          assert Fraction(a['new_long_archimedean_interval'][1])<0
          assert Fraction(a['new_long_pole_interval'][0])>0
          assert a['strict_lambda_min_lower']=='1/200'
          assert Fraction(a['gershgorin_rational_lower'])>Fraction(1,200)
          mat=a['complete_real_symmetric_gram']
          assert len(mat)==3 and all(len(row)==3 for row in mat)
          for i in range(3):
              for j in range(3):
                  assert mat[i][j]==mat[j][i]
          assert len(a['interval_LDL_pivots'])==3
          assert all(Fraction(lo)>0 for lo,hi in a['interval_LDL_pivots'])
          flags=r['trust_boundary']
          assert flags['fixed_3D_positive_definite']
          assert not flags['all_dimension_compact_bump_Weil_positivity']
          assert not flags['global_Weil_positivity']
          assert not flags['Riemann_hypothesis_proved']
          PY
