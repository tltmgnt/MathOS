name: Proctor F038 MRA-X circuit range avoidance
on:
  push:
    branches: ['research/pnp-f038-mrax-circuit-range-avoidance']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_circuit_range_avoidance.py
          python -m mathos.research.f038_reflection_restriction | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_REFLECTION_RESTRICTION_OK {"controls":3,"large":[[8,256,175],[16,65536,343],[32,4294967296,679]],"small":[[1,64,7,57,2,1024,272,28],[2,1024,49,975,4,131072,18496,49],[3,16384,343,16041,8,0,0,70]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_circuit_range_avoidance | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_CIRCUIT_AVOIDANCE_OK {"controls":4,"ranges":[[2,0,4,1,4,4,1],[2,1,4,257,1284,16,-1],[3,1,8,401,2405,38,1],[3,2,8,230801,1615205,152,22],[4,1,16,577,4038,70,1],[4,2,10,452161,3616710,238,1],[3,2,5,230801,1615205,32,-1]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_CIRCUIT_AVOIDANCE_GATE_OK status=OPEN')
          PY
