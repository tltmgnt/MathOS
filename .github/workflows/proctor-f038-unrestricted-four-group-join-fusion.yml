name: Proctor F038 unrestricted four group join fusion
on:
  push:
    branches: ['research/pnp-f038-unrestricted-four-group-join-fusion']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_four_group_join_fusion.js
          node mathos/research/f038_unrestricted_four_group_join_fusion.js | tee /tmp/current.txt
          grep -Fx 'F038_FOUR_GROUP_JOIN_FUSION_OK {"fixtures":13,"sums":[3332,40392,663,205,101,2426,13080,6161,161249,42852,40392],"dense":[[8,1024,48,128,136,4,2664,4032],[16,6144,192,960,1056,7,5328,17280],[24,18432,432,3168,3576,10,7992,39744]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_FOUR_GROUP_JOIN_FUSION_GATE_OK status=OPEN promotion=NONE')
          PY
