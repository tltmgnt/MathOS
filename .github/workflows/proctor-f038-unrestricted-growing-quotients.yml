name: Proctor F038 unrestricted growing quotients
on:
  push:
    branches: ['research/pnp-f038-unrestricted-growing-quotients']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_growing_quotients.js
          node mathos/research/f038_unrestricted_growing_quotients.js | tee /tmp/current.txt
          grep -Fx 'F038_GROWING_QUOTIENTS_OK {"fixtures":36,"totals":[69084,6,69078,363510,24244,24078,166,19,90],"controls":[[2,17,468,5],[4,65,1872,15],[8,257,7488,62],[16,1025,29952,254]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_GROWING_QUOTIENTS_GATE_OK status=OPEN promotion=NONE')
          PY
