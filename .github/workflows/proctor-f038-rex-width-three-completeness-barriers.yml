name: Proctor F038 RE-X complete fixed-nine rank enumeration
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-completeness-barriers']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: GAC counterexamples, exact rank enumeration and conditional resources
        run: |
          node mathos/research/f038_rex_width_three_completeness_barrier.js > /tmp/d5z-barrier.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5z-barrier.json');a.equal(r.cases,8);a.equal(r.bruteTuples,564678);a.equal(r.localChecks,532);a.equal(r.refusals,16);a.equal(r.satFalseNegatives,8);a.equal(r.unsatRefusals,8);console.log('D5Z_GAC_BARRIER_OK')"
          node mathos/research/f038_rex_width_three_complete_odometer_audit.js > /tmp/d5z.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5z.json');a.equal(r.cases,325);a.equal(r.sat,578);a.equal(r.unsat,72);a.equal(r.gain,8);a.equal(r.arith,20034);a.equal(r.clockChecks,578);console.log('D5Z_COMPLETE_ODOMETER_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5Z_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [radius-three-last, chain, empty-domain, barrier-sat, barrier-unsat, third-rank-barrier]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_complete_odometer_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_complete_odometer_replay.js" "$mode" descriptor > /tmp/d5z.desc
          node "${p}_complete_odometer_replay.js" "$mode" fixtures > /tmp/d5z.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5z-native
          /tmp/d5z-native /tmp/d5z.desc /tmp/d5z.fixtures > /tmp/d5z-native.out
          python -m mathos.research.f038_rex_width_three_complete_odometer_native_verify /tmp/d5z.fixtures /tmp/d5z-native.out "$mode"
