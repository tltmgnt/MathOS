name: MRA-X incremental precommit verification
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-precommit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_precommit_audit.py --directory precommit-audit
      - run: python3 tools/mra_x_precommit_audit.py --directory precommit-replay
      - name: Check deterministic evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              r.pop('timings')
              return r
          r=stable('precommit-audit/evidence.json')
          assert r==stable('precommit-replay/evidence.json')
          assert len(r['rows'])==9 and r['controls']==14
          for policy,expected in [('baseline',(14685,39301,0,82413)),('incremental',(14685,13801,2519,30980))]:
              rows=[x for y in r['rows'] for x in y[policy]]
              assert len(rows)==108 and sum(x['optimum'] is not None for x in rows)==99
              assert tuple(sum(x[k] for x in rows) for k in ('actual','fresh','hits','lookups'))==expected
          PY
