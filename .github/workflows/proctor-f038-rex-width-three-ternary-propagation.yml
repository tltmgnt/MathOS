name: Proctor F038 RE-X bounded ternary propagation
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-ternary-propagation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent bounded GAC and resource accounting
        run: |
          node mathos/research/f038_rex_width_three_ternary_audit.js > /tmp/d5k.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5k.json');a.equal(r.count,68);a.equal(r.accepted,40);a.equal(r.refused,28);a.equal(r.gains,2);a.equal(r.losses,0);a.equal(r.falseNeg,1);a.equal(r.empty,27);a.equal(r.cap,1);a.equal(r.arith,10017);console.log('D5K_TERNARY_ORACLE_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5K_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        fixture: [ternary-chain, ternary-empty, ternary-three-rank, reverse-chain-cap, radius-three-refusal]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact original raw-selector replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_ternary_replay.js ${{ matrix.fixture }}
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          node "${p}_ternary_replay.js" descriptor > /tmp/d5k.desc
          node "${p}_ternary_replay.js" fixtures > /tmp/d5k.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5k-native
          /tmp/d5k-native /tmp/d5k.desc /tmp/d5k.fixtures > /tmp/d5k-native.out
          python -m mathos.research.f038_rex_width_three_ternary_native_verify /tmp/d5k.fixtures /tmp/d5k-native.out
