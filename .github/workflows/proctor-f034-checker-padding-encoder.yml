name: Proctor F034 checker padding and encoder resource accounting
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-checker-padding-encoder.yml'
  push:
    branches:
      - main
    paths:
      - 'formal/Proctor*.lean'
      - 'mathos/research/tga_proctor*.py'
      - '.github/workflows/proctor-f034-checker-padding-encoder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f034-checker-padding-encoder
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f034-checker-padding-encoder
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorTerminalPolynomial.lean formal/ProctorEncodedSize.lean formal/ProctorParserConsumption.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsSize.lean formal/ProctorScannerMeter.lean formal/ProctorDimacsLexMeter.lean formal/ProctorDimacsLexerCompose.lean formal/ProctorDimacsRowMeter.lean formal/ProctorDimacsDecoderMeter.lean formal/ProctorDecimalBitWidth.lean formal/ProctorBinaryPrimitives.lean formal/ProctorCheckedBinaryScanner.lean formal/ProctorStructuralCounters.lean formal/ProctorFuelFreeParser.lean formal/ProctorIteratorDispatch.lean formal/ProctorIteratorOverhead.lean formal/ProctorParserMeterCompose.lean formal/ProctorInputSensitiveIterator.lean formal/ProctorAmortizedParser.lean formal/ProctorGrammarMeter.lean formal/ProctorAmortizedGrammar.lean formal/ProctorCheckedDecrement.lean formal/ProctorScannerCounters.lean formal/ProctorBytePrepass.lean formal/ProctorParserCounters.lean formal/ProctorNestedParser.lean formal/ProctorFuelFreeDecoder.lean formal/ProctorNarrowVisits.lean formal/ProctorBinaryScannerGates.lean formal/ProctorScannerResourceCompose.lean formal/ProctorEncodeVisits.lean formal/ProctorPaddingVisits.lean formal/ProctorCheckerBinaryTests.lean formal/ProctorCheckerPaddingEncoder.lean formal/ProctorCheckerPaddingEncoderMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F034_CHECKER_PADDING_ENCODER_OK pairs=961 adapters=1641 wide=16 wideAdapters=4' "$out/kernel.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f034-checker-padding-encoder")
          lines = set((out / "kernel.txt").read_text().splitlines())
          names = ["eq_projection","id_projection","eq_padding_bound","id_padding_bound","checked_gate_projection","checked_padding_bound","checked_encoder_bound","eq_checked_projection","id_checked_projection","eq_bounds","id_bounds","eq_value","id_value"]
          for name in names:
              if f"'ProctorCheckerPaddingEncoder.{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: ProctorCheckerPaddingEncoder.{name}")
          report = dict(scope="CHECKER_PADDING_ENCODER_RESOURCES",
                        verified=names, axiom_gate=True, pair_controls=961, adapter_controls=1641, wide_controls=16, wide_adapter_controls=4,
                        checker_selected_resource_bounds_verified=True,
                        complete_decoder_cost_verified=False,
                        total_cost_semantics_verified=False,
                        bit_machine_refinement_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256=hashlib.sha256(Path("formal/ProctorCheckerPaddingEncoder.lean").read_bytes()).hexdigest())
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f034-checker-padding-encoder-evidence
          path: artifacts/f034-checker-padding-encoder/
