name: Proctor F036 signed counting audit
on:
  push:
    branches: ['research/pnp-f036-signed-counting']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f036_signed_counting | tee /tmp/signed-counting.txt
          grep -Fx 'F036_SIGNED_COUNTING_OK unsat=57 sat=19 bridges=19 random=512 unknown=1' /tmp/signed-counting.txt
