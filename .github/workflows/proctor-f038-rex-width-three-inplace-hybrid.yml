name: Proctor F038 RE-X in-place hybrid constraint execution
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-inplace-hybrid']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: In-place field preservation, direct propagation and resource checks
        run: |
          node mathos/research/f038_rex_width_three_inplace_hybrid_audit.js > /tmp/d5y.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5y.json');a.equal(r.cases,266);a.equal(r.accepted,524);a.equal(r.refused,8);a.equal(r.regressions,524);a.equal(r.streamChecks,532);a.equal(r.arith,20034);a.equal(r.vsPersistentGain,524);a.equal(r.vsPersistentLoss,0);a.equal(r.gammaFields,3);a.equal(r.runFields,391);console.log('D5Y_INPLACE_HYBRID_OK')"
          node mathos/research/f038_rex_width_three_inplace_hybrid_gamma_physical.js
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5Y_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [all-active, ternary-chain, ternary-empty, reverse-chain-cap, radius-three-refusal, ternary-three-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_inplace_hybrid_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_hybrid_replay.js" "$mode" descriptor > /tmp/d5y.desc
          node "${p}_hybrid_replay.js" "$mode" fixtures > /tmp/d5y.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5y-native
          /tmp/d5y-native /tmp/d5y.desc /tmp/d5y.fixtures > /tmp/d5y-native.out
          python -m mathos.research.f038_rex_width_three_inplace_hybrid_native_verify /tmp/d5y.fixtures /tmp/d5y-native.out "$mode"
