name: Proctor F038 unrestricted product isolation
on:
  push:
    branches: ['research/pnp-f038-unrestricted-product-isolation']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_product_isolation.py
          python -m mathos.research.f038_unrestricted_product_isolation | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_PRODUCT_ISOLATION_OK {"layouts":[[2,8,516,256,1560,573,11,16],[3,8,19688,256,1869,34598,6,66]],"probability_counts":[[2,1,2,3,4,12],[2,2,4,15,16,240],[2,3,8,255,64,16320],[3,1,3,7,8,56],[3,2,9,511,64,32704]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_PRODUCT_ISOLATION_GATE_OK status=OPEN promotion=NONE')
          PY
