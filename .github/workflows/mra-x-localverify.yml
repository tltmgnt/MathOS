name: MRA-X dependency-local verification
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-localverify.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_localverify_audit.py --directory local-audit
      - run: python3 tools/mra_x_localverify_audit.py --directory local-replay
      - name: Check deterministic evidence
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_archive as a
          def stable(path):
              r=json.load(open(path))
              h=r.pop('evidence_sha256')
              assert a.digest(r)==h
              for key in ('timings','geomean','worst','adaptive_ratio','decision'): r.pop(key)
              return r
          r=stable('local-audit/evidence.json')
          assert r==stable('local-replay/evidence.json')
          assert len(r['rows'])==6 and r['controls']==16
          for method in ('full','routed','singlepass','local','adaptive'):
              rows=[x for y in r['rows'] for x in y[method]['rows']]
              assert len(rows)==108 and sum(x['optimum'] is not None for x in rows)==100
              expected=(9721,28472,28472,0,3252,7050,0) if method=='full' else (9721,28472,9403,2229,1722,3848,78) if method in ('local','adaptive') else (9721,28472,9403,2229,3252,7050,0)
              assert tuple(sum(x[k] for x in rows) for k in ('actual','full','fresh','hits','keys','routes','local'))==expected
          PY
