name: Proctor F038 TECT-X guarded affine
on:
  push:
    branches: ['research/pnp-f038-tectx-guarded-affine']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_tectx_cycle.py mathos/research/f038_guarded_affine.py
          python -m mathos.research.f038_guarded_learning | tee /tmp/guarded.txt
          grep -Fx 'F038_GUARDED_LEARNING_OK formulas=4096 queries=200704 sat=34112 unsat=166592 model_checks=229376 bad_queries=24576 bad_sat=6416 pinned_queries=172032 pinned_sat=26336' /tmp/guarded.txt
          grep -Fx 'F038_GUARDED_LEARNING_FULL_OK formulas=256 queries=8960 sat=5791 unsat=3169 model_checks=10240 bad_queries=1024 bad_sat=1024 pinned_queries=7680 pinned_sat=4512' /tmp/guarded.txt
          grep -Fx 'F038_GUARDED_REUSE_OK non_up_refutation=1 direct_reuse=4 changed_mode_sat=4 corrupt_rejected=3' /tmp/guarded.txt
          python -m mathos.research.f038_guarded_affine | tee /tmp/tectx.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=ordinary_complete,short_proofs,discovery,machine_cost status=OPEN' /tmp/tectx.txt
          grep -Fx 'F038_TECTX_GUARDED_AFFINE_OK full=256,8960,5791,3169,10240,665,672,512 binary=256,6400,1407,4993,5120,6055,14080,1920 parity_cases=3 split_cases=3 guard_controls=4' /tmp/tectx.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/tectx.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_TECTX_GUARDED_AFFINE_GATE_OK status=OPEN')
          PY
