name: Proctor F036 counting discovery audit
on:
  push:
    branches: ['research/pnp-f036-counting-discovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python mathos/research/f036_counting_discovery.py | tee /tmp/counting-discovery.txt
          grep -Fx 'F036_COUNTING_DISCOVERY_OK shuffled=57 satisfiable=19 subset=1 rejection=3 unknown=1' /tmp/counting-discovery.txt
