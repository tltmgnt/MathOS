name: Round 3 DOCX generation
on:
  push:
    paths:
      - 'docs/research/papers/millennium/*-003.md'
      - '.github/workflows/millennium-round3-docx-bootstrap.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and validate all papers
        run: |
          python scripts/millennium_docx.py --emit-base64 | awk '/^DOCX64/ && $2 !~ /-003$/ {next} {print}'
      - uses: actions/upload-artifact@v4
        with:
          name: millennium-docx-round3
          path: docs/research/papers/millennium/docx/
          if-no-files-found: error
