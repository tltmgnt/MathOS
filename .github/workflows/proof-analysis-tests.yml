name: Proof dependency and adversarial checks

on:
  push:
    branches: [main]
    paths:
      - 'mathos/proof_analysis/**'
      - 'tests/test_proof_*.py'
      - 'result-contract.json'
      - '.github/workflows/proof-analysis-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests and produce scoped evidence
        run: python -m mathos.proof_analysis --run-tests --output-dir artifacts/proof-analysis
      - uses: actions/upload-artifact@v4
        with:
          name: proof-analysis-${{ matrix.python-version }}
          path: artifacts/proof-analysis/
