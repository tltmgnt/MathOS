name: PNP restricted inference complexity
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_inference_complexity.py'
      - 'formal/PnpInferenceComplexity.lean'
      - '.github/workflows/pnp-inference-complexity.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_inference_complexity.py'
      - 'formal/PnpInferenceComplexity.lean'
      - '.github/workflows/pnp-inference-complexity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_inference_complexity.py' -v
          mkdir -p artifacts/pnp-complexity
          python -m mathos.research.pnp_inference_complexity --checkpoint artifacts/pnp-complexity/report.json > /dev/null
          python -m mathos.research.pnp_inference_complexity --audit artifacts/pnp-complexity/report.json > artifacts/pnp-complexity/audit.json
          python -c "import json; r=json.load(open('artifacts/pnp-complexity/report.json')); print(json.dumps(r['summary'],indent=2)); assert r['completion']=='completed' and r['summary']['chain_exact_depth_matches']==9 and r['summary']['cube_exact_width_matches']==6"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-inference-complexity-evidence
          path: artifacts/pnp-complexity/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpInferenceComplexity.lean | tee /tmp/pnp-complexity-lean.txt
          for theorem in capacityPositive leafBound supportNecessary; do
            grep -Fx "'PnpInferenceComplexity.$theorem' does not depend on any axioms" /tmp/pnp-complexity-lean.txt
          done
