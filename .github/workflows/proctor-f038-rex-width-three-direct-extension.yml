name: Proctor F038 RE-X direct functional extension
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-direct-extension']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent direct-extension trace, certificate-first root classes and conditional resources
        run: |
          node mathos/research/f038_rex_width_three_direct_extension_audit.js > /tmp/d6c.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6c.json');a.equal(r.cases,385);a.equal(r.sat,666);a.equal(r.unsat,104);a.equal(r.trials,7200);a.equal(r.conflicts,6534);a.equal(r.skipped,5650004);a.equal(r.leaps,3104);a.equal(r.improved,86);a.equal(r.tied,382);a.equal(r.regressed,198);a.equal(r.arith,20034);a.equal(r.certified,18);a.equal(r.trialGains,106);a.equal(r.trialLosses,0);console.log('D6C_DIRECT_EXTENSION_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D6C_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [cert-1-m3-sat, cert-1-unsat, cert-2-sat, cert-3-sat, cert-3-unsat, third-rank-barrier]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_direct_extension_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_direct_extension_replay.js" "$mode" descriptor > /tmp/d6c.desc
          node "${p}_direct_extension_replay.js" "$mode" fixtures > /tmp/d6c.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d6c-native
          /tmp/d6c-native /tmp/d6c.desc /tmp/d6c.fixtures > /tmp/d6c-native.out
          python -m mathos.research.f038_rex_width_three_direct_extension_native_verify /tmp/d6c.fixtures /tmp/d6c-native.out "$mode"
