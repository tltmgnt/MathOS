name: TECT-X uniform Weil prime tail analytical bound
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_prime_tail.py'
      - 'tests/test_riemann_weil_prime_tail.py'
      - 'docs/research/TECTX_WEIL_UNIFORM_PRIME_TAIL.md'
      - '.github/workflows/riemann-weil-prime-tail.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_prime_tail.py'
      - 'tests/test_riemann_weil_prime_tail.py'
      - 'docs/research/TECTX_WEIL_UNIFORM_PRIME_TAIL.md'
      - '.github/workflows/riemann-weil-prime-tail.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-uniform-tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing Weil explicit formula regression
        run: python -m unittest discover -s tests -p 'test_riemann_weil_gram.py' -v
      - name: Proved analytic prime-tail error controls
        run: python -m unittest discover -s tests -p 'test_riemann_weil_prime_tail.py' -v
      - name: Build rational, replayable bound
        run: |
          python -m mathos.research.riemann_weil_prime_tail --centers 0,1/5,1/2 --prime-cutoff 256 --output artifacts/riemann/weil_prime_tail.json
          python -m json.tool artifacts/riemann/weil_prime_tail.json > /dev/null
      - name: Strictly reject global positivity or RH promotion
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_prime_tail.json',encoding='utf-8') as file:
              report=json.load(file)
          delta=Fraction(report['analytic_prime_tail']['per_gram_entry_upper_rational'])
          matrix_delta=Fraction(report['analytic_prime_tail']['quadratic_form_norm_upper_rational'])
          assert delta>0
          assert delta < Fraction(1,10**17)
          assert matrix_delta == 3*delta
          assert not any(report['positivity_contract'].values())
          assert report['status']=='ANALYTIC_PRIME_TAIL_BOUND_ONLY_NOT_GLOBAL_WEIL_POSITIVITY'
          PY
