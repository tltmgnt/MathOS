name: Proctor F038 unrestricted bijunctive core
on:
  push:
    branches: ['research/pnp-f038-unrestricted-bijunctive-core']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_bijunctive_core.py
          python -m mathos.research.f038_unrestricted_planted_density | tee /tmp/prior.txt
          grep -Fx 'F038_UNRESTRICTED_PLANTED_DENSITY_OK {"controls":4,"hist":[[3,1,["1","0","0","127"]],[4,4,["97283","8193532","0","0","260144641"]],[5,10,["1069284634125342970","2040935523798449935","85947547486093978870","0","0","1091533853073393531649"]]],"scan":[[1,4,0,0,0,4,0,0],[2,256,0,0,0,256,0,0],[3,256,8,8,1,247,8,28],[4,12,4,20,0,8,4,26],[16,12,8,5516,0,4,9,131412]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_bijunctive_core | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_BIJUNCTIVE_CORE_OK {"controls":4,"hist":[[0,1,0],[1,8,0],[2,28,0],[3,48,8],[4,44,26],[5,24,32],[6,12,16],[7,0,8],[8,1,0]],"local":[256,166,90,768],"rows":[[1,0,4,0,4,0,3,3,1,4],[2,0,256,0,256,0,95,95,161,128],[3,1,384,166,384,0,352,352,32,1251],[4,1,128,308,111,17,72,62,49,116],[5,1,128,790,16,112,65,6,10,75],[9,2,8,13,7,1,7,6,1,2383]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_BIJUNCTIVE_CORE_GATE_OK status=OPEN')
          PY
