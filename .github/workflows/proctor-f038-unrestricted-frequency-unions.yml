name: Proctor F038 unrestricted frequency unions
on:
  push:
    branches: ['research/pnp-f038-unrestricted-frequency-unions']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_frequency_unions.js
          node mathos/research/f038_unrestricted_frequency_unions.js | tee /tmp/current.txt
          grep -Fx 'F038_FREQUENCY_UNIONS_OK {"fixtures":16,"totals":[466,0,14,54283,22424,51303,0,2980,0,161560],"forced":[560,186,409,108566,56639,98888,3315,2980,3383,323120],"frequencyChecks":1120,"unionChecks":88000,"boundChecks":1600,"controls":[[7,2,3,340,6,468,252],[15,4,300,3075,1176,11172,2940],[31,4,1368,28423,5424,108900,27900],[63,8,86072,163975,645232,1910468,242172]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_FREQUENCY_UNIONS_GATE_OK status=OPEN promotion=NONE')
          PY
