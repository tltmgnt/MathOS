name: PNP conjecture refinement
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_conjecture_refinement.py'
      - '.github/workflows/pnp-conjecture-refinement.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_conjecture_refinement.py'
      - '.github/workflows/pnp-conjecture-refinement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_conjecture_refinement.py' -v
          mkdir -p artifacts/pnp-refinement
          python -m mathos.research.pnp_proof_simulation_frontier --checkpoint artifacts/pnp-refinement/simulation.json > /dev/null
          python -m mathos.research.pnp_barrier_frontier --checkpoint artifacts/pnp-refinement/barriers.json > /dev/null
          python -m mathos.research.pnp_hypothesis_obligations --simulation artifacts/pnp-refinement/simulation.json --barriers artifacts/pnp-refinement/barriers.json --checkpoint artifacts/pnp-refinement/hypotheses.json > /dev/null
          python -m mathos.research.pnp_conjecture_frontier --simulation artifacts/pnp-refinement/simulation.json --barriers artifacts/pnp-refinement/barriers.json --hypotheses artifacts/pnp-refinement/hypotheses.json --checkpoint artifacts/pnp-refinement/report.json > /dev/null
          python -m mathos.research.pnp_conjecture_frontier --simulation artifacts/pnp-refinement/simulation.json --barriers artifacts/pnp-refinement/barriers.json --hypotheses artifacts/pnp-refinement/hypotheses.json --audit artifacts/pnp-refinement/report.json > artifacts/pnp-refinement/audit.json
          python -c "import json; r=json.load(open('artifacts/pnp-refinement/report.json')); print(json.dumps(r['summary'],indent=2)); assert r['completion']=='completed' and r['summary']['eliminated_candidates']==10 and r['summary']['refined_correct']==24"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-conjecture-refinement-evidence
          path: artifacts/pnp-refinement/
          if-no-files-found: ignore
