name: Proctor F038 MRA-X affine syndrome decision
on:
  push:
    branches: ['research/pnp-f038-mrax-affine-syndrome-decision']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_affine_syndrome_decision.py
          python -m mathos.research.f038_programmable_parity | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_PROGRAMMABLE_PARITY_OK {"controls":4,"holes":[[1,2,3,6,12,2,4,8,2],[2,4,9,36,144,4,32,64,12],[3,8,27,216,1728,8,208,512,56],[4,16,81,1296,20736,16,1280,4096,240],[5,32,243,7776,248832,32,7744,32768,992]],"projection":[256,1024,447,2304,25600,323,380,6144]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_affine_syndrome_decision | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_AFFINE_SYNDROME_OK {"controls":4,"reduction":[256,1024,12288,95,128,192,163,16],"syndromes":[[1,0,1,1,4,3,1,0,0],[1,1,4,8,16,12,7,1,1],[1,2,16,64,64,48,37,27,21],[1,3,64,512,256,192,169,343,301],[2,1,64,128,16384,6080,128,0,0],[2,2,64,256,16384,6080,256,0,0],[2,3,64,512,16384,6080,504,8,8],[2,4,64,1024,16384,6080,979,45,40]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_AFFINE_SYNDROME_GATE_OK status=OPEN')
          PY
