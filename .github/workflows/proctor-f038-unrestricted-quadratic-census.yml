name: Proctor F038 unrestricted quadratic census
on:
  push:
    branches: ['research/pnp-f038-unrestricted-quadratic-census']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_quadratic_census.py
          python -m mathos.research.f038_unrestricted_density_clock | tee /tmp/prior.txt
          grep -Fx 'F038_UNRESTRICTED_DENSITY_CLOCK_OK {"caps":[[1,0,0,0,0],[3,0,1,2,6],[4,1,2,3,8],[14,1,3,5,15],[15,2,4,6,16],[16,2,4,6,16],[100,3,6,10,27],[1000,5,10,15,41],[1000000,10,20,31,82]],"controls":4,"rows":[[1,3,0,4,0,3,4,1,0,4,3,4,4,1],[1,4,0,4,0,3,4,1,0,4,3,4,4,1],[1,5,0,4,0,3,4,1,0,4,3,4,4,1],[2,3,0,256,0,95,128,1,0,256,95,256,256,161],[2,4,1,256,0,95,128,1,0,256,95,256,256,161],[2,5,1,256,0,95,128,1,0,256,95,256,256,161],[3,3,0,384,372,352,1251,1,372,12,10,12,12,2],[3,4,1,384,372,352,1251,9,0,384,352,974,2616,32],[3,5,2,384,372,352,1251,39,0,384,352,974,2616,32],[4,3,1,128,128,72,116,0,0,128,72,682,896,56],[4,4,2,128,128,72,116,0,0,128,72,682,896,56],[4,5,3,128,128,72,116,0,0,128,72,682,896,56],[5,3,1,128,128,65,75,0,0,128,65,737,896,63],[5,4,2,128,128,65,75,0,0,128,65,737,896,63],[5,5,3,128,128,65,75,0,0,128,65,737,896,63],[6,3,1,128,242,64,68,0,114,14,8,76,98,6],[6,4,2,128,242,64,68,0,0,128,64,4554,5684,64],[6,5,4,128,242,64,68,0,0,128,64,4554,5684,64],[9,3,1,8,11,7,2766,2,3,5,4,12,29,1],[9,4,3,8,11,7,2766,7,0,8,7,15,470,1],[9,5,4,8,11,7,2766,7,0,8,7,15,470,1]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_quadratic_census | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_QUADRATIC_CENSUS_OK {"controls":3,"partitions":[[4,16,12,24,16,8,5,8],[6,64,32,160,64,96,7,96],[8,256,80,1120,1024,96,37,192],[10,1024,192,8064,6144,1920,56,3840],[12,4096,448,59136,34816,24320,299,49920]],"traces":[[1,5832,209952,198124,233608,23656,23656,23656,47312],[2,256,9216,8572,10504,1288,1288,1288,2576],[3,256,9216,8471,10706,1490,1490,1490,2980]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_QUADRATIC_CENSUS_GATE_OK status=OPEN')
          PY
