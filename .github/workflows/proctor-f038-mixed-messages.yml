name: Proctor F038 mixed message certificates
on:
  push:
    branches: ['research/pnp-f038-mixed-message-certificates']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_mixed_messages.py
          python -m mathos.research.f038_certified_portfolio | tee /tmp/portfolio.txt
          grep -Fx 'F038_PORTFOLIO_SCHEDULE_OK cases=5184 solved=4477 unknown=707 attempts=24190 charged=38546 max_ratio=3.25' /tmp/portfolio.txt
          grep -Fx 'F038_PORTFOLIO_ENGINES_OK fixtures=3 engines=5 positive=9 negative=4 abstain=2 integrated=3 tiny_cap_unknown=1 rejected=1 verifier_timeout=1' /tmp/portfolio.txt
          grep -Fx 'F038_PORTFOLIO_COMMON_MESSAGE_OK grids=2,3,4,8,16,32 induced_matching=1,2,4,15,60,231 max_rank=1024' /tmp/portfolio.txt
          python -m mathos.research.f038_mixed_messages | tee /tmp/mixed.txt
          grep -Fx 'F038_MIXED_PROJECTION_OK cases=4096 backend_results=12288 membership_checks=98304 empty=832' /tmp/mixed.txt
          grep -Fx 'F038_MIXED_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 up_checks=26320 down_checks=26320 projections=15528 direction_checks=11136 valid_directions=8587 repair_exists=4294 bad_empty=3424' /tmp/mixed.txt
          grep -Fx 'F038_MIXED_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 up_checks=6336 down_checks=6336 projections=3616 direction_checks=6944 valid_directions=3328 repair_exists=896 bad_empty=0' /tmp/mixed.txt
          grep -Fx 'F038_MIXED_HIGH_RANK_OK sizes=1,2,4,8,16,32 max_rank=65 representations=3 corrupt_rejected=12 bounded_success=1 bounded_unknown=1' /tmp/mixed.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MIXED_MESSAGE_GATE_OK status=OPEN')
          PY
