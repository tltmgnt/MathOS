name: TECT-X Weil lattice topological non-density and fifth prime window
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_lattice_topology_audit.py'
      - 'tests/test_riemann_weil_lattice_topology_audit.py'
      - 'docs/research/TECTX_WEIL_LATTICE_TOPOLOGY_AND_FIFTH_PRIME_WINDOW.md'
      - '.github/workflows/riemann-weil-lattice-topology-audit.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_lattice_topology_audit.py'
      - 'tests/test_riemann_weil_lattice_topology_audit.py'
      - 'docs/research/TECTX_WEIL_LATTICE_TOPOLOGY_AND_FIFTH_PRIME_WINDOW.md'
      - '.github/workflows/riemann-weil-lattice-topology-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rational-lattice-and-fifth-prime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run exact rational topological gap and arithmetic tests
        run: python -m unittest discover -s tests -p 'test_riemann_weil_lattice_topology_audit.py' -v
      - name: Generate exact fifth Weil support report
        run: |
          python -m mathos.research.riemann_weil_lattice_topology_audit --output artifacts/riemann/tectx_weil_lattice_topology_audit.json
          python -m json.tool artifacts/riemann/tectx_weil_lattice_topology_audit.json >/dev/null
      - name: Independent rational arithmetic and fail-closed global positivity gate
        run: |
          python - <<'PY'
          from fractions import Fraction
          import json
          with open('artifacts/riemann/tectx_weil_lattice_topology_audit.json',encoding='utf-8') as file:
              r=json.load(file)
          assert r['status']=='FIFTH_ARITHMETIC_WINDOW_IDENTIFIED_GLOBAL_DENSITY_OBSTRUCTION'
          lattice=r['lattice']
          assert not lattice['span_dense_in_L2_R']
          assert not lattice['span_dense_in_LF_Cc_infinity_R']
          assert lattice['every_f_j_identically_zero_on_gap']
          assert lattice['all_m_coefficient_to_L2_condition_number']==1
          assert Fraction(lattice['alpha_strict_lower'])==Fraction(1,18)
          assert Fraction(lattice['alpha_strict_upper'])==Fraction(1,4)
          fifth=r['fifth_direction']
          assert fifth['actual_new_prime_powers']==[16,17,19,23,25]
          assert fifth['cross_with_zero']['support']==['11/4','13/4']
          assert [c['von_mangoldt_base'] for c in fifth['cross_with_zero']['candidate_prime_powers']]==[2,17,19,23,5]
          p=fifth['new_prime19_proven_lower']
          assert Fraction(p['convolution_at_log19_strictly_greater'])==Fraction(1,72)
          assert Fraction(p['prime19_term_strictly_less'])==-Fraction(49,6000)
          assert not fifth['all_pole_arch_prime_terms_fully_enclosed']
          assert not fifth['fifth_Schur_complement_certified']
          assert not any(r['assurance'].values())
          PY
