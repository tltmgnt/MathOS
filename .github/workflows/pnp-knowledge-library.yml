name: PNP knowledge library
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_knowledge_library.py'
      - 'formal/PnpKnowledgeLibrary.lean'
      - '.github/workflows/pnp-knowledge-library.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_knowledge_library.py'
      - 'formal/PnpKnowledgeLibrary.lean'
      - '.github/workflows/pnp-knowledge-library.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_knowledge_library.py' -v
          mkdir -p artifacts/pnp-library
          python -m mathos.research.pnp_evidence_benchmark --checkpoint artifacts/pnp-library/source.json > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark artifacts/pnp-library/source.json --checkpoint artifacts/pnp-library/scheduler.json > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark artifacts/pnp-library/source.json --scheduler artifacts/pnp-library/scheduler.json --checkpoint artifacts/pnp-library/failures.json > /dev/null
          python -m mathos.research.pnp_abstraction_frontier --benchmark artifacts/pnp-library/source.json --scheduler artifacts/pnp-library/scheduler.json --failures artifacts/pnp-library/failures.json --checkpoint artifacts/pnp-library/abstraction.json > /dev/null
          python -m mathos.research.pnp_knowledge_frontier --benchmark artifacts/pnp-library/source.json --scheduler artifacts/pnp-library/scheduler.json --failures artifacts/pnp-library/failures.json --abstraction artifacts/pnp-library/abstraction.json --checkpoint artifacts/pnp-library/report.json > /dev/null
          python -m mathos.research.pnp_knowledge_frontier --benchmark artifacts/pnp-library/source.json --scheduler artifacts/pnp-library/scheduler.json --failures artifacts/pnp-library/failures.json --abstraction artifacts/pnp-library/abstraction.json --audit artifacts/pnp-library/report.json > artifacts/pnp-library/audit.json
          python -c "import json; r=json.load(open('artifacts/pnp-library/report.json')); print(json.dumps(r['summary'],indent=2)); assert r['completion']=='completed' and r['summary']['fresh_cases']==24 and r['summary']['strengthening_verified']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-knowledge-library-evidence
          path: artifacts/pnp-library/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpKnowledgeLibrary.lean | tee /tmp/pnp-library-lean.txt
          for theorem in premiseStrengthening coverTransitive strengtheningOr; do
            grep -Fx "'PnpKnowledgeLibrary.$theorem' does not depend on any axioms" /tmp/pnp-library-lean.txt
          done
