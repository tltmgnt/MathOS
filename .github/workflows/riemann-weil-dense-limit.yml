name: TECT-X dense signed Weil trace-class limit
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_dense_limit.py'
      - 'tests/test_riemann_weil_dense_limit.py'
      - 'docs/research/TECTX_WEIL_DENSE_TRACE_CLASS_LIMIT.md'
      - '.github/workflows/riemann-weil-dense-limit.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_dense_limit.py'
      - 'tests/test_riemann_weil_dense_limit.py'
      - 'docs/research/TECTX_WEIL_DENSE_TRACE_CLASS_LIMIT.md'
      - '.github/workflows/riemann-weil-dense-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dense-weil-signed-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Exact rational dense-family and signed trace-class adversarial tests
        run: python -m unittest discover -s tests -p 'test_riemann_weil_dense_limit.py' -v
      - name: Build portable infinite-limit analytic bound
        run: |
          python -m mathos.research.riemann_weil_dense_limit --dimension 32 --output artifacts/riemann/weil_dense_limit.json
          python -m json.tool artifacts/riemann/weil_dense_limit.json > /dev/null
      - name: Exact rational finite-to-infinite and no-RH-promotion checks
        run: |
          python - <<'PY'
          from fractions import Fraction
          import json
          with open('artifacts/riemann/weil_dense_limit.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r['status']=='UNCONDITIONAL_SIGNED_TRACE_CLASS_WEIL_LIMIT_NO_GLOBAL_PSD'
          assert r['global_arithmetic_bound']['all_weil_entry_components']['component_sum_upper']==6676
          assert r['global_arithmetic_bound']['all_weil_entry_components']['final_entry_absolute_bound']==10000
          assert Fraction(r['fixed_self_adjoint_trace_class_operator']['trace_norm_error_rational']) == (
              10000*(Fraction(2,2**32)-Fraction(1,2**64)))
          assert r['test_family']['span_dense_in_even_real_L2']
          assert not r['test_family']['density_proved_in_full_Weil_admissible_topology']
          op=r['fixed_self_adjoint_trace_class_operator']
          assert op['trace_class'] and op['self_adjoint']
          assert op['positive_semidefinite'] is None
          assert not op['genuine_zeta_zero_operator']
          assert not any(r['assurance'].values())
          PY
