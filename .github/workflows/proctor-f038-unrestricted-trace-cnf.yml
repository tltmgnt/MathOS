name: Proctor F038 unrestricted trace CNF
on:
  push:
    branches: ['research/pnp-f038-unrestricted-trace-cnf']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_trace_cnf.py
          python -m mathos.research.f038_unrestricted_formula_discovery | tee /tmp/prior.txt
          grep -Fx 'F038_UNRESTRICTED_FORMULA_DISCOVERY_OK {"controls":4,"recovery":[[1,4,3,1,6,1,6,4],[2,256,95,161,858,119,380,128],[3,258,16,242,2012,60,96,25]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_trace_cnf | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_TRACE_CNF_OK {"batches":[[1,1,8,32,96,64,28,2,2,30],[1,4,8,32,96,21,49,15,11,24],[2,1,8,2048,6144,4096,1792,224,32,2016],[2,4,8,2048,6144,1664,3072,1264,144,1928]],"controls":5,"stages":[[1,0,8,4,4],[1,1,8,1,1],[1,2,8,0,0],[1,3,8,0,0],[1,4,8,0,0],[1,5,8,0,0],[1,6,8,0,0],[2,0,1024,128,128],[2,1,1024,76,76],[2,2,1024,17,17],[2,3,1024,17,17],[2,4,1024,0,0],[2,5,1024,0,0],[2,6,1024,0,0]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_TRACE_CNF_GATE_OK status=OPEN')
          PY
