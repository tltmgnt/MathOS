name: MRA-X scenario planning
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-scenario.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 tools/mra_x_scenario.py --output scenario-evidence.json --model scenario-model.json
      - name: Verify deterministic accounting and model replay
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          import mra_x_scenario as s
          import mra_x_gap_agent as g
          r=json.load(open('scenario-evidence.json'))
          m=json.load(open('scenario-model.json'))
          assert g.digest(m['model'])==m['sha256']==r['model_sha256']
          assert r['training_checks']==110 and len(r['rows'])==12
          assert r['threshold'] is None
          assert r['baseline']['total']==8141 and r['active']['total']==36396
          assert r['active']['actual']==7484 and r['active']['simulation_overhead']==28912
          assert r['active']['plans']==48 and r['active']['departures']==9
          def stable(x):
              h=x.pop('evidence_sha256')
              assert g.digest(x)==h
              for k in ('times_ns','geomean_ratio','worst_ratio','decision'): x.pop(k)
              return x
          assert stable(r)==stable(s.audit(Path('replay-model.json')))
          assert Path('scenario-model.json').read_bytes()==Path('replay-model.json').read_bytes()
          PY
