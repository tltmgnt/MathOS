name: Millennium breakthrough cycle 4 (SAT and rank two)
on:
  push:
    paths:
      - 'mathos/research/breakthrough_cycle4.py'
      - 'tests/test_breakthrough_cycle4.py'
      - 'docs/research/breakthrough/*B004*'
      - '.github/workflows/millennium-breakthrough-cycle4.yml'
  pull_request:
    paths:
      - 'mathos/research/breakthrough_cycle4.py'
      - 'tests/test_breakthrough_cycle4.py'
      - 'docs/research/breakthrough/*B004*'
      - '.github/workflows/millennium-breakthrough-cycle4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_breakthrough_cycle4.py' -v
      - run: |
          mkdir -p artifacts/breakthrough-cycle4
          python -m mathos.research.breakthrough_cycle4 > artifacts/breakthrough-cycle4/report.json
          cat artifacts/breakthrough-cycle4/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: breakthrough-cycle4-evidence
          path: artifacts/breakthrough-cycle4/report.json
          if-no-files-found: error
