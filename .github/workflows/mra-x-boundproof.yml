name: MRA-X original-factor partition proofs
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-boundproof.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libz3-4
      - run: python3 tools/mra_x_boundproof_audit.py --directory partition-audit
      - run: python3 tools/mra_x_boundproof_audit.py --directory partition-replay
      - name: Check deterministic evidence and symbolic obligations
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_boundproof as p
          def stable(path):
              r=json.load(open(path))
              assert p.digest({k:v for k,v in r.items() if k!='evidence_sha256'})==r.pop('evidence_sha256')
              r.pop('timing')
              return r
          r=stable('partition-audit/evidence.json')
          assert r==stable('partition-replay/evidence.json')
          assert len(r['rows'])==216 and len(r['controls'])==14 and r['standalone']==12
          assert sum(x['optimum'] is not None for x in r['rows'])==174
          assert sum(x['nodes'] for x in r['rows'])==2859
          assert sum(x['row_checks'] for x in r['rows'])==90794
          assert sum(x['result']=='unsat' for x in r['symbolic'])==6
          assert sum(x['result']=='sat' for x in r['symbolic'])==2
          PY
