name: TECT-X certified Weil 3x3 LDL Gram
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_certified_gram3.py'
      - 'tests/test_riemann_weil_certified_gram3.py'
      - 'docs/research/TECTX_WEIL_CERTIFIED_GRAM3.md'
      - '.github/workflows/riemann-weil-certified-gram3.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_certified_gram3.py'
      - 'tests/test_riemann_weil_certified_gram3.py'
      - 'docs/research/TECTX_WEIL_CERTIFIED_GRAM3.md'
      - '.github/workflows/riemann-weil-certified-gram3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rigorous-fixed-gram3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pin interval arithmetic library
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0
      - name: Check all three-dimensional interval LDL and adversarial rejection
        run: python -m unittest discover -s tests -p 'test_riemann_weil_certified_gram3.py' -v
      - name: Emit rational certified matrix and pivot endpoints
        run: |
          python -m mathos.research.riemann_weil_certified_gram3 --panels 8192 --output artifacts/riemann/weil_certified_gram3.json
          python -m json.tool artifacts/riemann/weil_certified_gram3.json > /dev/null
      - name: Exact rational independent certificate gate
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_certified_gram3.json', encoding='utf-8') as file:
              r = json.load(file)
          assert r['status'] == 'FIXED_3X3_WEIL_GRAM_STRICTLY_POSITIVE_GLOBAL_RH_OPEN'
          p = r['numerical_proof']
          assert p['fourth_derivative_global_envelope_exact'] == '946104/125'
          assert p['proved_minimum_eigenvalue_greater_than'] == '1/1000000'
          for rows in [p['unshifted_LDL_pivots'], p['shifted_LDL_pivots']]:
              assert len(rows) == 3
              assert all(Fraction(low) > 0 for low, high in rows)
              assert all(Fraction(high) >= Fraction(low) for low,high in rows)
          for row in p['matrix_entry_intervals']:
              assert len(row)==3
              assert all(Fraction(low)<=Fraction(high) for low,high in row)
          assert r['scope']['positivity_proved_on_fixed_three_dimensional_span']
          assert not r['scope']['positivity_proved_on_entire_Weil_test_space']
          assert not r['scope']['riemann_hypothesis_proved']
          PY
