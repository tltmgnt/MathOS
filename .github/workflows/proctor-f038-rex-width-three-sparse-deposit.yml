name: Proctor F038 RE-X sparse-depositd bounded and full GAC
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-sparse-deposit']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Online packing and batched workspace relocation audit
        run: |
          node mathos/research/f038_rex_width_three_deposit_audit.js > /tmp/d5p.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5p.json');a.equal(r.patterns,8190);a.equal(r.folds,2385);a.equal(r.expansion,8056);a.equal(r.maxRatio,2);a.equal(r.arithmetic,40068);a.equal(r.cases,10);a.equal(r.malformed,14);a.equal(r.batchGain,10);a.equal(r.packedGain,9);a.equal(r.packedLoss,1);a.equal(r.packedEqual,0);a.deepEqual(r.thresholds,['148085868','221932374','152364670','228350577']);console.log('D5P_DEPOSIT_ORACLE_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5P_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        kind: [batch, packed]
        mode: [bounded, full]
        fixture: [all-active, ternary-chain, ternary-empty, reverse-chain-cap, radius-three-refusal, ternary-three-rank]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_deposit_replay.js ${{ matrix.kind }} ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        kind: [batch, packed]
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          kind=${{ matrix.kind }}
          mode=${{ matrix.mode }}
          node "${p}_deposit_replay.js" "$kind" "$mode" descriptor > /tmp/d5p.desc
          node "${p}_deposit_replay.js" "$kind" "$mode" fixtures > /tmp/d5p.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d5p-native
          /tmp/d5p-native /tmp/d5p.desc /tmp/d5p.fixtures > /tmp/d5p-native.out
          python -m mathos.research.f038_rex_width_three_deposit_native_verify /tmp/d5p.fixtures /tmp/d5p-native.out "$kind" "$mode"
