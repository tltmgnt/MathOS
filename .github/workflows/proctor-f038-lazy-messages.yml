name: Proctor F038 demand driven messages
on:
  push:
    branches: ['research/pnp-f038-demand-driven-messages']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_lazy_messages.py
          python -m mathos.research.f038_universal_message | tee /tmp/universal.txt
          grep -Fx 'F038_UNIVERSAL_MESSAGE_OK selections=4096 sat=1360 unsat=2736 witness_checks=32768 valid_witnesses=2304 extension_trials=524288 valid_extensions=11520 anchor_checks=49152' /tmp/universal.txt
          grep -Fx 'F038_UNIVERSAL_MESSAGE_FULL_OK selections=256 sat=255 unsat=1 witness_checks=2048 valid_witnesses=1024 extension_trials=524288 valid_extensions=27648 anchor_checks=2048' /tmp/universal.txt
          grep -Fx 'F038_UNIVERSAL_MESSAGE_2VAR_OK selections=256 sat=95 unsat=161 witness_checks=1024 valid_witnesses=128 extension_trials=1024 valid_extensions=128 anchor_checks=2048' /tmp/universal.txt
          grep -Fx 'F038_UNIVERSAL_MESSAGE_TREE_OK sizes=1,2,3,4,5 presence_bits=2,8,26,64,130 actual_tables=2,8 table_rows=3,95' /tmp/universal.txt
          python -m mathos.research.f038_lazy_messages | tee /tmp/lazy.txt
          grep -Fx 'F038_LAZY_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 root_queries=38176 positive=8694 negative=29482 projections=33440 repair_exists=4294 directions=11136 valid=8587 node_queries=51536 node_positive=27972' /tmp/lazy.txt
          grep -Fx 'F038_LAZY_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 root_queries=29312 positive=4512 negative=24800 projections=28416 repair_exists=896 directions=6944 valid=3328 node_queries=43840 node_positive=26864' /tmp/lazy.txt
          grep -Fx 'F038_LAZY_ORDER_OK early_sizes=1,2,4,8,16,32 early_root_trials=1,1,1,1,1,1 late_sizes=1,2,4,8 late_root_trials=2,4,16,256 corrupt_rejected=6 cap_unknown=10' /tmp/lazy.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_LAZY_MESSAGE_GATE_OK status=OPEN')
          PY
