name: MathOS TOPO-406 Verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-topo406:
    name: Run TOPO-406 Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run structural verification tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406.py" \
            -v
      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4,<5"

      - name: Run JSON Schema verification tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_schema.py" \
            -v
      - name: Validate TOPO-406 evidence records
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_records.py" \
            -v
      - name: Run TOPO-406 integrity tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_integrity.py" \
            -v
      - name: Run reproducible mathematical verification
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_reproducibility.py" \
            -v
      - name: Validate TOPO-406 verification registry
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_registry.py" \
            -v
      - name: Generate TOPO-406 execution provenance
        if: always()
        run: python verification/generate_provenance.py

      - name: Upload TOPO-406 provenance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topo406-provenance
          path: verification/provenance.json
          if-no-files-found: error
      - name: Install JUnit reporting dependency
        run: python -m pip install "unittest-xml-reporting>=3.2,<4"

      - name: Generate JUnit XML test results
        run: |
          mkdir -p verification
          python -m xmlrunner discover \
            -s tests \
            -p "test_topo406*.py" \
            -o verification

      - name: Prepare JUnit report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          folder = Path("verification")
          files = sorted(folder.glob("TEST-*.xml"))

          if not files:
              raise SystemExit("No JUnit XML reports found")

          root = ET.Element("testsuites")

          for file in files:
              tree = ET.parse(file)
              source = tree.getroot()

              if source.tag == "testsuite":
                  root.append(source)
              elif source.tag == "testsuites":
                  root.extend(source.findall("testsuite"))

          ET.ElementTree(root).write(
              folder / "test-results.xml",
              encoding="utf-8",
              xml_declaration=True,
          )
          PY

      - name: Generate test-result attestation
        if: always()
        run: python verification/generate_attestation.py

      - name: Upload attestation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topo406-attestation
          path: |
            verification/attestation.json
            verification/test-results.xml
          if-no-files-found: error
      - name: Run TOPO-406 integrity tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_topo406_integrity.py" \
            -v
      - name: Run MathOS core tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_mathos_core.py" \
            -v
      - name: Run internal reasoning adapter tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_internal_reasoning_adapter.py" \
            -v
      - name: Run neural activation capture tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_activation_capture.py" \
            -v 
      - name: Run neural activation validator regression tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_validate_activations.py" \
            -v
      - name: Install neural activation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install "transformers>=4.40,<5"

      - name: Capture real neural activations
        run: |
          python experiments/internal_reasoning/activation_capture.py \
            --model sshleifer/tiny-gpt2 \
            --prompt "Policy A has score 8. Policy B has score 4." \
            --output artifacts/internal_reasoning/activations.json
      - name: Validate neural activation artifact
        run: |
          python verification/validate_activations.py \
            --input artifacts/internal_reasoning/activations.json
      - name: Run controlled activation experiment 001
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment.py \
            --output artifacts/internal_reasoning/experiment_001.json

      - name: Upload controlled experiment 001 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-001
          path: artifacts/internal_reasoning/experiment_001.json
          if-no-files-found: error
      - name: Run controlled activation experiment 002
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment_002.py \
            --output artifacts/internal_reasoning/experiment_002.json

      - name: Upload controlled experiment 002 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-002
          path: artifacts/internal_reasoning/experiment_002.json
          if-no-files-found: error
      - name: Run controlled activation experiment 003
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment_003.py \
            --output artifacts/internal_reasoning/experiment_003.json

      - name: Upload controlled experiment 003 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-003
          path: artifacts/internal_reasoning/experiment_003.json
          if-no-files-found: error
      - name: Run arithmetic behavior experiment 004
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment_004.py \
            --output artifacts/internal_reasoning/experiment_004.json

      - name: Upload arithmetic behavior experiment 004 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-004
          path: artifacts/internal_reasoning/experiment_004.json
          if-no-files-found: error
      - name: Run operand sensitivity experiment 005
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment_005.py \
            --output artifacts/internal_reasoning/experiment_005.json

      - name: Upload operand sensitivity experiment 005 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-005
          path: artifacts/internal_reasoning/experiment_005.json
          if-no-files-found: error
      - name: Run operand grid experiment 006
        run: |
          python experiments/internal_reasoning/controlled_activation_experiment_006.py \
            --output artifacts/internal_reasoning/experiment_006.json

      - name: Upload operand grid experiment 006 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-006
          path: artifacts/internal_reasoning/experiment_006.json
          if-no-files-found: error
      - name: Run reusable arithmetic benchmark 007
        run: |
          python experiments/internal_reasoning/arithmetic_benchmark.py \
            --model sshleifer/tiny-gpt2 \
            --seed 406 \
            --output artifacts/internal_reasoning/experiment_007.json

      - name: Upload arithmetic benchmark 007 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-007
          path: artifacts/internal_reasoning/experiment_007.json
          if-no-files-found: error

      - name: Run arithmetic benchmark 008 with DistilGPT2
        run: |
          python experiments/internal_reasoning/arithmetic_benchmark.py \
            --model distilgpt2 \
            --seed 406 \
            --output artifacts/internal_reasoning/experiment_008.json

      - name: Upload arithmetic benchmark 008 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-008
          path: artifacts/internal_reasoning/experiment_008.json
          if-no-files-found: error
      - name: Run arithmetic structure analysis 009
        run: |
          python experiments/internal_reasoning/arithmetic_structure_analysis.py \
            --input artifacts/internal_reasoning/experiment_008.json \
            --output artifacts/internal_reasoning/experiment_009.json

      - name: Upload arithmetic structure analysis 009 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-009
          path: artifacts/internal_reasoning/experiment_009.json
          if-no-files-found: error
      - name: Run centered arithmetic analysis 010
        run: |
          python experiments/internal_reasoning/arithmetic_centered_analysis.py \
            --input artifacts/internal_reasoning/experiment_008.json \
            --output artifacts/internal_reasoning/experiment_010.json

      - name: Upload centered arithmetic analysis 010 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-010
          path: artifacts/internal_reasoning/experiment_010.json
          if-no-files-found: error
      - name: Run standardized arithmetic analysis 011
        run: |
          python experiments/internal_reasoning/arithmetic_standardized_analysis.py \
            --input artifacts/internal_reasoning/experiment_008.json \
            --output artifacts/internal_reasoning/experiment_011.json
      - name: Upload standardized arithmetic analysis 011 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-011
          path: artifacts/internal_reasoning/experiment_011.json
          if-no-files-found: error
      - name: Run arithmetic permutation test 012
        run: |
          python experiments/internal_reasoning/arithmetic_permutation_test.py \
            --input artifacts/internal_reasoning/experiment_008.json \
            --output artifacts/internal_reasoning/experiment_012.json \
            --permutations 1000 \
            --seed 406

      - name: Upload arithmetic permutation test 012 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-012
          path: artifacts/internal_reasoning/experiment_012.json
          if-no-files-found: error

      - name: Run arithmetic operand-swap experiment 013
        run: |
          python experiments/internal_reasoning/arithmetic_operand_swap.py \
            --output artifacts/internal_reasoning/experiment_013.json \
            --seed 406

      - name: Upload arithmetic operand-swap experiment 013 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-013
          path: artifacts/internal_reasoning/experiment_013.json
          if-no-files-found: error
      - name: Run unique operand-pair analysis 014
        run: |
          python experiments/internal_reasoning/arithmetic_unique_pairs.py \
            --input artifacts/internal_reasoning/experiment_013.json \
            --output artifacts/internal_reasoning/experiment_014.json

      - name: Upload unique operand-pair analysis 014 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-014
          path: artifacts/internal_reasoning/experiment_014.json
          if-no-files-found: error
      - name: Run tiny-GPT2 operand-swap experiment 015
        run: |
          python experiments/internal_reasoning/arithmetic_operand_swap_015.py \
            --output artifacts/internal_reasoning/experiment_015.json \
            --seed 406

      - name: Upload tiny-GPT2 operand-swap experiment 015 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-015
          path: artifacts/internal_reasoning/experiment_015.json
          if-no-files-found: error
      - name: Run tiny-GPT2 unique operand-pair analysis 016
        run: |
          python experiments/internal_reasoning/arithmetic_unique_pairs.py \
            --input artifacts/internal_reasoning/experiment_015.json \
            --output artifacts/internal_reasoning/experiment_016.json \
            --experiment-id MathOS-EXP-016

      - name: Upload tiny-GPT2 unique operand-pair analysis 016 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-016
          path: artifacts/internal_reasoning/experiment_016.json
          if-no-files-found: error
      - name: Run cross-model operand-swap comparison 017
        run: |
          python experiments/internal_reasoning/arithmetic_model_comparison_017.py \
            --distilgpt2 artifacts/internal_reasoning/experiment_014.json \
            --tiny-gpt2 artifacts/internal_reasoning/experiment_016.json \
            --output artifacts/internal_reasoning/experiment_017.json

      - name: Upload cross-model comparison 017 artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathos-experiment-017
          path: artifacts/internal_reasoning/experiment_017.json
          if-no-files-found: error
      - name: Upload neural activation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathos-neural-activations
          path: artifacts/internal_reasoning/activations.json
          if-no-files-found: error
      - name: Run MathOS multi-agent tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_mathos_agents.py" \
            -v
      - name: Run MathOS CLI tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_mathos_cli.py" \
            -v
      - name: Run MathOS web tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_mathos_web.py" \
            -v
      - name: Run MathOS HTTP integration tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_mathos_http.py" \
            -v
      - name: Run Omega welfare tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_omega_welfare.py" \
            -v
      - name: Run Omega welfare API tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_omega_welfare_api.py" \
            -v
