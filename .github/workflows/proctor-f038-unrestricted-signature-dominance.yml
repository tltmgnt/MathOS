name: Proctor F038 unrestricted signature dominance
on:
  push:
    branches: ['research/pnp-f038-unrestricted-signature-dominance']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_signature_dominance.py
          python -m mathos.research.f038_unrestricted_signature_dominance | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_SIGNATURE_DOMINANCE_OK [[2,12,27864,158,22081,1287,9,5,3,20,5120,779,14,10],[3,12,89748,474,1237929,48123,10,6,3,26,170586,19696,16,10]]' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_SIGNATURE_DOMINANCE_GATE_OK status=OPEN promotion=NONE')
          PY
