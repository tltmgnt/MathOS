name: Proctor F038 unrestricted threshold union recovery
on:
  push:
    branches: ['research/pnp-f038-unrestricted-threshold-union-recovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_threshold_union_recovery.js
          node mathos/research/f038_unrestricted_threshold_union_recovery.js | tee /tmp/current.txt
          grep -Fx 'F038_THRESHOLD_UNION_RECOVERY_OK {"fixtures":16,"totals":[466,0,0,8,56470,23153,54948,0,1522,0,161560],"forced":[560,186,9900,137,112940,56639,106178,1857,1522,3383,323120],"unionChecks":15520,"greedyChecks":28752,"thresholdChecks":80,"controls":[[7,2,4,4,42],[15,4,16,16,420],[31,5,40,40,2325],[63,8,128,128,15624]]}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_THRESHOLD_UNION_RECOVERY_GATE_OK status=OPEN promotion=NONE')
          PY
