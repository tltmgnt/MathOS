name: Proctor F038 symbolic affine messages
on:
  push:
    branches: ['research/pnp-f038-symbolic-affine-messages']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_symbolic_affine.py
          python -m mathos.research.f038_separator_repair | tee /tmp/previous.txt
          grep -Fx 'F038_SEPARATOR_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 bad_empty=3424 semantic_exists=4294 local_exists=4189 strict=105 nonvacuous_strict=35 up_checks=26320 down_checks=26320 projections=15528 direction_checks=11136 valid_directions=8587 repairs=1795 max_width=3' /tmp/previous.txt
          grep -Fx 'F038_SEPARATOR_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 bad_empty=0 semantic_exists=896 local_exists=896 strict=0 nonvacuous_strict=0 up_checks=6336 down_checks=6336 projections=3616 direction_checks=6944 valid_directions=3328 repairs=3328 max_width=3' /tmp/previous.txt
          grep -Fx 'F038_SEPARATOR_REPAIR_CYCLE_OK cycles=8 valid=4 impossible=4 max_global_rank=32 boundary_budget=4 corrupt_rejected=16' /tmp/previous.txt
          python -m mathos.research.f038_symbolic_affine | tee /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_REPAIR_OK formulas=4096 inconsistent=2384 candidates=4736 up_checks=26320 down_checks=26320 projections=15528 direction_checks=11136 valid_directions=8587 repair_exists=4294 bad_empty=3424' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_REPAIR_FULL_OK formulas=256 inconsistent=1 candidates=896 up_checks=6336 down_checks=6336 projections=3616 direction_checks=6944 valid_directions=3328 repair_exists=896 bad_empty=0' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_HIGH_RANK_OK sizes=1,2,4,8,16,32 max_rank=64 half_flats_each=1 max_half_equations=32 corrupt_rejected=12' /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_AFFINE_COVER_BARRIER_OK spaces=16,2825 flats=51,26387 contained=24,1944 max_sizes=4,16' /tmp/symbolic.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_SYMBOLIC_AFFINE_GATE_OK status=OPEN')
          PY
