name: Proctor PNP adaptive propagation
on:
  # Research branches are validated by pull_request. Restrict push CI to
  # main so an open PR never receives duplicate adaptive checks.
  push:
    branches:
      - main
    paths:
      - 'formal/ProctorAdaptivePropagation.lean'
      - 'formal/ProctorParityElimination.lean'
      - 'formal/ProctorHallDeficiency.lean'
      - 'formal/ProctorCapacityDeficiency.lean'
      - 'formal/ProctorMixedInference.lean'
      - 'formal/ProctorPairedReplay.lean'
      - 'formal/ProctorExecutableReplay.lean'
      - 'formal/ProctorCapacityReplay.lean'
      - 'formal/ProctorXorReplay.lean'
      - 'formal/ProctorUnifiedReplay.lean'
      - 'formal/ProctorDataParser.lean'
      - 'formal/ProctorDataParserMain.lean'
      - 'formal/ProctorWireRoundtrip.lean'
      - 'formal/ProctorWireRoundtripMain.lean'
      - 'formal/ProctorEnvelopeRoundtrip.lean'
      - 'formal/ProctorEnvelopeRoundtripMain.lean'
      - 'formal/ProctorDimacsInput.lean'
      - 'formal/ProctorDimacsLexical.lean'
      - 'formal/ProctorCheckerCost.lean'
      - 'formal/ProctorChainMeter.lean'
      - 'formal/ProctorChainMeterMain.lean'
      - 'formal/ProctorCapacityMeter.lean'
      - 'formal/ProctorCapacityMeterMain.lean'
      - 'formal/ProctorUnifiedMeter.lean'
      - 'formal/ProctorUnifiedMeterMain.lean'
      - 'formal/ProctorPolynomialMeter.lean'
      - 'formal/ProctorPolynomialMeterMain.lean'
      - 'formal/ProctorDimacsMain.lean'
      - 'scripts/build_proctor_dimacs_checker.sh'
      - 'scripts/build_proctor_data_checker.sh'
      - 'formal/ProctorGF2.lean'
      - 'formal/ProctorRenamableHorn.lean'
      - 'mathos/research/tga_proctor*.py'
      - 'tests/test_tga_proctor*.py'
      - 'docs/research/tga-universal/PNP-F030.md'
      - '.github/workflows/proctor-pnp-adaptive-propagation.yml'
  pull_request:
    paths:
      - 'formal/ProctorAdaptivePropagation.lean'
      - 'formal/ProctorParityElimination.lean'
      - 'formal/ProctorHallDeficiency.lean'
      - 'formal/ProctorCapacityDeficiency.lean'
      - 'formal/ProctorMixedInference.lean'
      - 'formal/ProctorPairedReplay.lean'
      - 'formal/ProctorExecutableReplay.lean'
      - 'formal/ProctorCapacityReplay.lean'
      - 'formal/ProctorXorReplay.lean'
      - 'formal/ProctorUnifiedReplay.lean'
      - 'formal/ProctorDataParser.lean'
      - 'formal/ProctorDataParserMain.lean'
      - 'formal/ProctorWireRoundtrip.lean'
      - 'formal/ProctorWireRoundtripMain.lean'
      - 'formal/ProctorEnvelopeRoundtrip.lean'
      - 'formal/ProctorEnvelopeRoundtripMain.lean'
      - 'formal/ProctorDimacsInput.lean'
      - 'formal/ProctorDimacsLexical.lean'
      - 'formal/ProctorCheckerCost.lean'
      - 'formal/ProctorChainMeter.lean'
      - 'formal/ProctorChainMeterMain.lean'
      - 'formal/ProctorCapacityMeter.lean'
      - 'formal/ProctorCapacityMeterMain.lean'
      - 'formal/ProctorUnifiedMeter.lean'
      - 'formal/ProctorUnifiedMeterMain.lean'
      - 'formal/ProctorPolynomialMeter.lean'
      - 'formal/ProctorPolynomialMeterMain.lean'
      - 'formal/ProctorDimacsMain.lean'
      - 'scripts/build_proctor_dimacs_checker.sh'
      - 'scripts/build_proctor_data_checker.sh'
      - 'formal/ProctorGF2.lean'
      - 'formal/ProctorRenamableHorn.lean'
      - 'mathos/research/tga_proctor*.py'
      - 'tests/test_tga_proctor*.py'
      - 'docs/research/tga-universal/PNP-F030.md'
      - '.github/workflows/proctor-pnp-adaptive-propagation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p artifacts/pnp-f030
          python -m unittest discover -s tests -p 'test_tga_proctor_affine_backdoor.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_resolution_gates.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_renamable_horn.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_adaptive_propagation.py' -v
          python -m mathos.research.tga_proctor_adaptive_propagation > artifacts/pnp-f030/controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_component_search.py' -v
          python -m mathos.research.tga_proctor_component_search > artifacts/pnp-f030/f031-native-controls.json
          cat artifacts/pnp-f030/f031-native-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_dynamic_components.py' -v
          python -m mathos.research.tga_proctor_dynamic_components > artifacts/pnp-f030/f031-dynamic-controls.json
          cat artifacts/pnp-f030/f031-dynamic-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_dynamic_resolution.py' -v
          python -m mathos.research.tga_proctor_dynamic_resolution > artifacts/pnp-f030/f031-resolution-controls.json
          cat artifacts/pnp-f030/f031-resolution-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_xor_cnf.py' -v
          python -m mathos.research.tga_proctor_xor_cnf > artifacts/pnp-f030/f032-xor-controls.json
          cat artifacts/pnp-f030/f032-xor-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_xor_bve.py' -v
          python -m mathos.research.tga_proctor_xor_bve > artifacts/pnp-f030/f032-bve-controls.json
          cat artifacts/pnp-f030/f032-bve-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_blind_parity.py' -v
          python -m mathos.research.tga_proctor_blind_parity > artifacts/pnp-f030/f032-blind-controls.json
          cat artifacts/pnp-f030/f032-blind-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hybrid_sat.py' -v
          python -m mathos.research.tga_proctor_hybrid_sat > artifacts/pnp-f030/f032-hybrid-controls.json
          cat artifacts/pnp-f030/f032-hybrid-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hybrid_adversary.py' -v
          python -m mathos.research.tga_proctor_hybrid_adversary > artifacts/pnp-f030/f032-wide-audit-controls.json
          cat artifacts/pnp-f030/f032-wide-audit-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hall.py' -v
          python -m mathos.research.tga_proctor_hall > artifacts/pnp-f030/f033-hall-controls.json
          cat artifacts/pnp-f030/f033-hall-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_signed_hall.py' -v
          python -m mathos.research.tga_proctor_signed_hall > artifacts/pnp-f030/f033-signed-controls.json
          cat artifacts/pnp-f030/f033-signed-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_capacity.py' -v
          python -m mathos.research.tga_proctor_capacity > artifacts/pnp-f030/f033-capacity-controls.json
          cat artifacts/pnp-f030/f033-capacity-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_combined_boundary.py' -v
          python -m mathos.research.tga_proctor_combined_boundary > artifacts/pnp-f030/f033-combined-controls.json
          cat artifacts/pnp-f030/f033-combined-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_mixed_routing.py' -v
          python -m mathos.research.tga_proctor_mixed_routing > artifacts/pnp-f030/f034-mixed-controls.json
          cat artifacts/pnp-f030/f034-mixed-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_round_boundary.py' -v
          python -m mathos.research.tga_proctor_round_boundary > artifacts/pnp-f030/f034-round-controls.json
          cat artifacts/pnp-f030/f034-round-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_replay_bridge.py' -v
          python -m mathos.research.tga_proctor_replay_bridge > artifacts/pnp-f030/f034-executable-fixtures.lean
          python -m unittest discover -s tests -p 'test_tga_proctor_capacity_bridge.py' -v
          python -m mathos.research.tga_proctor_capacity_bridge > artifacts/pnp-f030/f034-capacity-fixtures.lean
          python -m unittest discover -s tests -p 'test_tga_proctor_xor_bridge.py' -v
          python -m mathos.research.tga_proctor_xor_bridge > artifacts/pnp-f030/f034-xor-fixtures.lean
          python -m unittest discover -s tests -p 'test_tga_proctor_unified_bridge.py' -v
          python -m mathos.research.tga_proctor_unified_bridge > artifacts/pnp-f030/f034-unified-fixtures.lean
          python -m unittest discover -s tests -p 'test_tga_proctor_data_fixtures.py' -v
          python -m mathos.research.tga_proctor_data_fixtures artifacts/pnp-f030/f034-data-fixtures
          python -m unittest discover -s tests -p 'test_tga_proctor_dimacs_fixtures.py' -v
          python -m mathos.research.tga_proctor_dimacs_fixtures artifacts/pnp-f030/f034-dimacs-fixtures
          python -m unittest discover -s tests -p 'test_tga_proctor_checker_cost.py' -v
          python -m mathos.research.tga_proctor_checker_cost > artifacts/pnp-f030/f034-checker-cost.json
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - shell: bash
        run: |
          set -euo pipefail
          lean --version | tee artifacts/pnp-f030/lean-version.txt
          grep -E 'version 4\.14\.0\b' artifacts/pnp-f030/lean-version.txt
          lean -DwarningAsError=true formal/ProctorRenamableHorn.lean 2>&1 | tee artifacts/pnp-f030/prior-kernel.txt
          lean -DwarningAsError=true formal/ProctorAdaptivePropagation.lean 2>&1 | tee artifacts/pnp-f030/kernel.txt
          cat formal/ProctorGF2.lean formal/ProctorParityElimination.lean > artifacts/pnp-f030/f032-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f032-combined.lean 2>&1 | tee artifacts/pnp-f030/f032-kernel.txt
          lean -DwarningAsError=true formal/ProctorHallDeficiency.lean 2>&1 | tee artifacts/pnp-f030/f033-kernel.txt
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean > artifacts/pnp-f030/f033-capacity-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f033-capacity-combined.lean 2>&1 | tee artifacts/pnp-f030/f033-capacity-kernel.txt
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean > artifacts/pnp-f030/f034-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f034-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-kernel.txt
          cat artifacts/pnp-f030/f034-combined.lean formal/ProctorPairedReplay.lean > artifacts/pnp-f030/f034-replay-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f034-replay-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-replay-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean artifacts/pnp-f030/f034-executable-fixtures.lean > artifacts/pnp-f030/f034-executable-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-executable-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-executable-kernel.txt
          grep -Fx 'F034_EXECUTABLE_REPLAY_OK cases=86' artifacts/pnp-f030/f034-executable-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean artifacts/pnp-f030/f034-capacity-fixtures.lean > artifacts/pnp-f030/f034-capacity-replay-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-capacity-replay-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-capacity-replay-kernel.txt
          grep -Fx 'F034_CAPACITY_REPLAY_OK cases=17' artifacts/pnp-f030/f034-capacity-replay-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean artifacts/pnp-f030/f034-xor-fixtures.lean > artifacts/pnp-f030/f034-xor-replay-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-xor-replay-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-xor-replay-kernel.txt
          grep -Fx 'F034_XOR_REPLAY_OK cases=18' artifacts/pnp-f030/f034-xor-replay-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean artifacts/pnp-f030/f034-unified-fixtures.lean > artifacts/pnp-f030/f034-unified-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-unified-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-unified-kernel.txt
          grep -Fx 'F034_UNIFIED_REPLAY_OK cases=53' artifacts/pnp-f030/f034-unified-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorDataParserMain.lean > artifacts/pnp-f030/f034-data-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-data-combined.lean -- --fixtures artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-data-kernel.txt
          grep -Fx 'F034_DATA_REPLAY_OK cases=67 accepted=19 rejected=48' artifacts/pnp-f030/f034-data-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorWireRoundtripMain.lean > artifacts/pnp-f030/f034-wire-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-wire-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-wire-kernel.txt
          grep -Fx 'F034_WIRE_ROUNDTRIP_OK expected=53' artifacts/pnp-f030/f034-wire-kernel.txt
          bash scripts/build_proctor_data_checker.sh artifacts/pnp-f030/f034-static-checker.lean
          cmp artifacts/pnp-f030/f034-static-checker.lean artifacts/pnp-f030/f034-data-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-static-checker.lean -- artifacts/pnp-f030/f034-data-fixtures/0.cnfdata artifacts/pnp-f030/f034-data-fixtures/0.proofdata > artifacts/pnp-f030/f034-cli-positive.txt
          grep -Fx CERTIFIED_UNSAT artifacts/pnp-f030/f034-cli-positive.txt
          set +e
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-static-checker.lean -- artifacts/pnp-f030/f034-data-fixtures/66.cnfdata artifacts/pnp-f030/f034-data-fixtures/66.proofdata > artifacts/pnp-f030/f034-cli-negative.txt
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -Fx REJECTED artifacts/pnp-f030/f034-cli-negative.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorEnvelopeRoundtripMain.lean > artifacts/pnp-f030/f034-envelope-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-envelope-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-envelope-kernel.txt
          grep -Fx 'F034_ENVELOPE_ROUNDTRIP_OK envelopes=53' artifacts/pnp-f030/f034-envelope-kernel.txt
          bash scripts/build_proctor_dimacs_checker.sh artifacts/pnp-f030/f034-dimacs-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-dimacs-combined.lean -- --fixtures artifacts/pnp-f030/f034-dimacs-fixtures 2>&1 | tee artifacts/pnp-f030/f034-dimacs-kernel.txt
          grep -Fx 'F034_DIMACS_REPLAY_OK cases=73 parsed=56 accepted=22 rejected=51' artifacts/pnp-f030/f034-dimacs-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorDimacsInput.lean formal/ProctorDimacsLexical.lean formal/ProctorDimacsMain.lean > artifacts/pnp-f030/f034-dimacs-lexical-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-dimacs-lexical-combined.lean -- --fixtures artifacts/pnp-f030/f034-dimacs-fixtures 2>&1 | tee artifacts/pnp-f030/f034-dimacs-lexical-kernel.txt
          grep -Fx 'F034_DIMACS_REPLAY_OK cases=73 parsed=56 accepted=22 rejected=51' artifacts/pnp-f030/f034-dimacs-lexical-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCheckerCost.lean > artifacts/pnp-f030/f034-cost-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f034-cost-combined.lean 2>&1 | tee artifacts/pnp-f030/f034-cost-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorChainMeterMain.lean > artifacts/pnp-f030/f034-chain-meter-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-chain-meter-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-chain-meter-kernel.txt
          grep -Fx 'F034_CHAIN_METER_OK cases=53 hand_controls=5' artifacts/pnp-f030/f034-chain-meter-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorCapacityMeterMain.lean > artifacts/pnp-f030/f034-capacity-meter-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-capacity-meter-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-capacity-meter-kernel.txt
          grep -Fx 'F034_CAPACITY_METER_OK cases=24 hand_controls=6' artifacts/pnp-f030/f034-capacity-meter-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorUnifiedMeterMain.lean > artifacts/pnp-f030/f034-unified-meter-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-unified-meter-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-unified-meter-kernel.txt
          grep -Fx 'F034_UNIFIED_METER_OK cases=53 accepted=19 rejected=34 hand_controls=4' artifacts/pnp-f030/f034-unified-meter-kernel.txt
          cat artifacts/pnp-f030/f034-replay-combined.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorCheckerCost.lean formal/ProctorChainMeter.lean formal/ProctorCapacityMeter.lean formal/ProctorXorMeter.lean formal/ProctorUnifiedMeter.lean formal/ProctorPolynomialMeter.lean formal/ProctorPolynomialMeterMain.lean > artifacts/pnp-f030/f034-polynomial-meter-combined.lean
          lean -DwarningAsError=true --run artifacts/pnp-f030/f034-polynomial-meter-combined.lean -- artifacts/pnp-f030/f034-data-fixtures 2>&1 | tee artifacts/pnp-f030/f034-polynomial-meter-kernel.txt
          grep -Fx 'F034_POLYNOMIAL_METER_OK chains=53 xor_sums=21 word_controls=1' artifacts/pnp-f030/f034-polynomial-meter-kernel.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          out = Path("artifacts/pnp-f030")
          groups = [
              ("ProctorRenamableHorn", "prior-kernel.txt", ("pair_encoding", "guard_exact", "deletion_preserves_guard", "flip_involution")),
              ("ProctorAdaptivePropagation", "kernel.txt", ("unit_forces", "pure_positive_preserves", "pure_negative_preserves", "false_residual_refutes", "split_refutes")),
          ]
          groups += [
              ("ProctorGF2", "f032-kernel.txt", ("dot_add", "row_replace", "certificate_sound", "elimination_step")),
              ("ProctorParityElimination", "f032-kernel.txt", ("resolution_sound", "projection_iff", "clause_split_iff", "block_self", "block_false_eq", "parity_block_iff", "parity_select", "row_block_sound", "parity_blocks_unsat", "all_true_or_false_member")),
          ]
          groups.append(("ProctorHallDeficiency", "f033-kernel.txt", ("bounded_injection", "finite_demand_choices", "capacity_injection", "hall_deficiency", "positive_clause_demand", "negative_pair_capacity", "hall_cnf_unsat")))
          groups.append(("ProctorCapacityDeficiency", "f033-capacity-kernel.txt", ("truths_mem", "truths_distinct", "distinct_prefix", "opposite_conflict", "group_bound", "length_append_local", "mem_append_left_local", "mem_append_right_local", "total_bound", "covered_truth", "finite_choices", "locate_bound", "locate_injective", "capacity_cnf_unsat")))
