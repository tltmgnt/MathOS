name: Proctor PNP adaptive propagation
on:
  push:
    paths:
      - 'formal/ProctorAdaptivePropagation.lean'
      - 'formal/ProctorParityElimination.lean'
      - 'formal/ProctorHallDeficiency.lean'
      - 'formal/ProctorGF2.lean'
      - 'formal/ProctorRenamableHorn.lean'
      - 'mathos/research/tga_proctor*.py'
      - 'tests/test_tga_proctor*.py'
      - 'docs/research/tga-universal/PNP-F030.md'
      - '.github/workflows/proctor-pnp-adaptive-propagation.yml'
  pull_request:
    paths:
      - 'formal/ProctorAdaptivePropagation.lean'
      - 'formal/ProctorParityElimination.lean'
      - 'formal/ProctorHallDeficiency.lean'
      - 'formal/ProctorGF2.lean'
      - 'formal/ProctorRenamableHorn.lean'
      - 'mathos/research/tga_proctor*.py'
      - 'tests/test_tga_proctor*.py'
      - 'docs/research/tga-universal/PNP-F030.md'
      - '.github/workflows/proctor-pnp-adaptive-propagation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          mkdir -p artifacts/pnp-f030
          python -m unittest discover -s tests -p 'test_tga_proctor_affine_backdoor.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_resolution_gates.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_renamable_horn.py' -v
          python -m unittest discover -s tests -p 'test_tga_proctor_adaptive_propagation.py' -v
          python -m mathos.research.tga_proctor_adaptive_propagation > artifacts/pnp-f030/controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_component_search.py' -v
          python -m mathos.research.tga_proctor_component_search > artifacts/pnp-f030/f031-native-controls.json
          cat artifacts/pnp-f030/f031-native-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_dynamic_components.py' -v
          python -m mathos.research.tga_proctor_dynamic_components > artifacts/pnp-f030/f031-dynamic-controls.json
          cat artifacts/pnp-f030/f031-dynamic-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_dynamic_resolution.py' -v
          python -m mathos.research.tga_proctor_dynamic_resolution > artifacts/pnp-f030/f031-resolution-controls.json
          cat artifacts/pnp-f030/f031-resolution-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_xor_cnf.py' -v
          python -m mathos.research.tga_proctor_xor_cnf > artifacts/pnp-f030/f032-xor-controls.json
          cat artifacts/pnp-f030/f032-xor-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_xor_bve.py' -v
          python -m mathos.research.tga_proctor_xor_bve > artifacts/pnp-f030/f032-bve-controls.json
          cat artifacts/pnp-f030/f032-bve-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_blind_parity.py' -v
          python -m mathos.research.tga_proctor_blind_parity > artifacts/pnp-f030/f032-blind-controls.json
          cat artifacts/pnp-f030/f032-blind-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hybrid_sat.py' -v
          python -m mathos.research.tga_proctor_hybrid_sat > artifacts/pnp-f030/f032-hybrid-controls.json
          cat artifacts/pnp-f030/f032-hybrid-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hybrid_adversary.py' -v
          python -m mathos.research.tga_proctor_hybrid_adversary > artifacts/pnp-f030/f032-wide-audit-controls.json
          cat artifacts/pnp-f030/f032-wide-audit-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_hall.py' -v
          python -m mathos.research.tga_proctor_hall > artifacts/pnp-f030/f033-hall-controls.json
          cat artifacts/pnp-f030/f033-hall-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_signed_hall.py' -v
          python -m mathos.research.tga_proctor_signed_hall > artifacts/pnp-f030/f033-signed-controls.json
          cat artifacts/pnp-f030/f033-signed-controls.json
          python -m unittest discover -s tests -p 'test_tga_proctor_capacity.py' -v
          python -m mathos.research.tga_proctor_capacity > artifacts/pnp-f030/f033-capacity-controls.json
          cat artifacts/pnp-f030/f033-capacity-controls.json
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - shell: bash
        run: |
          set -euo pipefail
          lean --version | tee artifacts/pnp-f030/lean-version.txt
          grep -E 'version 4\.14\.0\b' artifacts/pnp-f030/lean-version.txt
          lean -DwarningAsError=true formal/ProctorRenamableHorn.lean 2>&1 | tee artifacts/pnp-f030/prior-kernel.txt
          lean -DwarningAsError=true formal/ProctorAdaptivePropagation.lean 2>&1 | tee artifacts/pnp-f030/kernel.txt
          cat formal/ProctorGF2.lean formal/ProctorParityElimination.lean > artifacts/pnp-f030/f032-combined.lean
          lean -DwarningAsError=true artifacts/pnp-f030/f032-combined.lean 2>&1 | tee artifacts/pnp-f030/f032-kernel.txt
          lean -DwarningAsError=true formal/ProctorHallDeficiency.lean 2>&1 | tee artifacts/pnp-f030/f033-kernel.txt
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          out = Path("artifacts/pnp-f030")
          groups = [
              ("ProctorRenamableHorn", "prior-kernel.txt", ("pair_encoding", "guard_exact", "deletion_preserves_guard", "flip_involution")),
              ("ProctorAdaptivePropagation", "kernel.txt", ("unit_forces", "pure_positive_preserves", "pure_negative_preserves", "false_residual_refutes", "split_refutes")),
          ]
          groups += [
              ("ProctorGF2", "f032-kernel.txt", ("dot_add", "row_replace", "certificate_sound", "elimination_step")),
              ("ProctorParityElimination", "f032-kernel.txt", ("resolution_sound", "projection_iff", "clause_split_iff", "block_self", "block_false_eq", "parity_block_iff", "parity_select", "row_block_sound", "parity_blocks_unsat", "all_true_or_false_member")),
          ]
          groups.append(("ProctorHallDeficiency", "f033-kernel.txt", ("bounded_injection", "finite_demand_choices", "capacity_injection", "hall_deficiency", "positive_clause_demand", "negative_pair_capacity", "hall_cnf_unsat")))
          verified = []
          for namespace, log, names in groups:
              lines = (out / log).read_text().splitlines()
              for name in names:
                  full = f"{namespace}.{name}"
                  if lines.count(f"'{full}' does not depend on any axioms") != 1:
                      raise SystemExit(f"strict axiom check failed: {full}")
                  verified.append(full)
          report = dict(status="LOCAL_PROPAGATION_LEMMAS_ONLY", declarations=verified,
                        source_sha256=hashlib.sha256(Path("formal/ProctorAdaptivePropagation.lean").read_bytes()).hexdigest(),
                        universal_bound=False, machine_refinement=False, independent_review=False)
          report["f032_scope"] = "LOCAL_PARITY_AND_PROJECTION_SEMANTICS_ONLY"
          report["f032_source_sha256"] = hashlib.sha256(Path("formal/ProctorParityElimination.lean").read_bytes()).hexdigest()
          report["f032_python_refinement_verified"] = False
          report["f033_scope"] = "LOCAL_HALL_CNF_SEMANTICS_ONLY"
          report["f033_source_sha256"] = hashlib.sha256(Path("formal/ProctorHallDeficiency.lean").read_bytes()).hexdigest()
          report["f033_python_refinement_verified"] = False
          (out / "lean-report.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-f030-scoped-evidence
          path: artifacts/pnp-f030/
          if-no-files-found: error
