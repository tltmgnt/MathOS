name: Proctor F038 unrestricted approximate quotients
on:
  push:
    branches: ['research/pnp-f038-unrestricted-approximate-quotients']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_approximate_quotients.js
          node mathos/research/f038_unrestricted_approximate_quotients.js | tee /tmp/current.txt
          python - <<'PY'
          import json
          prefix = 'F038_APPROXIMATE_QUOTIENTS_OK '
          with open('/tmp/current.txt') as f:
              rows = [json.loads(line[len(prefix):]) for line in f if line.startswith(prefix)]
          assert len(rows) == 1
          r = rows[0]
          assert r['fixtures'] == 32
          assert r['sums'] == [399,68698,185,201,236,39,197,351]
          assert r['properChecks'] == 1503
          assert r['occupancyChecks'] == 9
          assert r['unique'] == 2
          for row,m,err,delta in zip(r['controls'], [33,65,129], [720,1440,2880], [.661157,.340828,.173067]):
              assert row == [m,16*m,err,delta,[5]*9]
          assert len(r['controls']) == 3
          PY
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_APPROXIMATE_QUOTIENTS_GATE_OK status=OPEN promotion=NONE')
          PY
