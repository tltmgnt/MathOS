name: Proctor F038 unrestricted mobile projection
on:
  push:
    branches: ['research/pnp-f038-unrestricted-mobile-projection']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_mobile_projection.py
          python -m mathos.research.f038_unrestricted_distributed_hyperclique | tee /tmp/prior.txt
          grep -F 'F038_UNRESTRICTED_DISTRIBUTED_HYPERCLIQUE_OK' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_mobile_projection | tee /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_MOBILE_PROJECTION_OK {"rows":[[3,2,13,2640,8,6,2,64,8,29,18,19],[3,3,20,9941,8,6,2,216,8,61,36,62],[4,2,16,5009,8,6,3,128,16,129,37,25],[4,3,25,19676,8,6,2,648,24,408,73,124],[5,2,19,8494,8,5,3,256,32,458,63,37],[5,3,30,34311,8,6,2,1944,72,2111,120,262],[6,2,22,13311,8,4,2,512,64,1461,97,68],[6,3,35,54846,8,6,2,5832,216,9670,178,741],[7,2,25,19676,8,4,2,1024,128,4332,140,132],[7,3,40,82281,8,5,2,17496,648,41193,248,2197]],"shifts":15360}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_MOBILE_PROJECTION_GATE_OK status=OPEN promotion=NONE')
          PY
