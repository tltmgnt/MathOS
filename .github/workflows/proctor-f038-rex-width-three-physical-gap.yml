name: Proctor F038 RE-X physical gap codec and normalization composition
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-physical-gap']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical gap codec and compiled header regression
        run: |
          node mathos/research/f038_rex_width_three_gap_physical_audit.js > /tmp/d5t-gap.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5t-gap.json');a.equal(r.gap.patterns,8223);a.equal(r.gap.sparse,3576);a.equal(r.gap.dense,4647);a.equal(r.gap.physical,16);a.equal(r.gap.malformed,12);a.deepEqual(r.gap.states,[31330,35754]);a.equal(r.header.valid,129);a.equal(r.header.invalid,2335);a.equal(r.header.maxSteps,482678);a.equal(r.header.maxWidth,8);console.log('D5T_PHYSICAL_GAP_HEADER_OK')"
  normalization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual normalized checkpoint and loader composition
        run: |
          node mathos/research/f038_rex_width_three_gap_composition_audit.js > /tmp/d5t-composition.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d5t-composition.json');a.equal(r.cases,4);a.equal(r.blocks,520);a.equal(r.positions,5121);a.equal(r.rawBits,275593);a.deepEqual(r.rows.map(x=>x.total),[31570963,32503873,57363415,298878185]);console.log('D5T_NORMALIZATION_COMPOSITION_OK')"
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D5T_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
