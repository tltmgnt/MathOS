name: MathOS Academy quality gates
on:
  pull_request:
    paths:
      - 'curriculum/academy/**'
      - 'tests/test_curriculum_academy.py'
      - '.github/workflows/academy-quality.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/academy/**'
      - 'tests/test_curriculum_academy.py'
      - '.github/workflows/academy-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Reject invalid catalog, certification and external validation claims
        run: python curriculum/academy/validate.py --json
      - name: Run adversarial curriculum structure tests
        run: python -m unittest discover -s tests -p 'test_curriculum_academy.py' -v
      - name: Run existing worked examples
        run: python curriculum/lab.py --verify
      - name: Verify existing Clay curriculum semantics
        run: python -m unittest discover -s tests -p 'test_agentic_curriculum.py' -v
