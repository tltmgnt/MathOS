name: TGA Lean kernel bridge
on:
  pull_request:
    paths:
      - 'mathos/tga_lean_bridge.py'
      - 'tests/test_tga_lean_bridge.py'
      - 'benchmarks/lean/tga_graph_smoke.json'
      - 'docs/implementation/TGA_LEAN_BRIDGE.md'
      - '.github/workflows/tga-lean-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/tga_lean_bridge.py'
      - 'tests/test_tga_lean_bridge.py'
      - 'benchmarks/lean/tga_graph_smoke.json'
      - 'docs/implementation/TGA_LEAN_BRIDGE.md'
      - '.github/workflows/tga-lean-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run bridge and failure-path tests
        run: python -m unittest discover -s tests -p 'test_tga_lean_bridge.py' -v
      - name: Check Python syntax
        run: python -m py_compile mathos/tga_lean_bridge.py
      - name: Install pinned Lean 4.14.0
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate a scoped theorem and check it with the Lean kernel
        run: |
          python -m mathos.tga_lean_bridge emit benchmarks/lean/tga_graph_smoke.json --output /tmp/MathOSTGA.lean
          python -m mathos.tga_lean_bridge check benchmarks/lean/tga_graph_smoke.json
      - name: Independently replay the finite graph decision
        run: python -m unittest discover -s tests -p 'test_tga_theorem.py' -v
