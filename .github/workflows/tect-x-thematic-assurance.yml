name: TECT-X thematic evidence consistency (not proof certification)

on:
  pull_request:
    paths:
      - 'docs/research/**'
      - 'mathos/research/tect_x_*.py'
      - 'tests/test_tect_x_thematic_gate.py'
      - 'curriculum/tect_x_zeta_tda_standalone/**'
      - 'apps/tect_x_faculty_review/**'
      - 'evidence_tect/**'
      - '.github/workflows/tect-x-thematic-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/research/**'
      - 'mathos/research/tect_x_*.py'
      - 'tests/test_tect_x_thematic_gate.py'
      - '.github/workflows/tect-x-thematic-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-evidence-audit:
    name: Source links, experiment scope, and no-unreviewed-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify thematic register and linked status records
        run: python -m mathos.research.tect_x_thematic_gate --json
      - name: Test fail-closed scope assertions
        run: python -m unittest discover -s tests -p 'test_tect_x_thematic_gate.py' -v
      - name: Verify Python syntax
        run: python -m py_compile mathos/research/tect_x_thematic_gate.py tests/test_tect_x_thematic_gate.py
