name: Proctor F038 unate interface
on:
  push:
    branches: ['research/pnp-f038-unate-interface']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m mathos.research.f038_symbolic_interface | tee /tmp/symbolic.txt
          grep -Fx 'F038_SYMBOLIC_INTERFACE_OK families=8192 parameters=65536 row_checks=1835008 total=592 max_nodes=91' /tmp/symbolic.txt
          grep -Fx 'F038_LOG_WIDTH_CERTIFICATION_OK formulas=4096 unsat=2736 sat=1360 parameters=32768 feasible=30464 address_checks=254608 max_bag=7 max_variables=55 max_clauses=74' /tmp/symbolic.txt
          python -m mathos.research.f038_unate_interface | tee /tmp/unate.txt
          grep -Fx 'F038_UNATE_SEEDS_OK families=8192 total=592 non_total=7600 seed_probes=30964 missing=24508 successful_slices=6456 reused_witnesses=13421 parameters=65536 max_probes=8' /tmp/unate.txt
          grep -Fx 'F038_SEMANTIC_POLARITY_OK matrices=4096 unsat=2736 sat=1360 projection_checks=131072 rising_edges=32768 falling_edges=2304 unate=2736 max_variables=109 max_clauses=127' /tmp/unate.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNATE_INTERFACE_GATE_OK status=OPEN')
          PY
