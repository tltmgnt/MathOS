name: Lean proof-route logic

on:
  push:
    paths:
      - 'formal/**'
      - 'mathos/research/lemma_verification.py'
      - 'docs/research/LEMMA_CANDIDATES.v1.json'
      - 'tests/test_lemma_verification.py'
      - 'mathos/research/theorem_assurance.py'
      - 'docs/research/THEOREM_ASSURANCE.v1.json'
      - 'tests/test_theorem_assurance.py'
      - 'mathos/research/paper_packet.py'
      - 'tests/test_paper_packet.py'
      - 'tests/test_external_review.py'
      - 'mathos/research/external_review.py'
      - 'mathos/research/lean_axiom_audit.py'
      - 'docs/research/papers/**'
      - '.github/workflows/proof-route-lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'mathos/research/lemma_verification.py'
      - 'docs/research/LEMMA_CANDIDATES.v1.json'
      - 'tests/test_lemma_verification.py'
      - 'mathos/research/theorem_assurance.py'
      - 'docs/research/THEOREM_ASSURANCE.v1.json'
      - 'tests/test_theorem_assurance.py'
      - 'mathos/research/paper_packet.py'
      - 'tests/test_paper_packet.py'
      - 'tests/test_external_review.py'
      - 'mathos/research/external_review.py'
      - 'mathos/research/lean_axiom_audit.py'
      - 'docs/research/papers/**'
      - '.github/workflows/proof-route-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check bounded proof-route lemmas
        run: |
          lean formal/ProofRouteLogic.lean
          lean formal/BooleanRoutes.lean
          lean formal/FiniteCompletionPruning.lean
          LEAN_PATH="$PWD/formal" lean -o formal/BooleanRoutes.olean formal/BooleanRoutes.lean
          LEAN_PATH="$PWD/formal" lean -o formal/FiniteCompletionPruning.olean formal/FiniteCompletionPruning.lean
          LEAN_PATH="$PWD/formal" lean -o formal/FiniteCandidateGeneration.olean formal/FiniteCandidateGeneration.lean
          LEAN_PATH="$PWD/formal" lean formal/FiniteRouteDAG.lean
          lean formal/SATSupport.lean
      - name: Check generated exact counterexample witness using pinned Lean
        run: |
          python -m mathos.research.lemma_verification --verify-lean --output-dir artifacts/lemmas
          python -m json.tool artifacts/lemmas/lemma_verification_report.json > /dev/null
      - name: Check SAT1 proof artifact with pinned Lean and preserve scope gates
        run: |
          python -m mathos.research.theorem_assurance --verify-lean --output-dir artifacts/theorems > /tmp/theorem-assurance-output.json
          python -m json.tool artifacts/theorems/theorem_assurance.json > /dev/null
      - name: Generate pinned-Lean SAT1 academic review packet
        run: |
          python -m mathos.research.paper_packet --verify-lean --output-dir artifacts/paper
          python -m json.tool artifacts/paper/packet_manifest.json > /dev/null
      - name: Audit transitive axioms of the formal SAT1 theorem
        run: |
          python -m mathos.research.lean_axiom_audit --output-dir artifacts/external-review
          python -m mathos.research.external_review --verify-lean --output-dir artifacts/external-review
          python -m json.tool artifacts/external-review/sat1_axiom_audit.json > /dev/null
          python -m json.tool artifacts/external-review/external_review_status.json > /dev/null
      - name: Upload formal axiom and independent-review status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat1-external-review-gate-lean-4-14
          path: artifacts/external-review/
          if-no-files-found: ignore
      - name: Upload pinned-Lean SAT1 manuscript and reviewer source packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat1-review-packet-lean-4-14
          path: artifacts/paper/
          if-no-files-found: ignore
      - name: Upload SAT1 theorem verification and independent review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat1-lean-4-14-assurance
          path: artifacts/theorems/
          if-no-files-found: ignore
      - name: Upload kernel-check provenance and generated Lean handoffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-lean-4-14-witness-evidence
          path: artifacts/lemmas/
          if-no-files-found: ignore
