name: Proctor F038 unrestricted approximate difference covers
on:
  push:
    branches: ['research/pnp-f038-unrestricted-approximate-difference-covers']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_approximate_difference_covers.js
          node mathos/research/f038_unrestricted_approximate_difference_covers.js | tee /tmp/current.txt
          python - <<'PY'
          import json
          prefix = 'F038_APPROXIMATE_DIFFERENCE_COVERS_OK '
          with open('/tmp/current.txt') as f:
              rows = [json.loads(line[len(prefix):]) for line in f if line.startswith(prefix)]
          assert len(rows) == 1
          r = rows[0]
          assert r['n'] == {"fixtures":12,"passes":24,"candidates":144,"radiusChecks":11364,"partitionChecks":35794596,"tailChecks":576,"capChecks":4646,"full":242340,"success":125874,"heavy":0,"narrow":1522,"template":23260,"correction":3204,"union":3204,"exact":0,"templateModels":26726,"correctionModels":3300,"unionModels":9516,"local":101400,"membership":199680,"children":99840,"relabels":8224,"greedy":582}
          assert r['selected'] == {"0,1":12,"2,1":12}
          assert r['controls'] == [[16,8,64,56,120,56],[32,16,256,240,496,240],[64,32,1024,992,2016,992]]
          assert r['correctionControl'] == [1,9]
          assert r['exactRoute'] == [1,25088,1]
          assert r['extraControl'] == [1,1,4]
          PY
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_APPROXIMATE_DIFFERENCE_COVERS_GATE_OK status=OPEN promotion=NONE')
          PY
