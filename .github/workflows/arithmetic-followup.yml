name: MathOS Experiments 023-050 — scoped arithmetic follow-up

on:
  pull_request:
    paths:
      - 'experiments/internal_reasoning/experiments_023_050.py'
      - 'tests/test_experiments_023_050.py'
      - '.github/workflows/arithmetic-followup.yml'
      - 'docs/research/EXPERIMENTS_023_050.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-baselines:
    name: Verify registry and fixed baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify experiment count, independent arithmetic truth and scope gates
        run: python -m unittest discover -s tests -p 'test_experiments_023_050.py' -v
      - name: Execute all 28 preregistered fixed-baseline controls without models
        run: |
          python -m experiments.internal_reasoning.experiments_023_050 \
            --start 23 --end 50 --backend baseline \
            --output-dir artifacts/followup/baselines
      - uses: actions/upload-artifact@v4
        with:
          name: mathos-exp-023-050-baselines-only
          path: artifacts/followup/baselines/
          if-no-files-found: error
          retention-days: 30

  controlled-model-evaluations:
    name: Evaluate ${{ matrix.model }} / batch ${{ matrix.shard }}
    needs: protocol-and-baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [distilgpt2, tiny-gpt2]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only research dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install "transformers>=4.40,<5"
      - name: Resolve immutable public model revision for this recorded execution
        id: model_revision
        env:
          MODEL_KEY: ${{ matrix.model }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODEL_KEY" == "distilgpt2" ]]; then
            MODEL_ID="distilgpt2"
          else
            MODEL_ID="sshleifer/tiny-gpt2"
          fi
          REVISION="$(python - "$MODEL_ID" <<'PY'
          import re
          import sys
          from huggingface_hub import HfApi
          sha = HfApi().model_info(sys.argv[1]).sha
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Hugging Face did not return an immutable commit")
          print(sha)
          PY
          )"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Run 7 registered experiments, preserving every model response
        env:
          MODEL_KEY: ${{ matrix.model }}
          SHARD: ${{ matrix.shard }}
          REVISION: ${{ steps.model_revision.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          FIRST=$((23 + 7 * SHARD))
          LAST=$((FIRST + 6))
          python -m experiments.internal_reasoning.experiments_023_050 \
            --start "$FIRST" --end "$LAST" --count 12 \
            --backend model --model "$MODEL_KEY" --revision "$REVISION" \
            --output-dir "artifacts/followup/$MODEL_KEY/shard-$SHARD"
      - name: Upload model-specific records and immutable revision metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mathos-exp-023-050-${{ matrix.model }}-shard-${{ matrix.shard }}
          path: artifacts/followup/${{ matrix.model }}/shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 30
