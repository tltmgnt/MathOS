name: Proctor F038 MRA-X selector restriction formulas
on:
  push:
    branches: ['research/pnp-f038-mrax-selector-restriction-formulas']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_selector_restriction_formulas.py
          python -m mathos.research.f038_selector_degree_symmetry | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_SELECTOR_DEGREE_OK {"circuits":[[2,0,4,[2,2,0]],[2,1,16,[2,6,8]],[3,1,38,[2,12,24,0]],[3,2,152,[2,14,72,64]],[4,1,70,[2,20,48,0,0]]],"controls":4,"polynomials":[[1,2,3,3,3,2,1],[2,8,15,15,15,8,1],[3,26,255,255,255,26,1],[4,64,65535,43145,34953,64,1]],"prime":[[2,1,1,2,4,8,3,1],[2,2,2,8,256,1024,95,1],[3,1,1,3,8,24,7,2],[3,2,2,15,32768,294912,19759,2],[5,1,1,5,32,160,31,4]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_selector_restriction_formulas | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_SELECTOR_FORMULAS_OK {"blocks":[[6,2,1,2,2,4,2],[12,4,2,4,12,48,24],[24,8,3,8,56,336,168],[48,16,4,16,480,3840,2400],[96,32,5,32,2976,29760,26784]],"controls":4,"formulas":[4096,28672,77824,46320,4],"mux":[[1,4,4,8,16,4,4,16],[2,7,16,64,512,32,32,256],[3,12,256,2048,262144,1024,1024,16384]],"sharing":[[1,3,4,2,4],[2,6,10,4,8],[4,12,46,16,32],[8,24,766,256,512]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_SELECTOR_FORMULAS_GATE_OK status=OPEN')
          PY
