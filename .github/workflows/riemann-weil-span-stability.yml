name: TECT-X growing Weil spans and coercivity no-go
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_span_stability.py'
      - 'tests/test_riemann_weil_span_stability.py'
      - 'docs/research/TECTX_WEIL_GROWING_SPAN_STABILITY.md'
      - '.github/workflows/riemann-weil-span-stability.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_span_stability.py'
      - 'tests/test_riemann_weil_span_stability.py'
      - 'docs/research/TECTX_WEIL_GROWING_SPAN_STABILITY.md'
      - '.github/workflows/riemann-weil-span-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growing-span-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test exact dimension-independent L1 tail and clustered-center no-go
        run: python -m unittest discover -s tests -p 'test_riemann_weil_span_stability.py' -v
      - name: Produce exact rational finite-to-infinite boundary audit
        run: |
          python -m mathos.research.riemann_weil_span_stability --centers 0,1/5,1/2 --coefficients 1,-2,3 --output artifacts/riemann/weil_span_stability.json
          python -m json.tool artifacts/riemann/weil_span_stability.json > /dev/null
      - name: Reject unsupported global Weil positive Hilbert and RH claims
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/weil_span_stability.json',encoding='utf-8') as file:
              r=json.load(file)
          assert r['status']=='DIMENSION_FREE_L1_TAIL_AND_NO_UNIFORM_EUCLIDEAN_COERCIVITY'
          p=r['dimension_free_prime_tail']
          assert Fraction(p['bound'])==36*Fraction(p['constant'])
          assert p['dimension_independent_constant']
          assert r['no_go_for_uniform_coefficient_gap']['absence_of_uniform_kappa_proved']
          assert Fraction(r['previous_three_dimensional_relative_bound']['relative_margin_after_trace_bound'])==Fraction(1,10_000_000)
          assert not any(r['assurance'].values())
          assert not r['conditional_Hilbert_space']['hypothesis_proved']
          assert not r['conditional_Hilbert_space']['completion_constructed_unconditionally']
          PY
