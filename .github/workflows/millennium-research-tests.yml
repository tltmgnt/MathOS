name: Millennium research probes (bounded)

on:
  push:
    paths:
      - 'mathos/research/**'
      - 'tests/test_millennium_attacks_*.py'
      - 'docs/research/MILLENNIUM_ATTACK_*.md'
      - 'tests/test_seven_hypotheses.py'
      - 'tests/test_first_use_case_reverse_engineering.py'
      - 'tests/test_clay_alignment.py'
      - 'tests/test_clay_proof_topology.py'
      - 'tests/test_agentic_clay.py'
      - 'tests/test_agentic_curriculum.py'
      - 'tests/test_bridge_agent_focus.py'
      - 'tests/test_lemma_verification.py'
      - 'tests/test_claim_twin.py'
      - 'tests/test_theorem_assurance.py'
      - 'docs/research/HYPOTHESES.v1.json'
      - 'docs/research/SEVEN_HYPOTHESIS_LAB.md'
      - 'docs/research/FIRST_USE_CASE_REVERSE_ENGINEERING.md'
      - 'docs/research/CLAY_FULL_TARGETS.v1.json'
      - 'docs/research/CLAY_TARGET_ALIGNMENT.md'
      - 'docs/research/CLAY_PROOF_ROUTES.v1.json'
      - 'docs/research/LEMMA_CANDIDATES.v1.json'
      - 'docs/research/LEMMA_VERIFICATION.md'
      - 'docs/research/CLAIM_TWIN.v1.json'
      - 'docs/research/CLAIM_CERTIFICATE_DIGITAL_TWIN.md'
      - 'docs/research/THEOREM_ASSURANCE.v1.json'
      - 'docs/research/THEOREM_ASSURANCE.md'
      - 'formal/SATSupport.lean'
      - 'docs/research/CLAY_EXTERNAL_CLAIMS.v1.json'
      - 'docs/research/CLAY_PROOF_TOPOLOGY.md'
      - 'docs/research/AGENTIC_RESEARCH_PROCESS.md'
      - 'curriculum/agentic-clay-v1.json'
      - 'curriculum/agentic-clay-24-week.md'
      - '.github/workflows/agentic-clay-research.yml'
      - 'docs/proof-analysis/OBLIGATIONS.v1.json'
      - '.github/workflows/millennium-research-tests.yml'
  pull_request:
    paths:
      - 'mathos/research/**'
      - 'tests/test_millennium_attacks_*.py'
      - 'docs/research/MILLENNIUM_ATTACK_*.md'
      - 'tests/test_seven_hypotheses.py'
      - 'tests/test_first_use_case_reverse_engineering.py'
      - 'tests/test_clay_alignment.py'
      - 'tests/test_clay_proof_topology.py'
      - 'tests/test_agentic_clay.py'
      - 'tests/test_agentic_curriculum.py'
      - 'tests/test_bridge_agent_focus.py'
      - 'tests/test_lemma_verification.py'
      - 'tests/test_claim_twin.py'
      - 'tests/test_theorem_assurance.py'
      - 'docs/research/HYPOTHESES.v1.json'
      - 'docs/research/SEVEN_HYPOTHESIS_LAB.md'
      - 'docs/research/FIRST_USE_CASE_REVERSE_ENGINEERING.md'
      - 'docs/research/CLAY_FULL_TARGETS.v1.json'
      - 'docs/research/CLAY_TARGET_ALIGNMENT.md'
      - 'docs/research/CLAY_PROOF_ROUTES.v1.json'
      - 'docs/research/LEMMA_CANDIDATES.v1.json'
      - 'docs/research/LEMMA_VERIFICATION.md'
      - 'docs/research/CLAIM_TWIN.v1.json'
      - 'docs/research/CLAIM_CERTIFICATE_DIGITAL_TWIN.md'
      - 'docs/research/THEOREM_ASSURANCE.v1.json'
      - 'docs/research/THEOREM_ASSURANCE.md'
      - 'formal/SATSupport.lean'
      - 'docs/research/CLAY_EXTERNAL_CLAIMS.v1.json'
      - 'docs/research/CLAY_PROOF_TOPOLOGY.md'
      - 'docs/research/AGENTIC_RESEARCH_PROCESS.md'
      - 'curriculum/agentic-clay-v1.json'
      - 'curriculum/agentic-clay-24-week.md'
      - '.github/workflows/agentic-clay-research.yml'
      - 'docs/proof-analysis/OBLIGATIONS.v1.json'
      - '.github/workflows/millennium-research-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-research-probes:
    name: bounded-probes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check bounded mathematical experiments
        run: |
          python -m unittest discover -s tests -p 'test_millennium_attacks_001.py' -v
          python -m unittest discover -s tests -p 'test_millennium_attacks_002.py' -v
          python -m mathos.research.millennium_attacks_001 > /tmp/millennium-attacks-001.json
          python -m mathos.research.millennium_attacks_002 > /tmp/millennium-attacks-002.json
          python -m json.tool /tmp/millennium-attacks-001.json > /dev/null
          python -m json.tool /tmp/millennium-attacks-002.json > /dev/null
          python -m unittest discover -s tests -p 'test_seven_hypotheses.py' -v
          python -m unittest discover -s tests -p 'test_first_use_case_reverse_engineering.py' -v
          python -m unittest discover -s tests -p 'test_clay_alignment.py' -v
          python -m unittest discover -s tests -p 'test_clay_proof_topology.py' -v
          python -m unittest discover -s tests -p 'test_agentic_clay.py' -v
          python -m unittest discover -s tests -p 'test_agentic_curriculum.py' -v
          python -m mathos.research.agentic_curriculum --track all --output-dir artifacts/curriculum
          python -m json.tool artifacts/curriculum/curriculum_plan.json > /dev/null
          python -m unittest discover -s tests -p 'test_bridge_agent_focus.py' -v
          python -m unittest discover -s tests -p 'test_lemma_verification.py' -v
          python -m unittest discover -s tests -p 'test_claim_twin.py' -v
          python -m mathos.research.claim_twin --track all --output-dir artifacts/claim-twin
          python -m json.tool artifacts/claim-twin/bounded_claim_certificates.json > /dev/null
          python -m unittest discover -s tests -p 'test_theorem_assurance.py' -v
          python -m mathos.research.agentic_clay --provider offline --track all --rounds 1 --max-model-calls 28 --output-dir artifacts/agents
          python -m json.tool artifacts/agents/agentic_research_report.json > /dev/null
          python -m mathos.research.agentic_clay --provider offline --track Navier-Stokes --route-id NS.C --claim-id BRIDGE.NS.C_forced_breakdown --rounds 1 --max-model-calls 4 --output-dir artifacts/agents/ns-c
          python -m json.tool artifacts/agents/ns-c/agentic_research_report.json > /dev/null
          python -m mathos.research.agentic_clay --provider offline --track P-versus-NP --route-id PNP.equality --claim-id PNP.sat_runtime --rounds 1 --max-model-calls 4 --output-dir artifacts/agents/pnp-algebra
          python -m mathos.research.lemma_verification --agent-report artifacts/agents/pnp-algebra/agentic_research_report.json --output-dir artifacts/lemmas
          python -m json.tool artifacts/lemmas/lemma_verification_report.json > /dev/null
          python -m mathos.research.theorem_assurance --output-dir artifacts/theorems > /tmp/theorem-assurance-summary.json
          python -m json.tool artifacts/theorems/theorem_assurance.json > /dev/null
          python -m mathos.research.clay_alignment --output-dir artifacts/clay
          python -m json.tool artifacts/clay/clay_target_alignment.json > /dev/null
          python -m mathos.research.clay_proof_topology --output-dir artifacts/clay
          python -m json.tool artifacts/clay/clay_proof_topology.json > /dev/null
          python -m mathos.research.hypothesis_pipeline --output-dir artifacts/hypotheses
          python -m json.tool artifacts/hypotheses/seven_hypotheses_report.json > /dev/null
      - name: Upload bounded seven-track evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-hypothesis-evidence-py${{ matrix.python-version }}
          path: artifacts/hypotheses/seven_hypotheses_report.json
          if-no-files-found: ignore
      - name: Upload theorem assurance and review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat1-assurance-py${{ matrix.python-version }}
          path: artifacts/theorems/
          if-no-files-found: ignore
      - name: Upload exact finite-claim digital-twin receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-math-claim-twin-py${{ matrix.python-version }}
          path: artifacts/claim-twin/bounded_claim_certificates.json
          if-no-files-found: ignore
      - name: Upload bounded mathematical lemma audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemma-verification-py${{ matrix.python-version }}
          path: artifacts/lemmas/
          if-no-files-found: ignore
      - name: Upload Clay target traceability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clay-target-alignment-py${{ matrix.python-version }}
          path: |
            artifacts/clay/clay_target_alignment.json
            artifacts/clay/clay_proof_topology.json
          if-no-files-found: ignore
