name: MRA-X SMT verification
on:
  pull_request:
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-formal.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_*.py'
      - '.github/workflows/mra-x-formal.yml'
permissions:
  contents: read
jobs:
  smt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Z3 from Ubuntu package sources
        run: |
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=3
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libz3-4
      - run: python3 tools/mra_x_formal.py --output formal-evidence.json
      - name: Verify evidence and reproduce results on this solver version
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          import mra_x_formal as f
          import mra_x_gap_agent as g
          r=json.load(open('formal-evidence.json'))
          assert r==f.audit()
          h=r.pop('evidence_sha256')
          assert g.digest(r)==h
          assert len(r['rows'])==179 and r['queries']==280 and r['controls']==5
          assert sum(x['feasible'] for x in r['rows'])==101
          assert sum(x['result']=='unsat' for x in r['symbolic'])==14
          assert sum(x['result']=='sat' for x in r['symbolic'])==3
          PY
