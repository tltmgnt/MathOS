name: Proctor F038 unrestricted universal search
on:
  push:
    branches: ['research/pnp-f038-unrestricted-universal-search']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_unrestricted_universal_search.py
          python -m mathos.research.f038_syndrome_tree_interfaces | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_SYNDROME_TREE_OK {"complete":[[2,1,2,8,1,1],[3,3,6,64,2,2],[4,6,12,1024,4,4]],"controls":5,"random":[[0,32,32,32,0,0,160,0],[1,32,64,64,30,1,546,0],[2,32,128,128,60,2,1824,0],[3,32,256,252,88,3,5288,4],[4,32,512,496,107,4,12712,16]],"tagged":[256,95,26244,1024,8,163,446,4]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_unrestricted_universal_search | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_UNRESTRICTED_SEARCH_OK {"controls":5,"failures":[[0,1,0,95,128,10,8,1024],[1,3,32,63,76,234,712,1024],[2,7,78,17,17,556,1724,1024],[3,15,78,17,17,556,1724,1024],[4,31,95,0,0,675,2098,1024],[5,63,95,0,0,675,2098,1024],[6,127,95,0,0,675,2098,1024]],"first":[0,32,46,0,17,0,0],"schedule":[256,95,1792,11008,473,192,128]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_UNRESTRICTED_SEARCH_GATE_OK status=OPEN')
          PY
