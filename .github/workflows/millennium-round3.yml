name: Seven Millennium third-round research (bounded)
on:
  push:
    paths:
      - 'mathos/research/millennium_followup_round3.py'
      - 'tests/test_millennium_followup_round3.py'
      - '.github/workflows/millennium-round3.yml'
  pull_request:
    paths:
      - 'mathos/research/millennium_followup_round3.py'
      - 'tests/test_millennium_followup_round3.py'
      - '.github/workflows/millennium-round3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_millennium_followup_round3.py' -v
      - run: |
          mkdir -p artifacts/millennium-round3
          python -m mathos.research.millennium_followup_round3 | tee artifacts/millennium-round3/report.json
          python -m json.tool artifacts/millennium-round3/report.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: seven-track-round3
          path: artifacts/millennium-round3/report.json
          if-no-files-found: error
