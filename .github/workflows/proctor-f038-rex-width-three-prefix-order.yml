name: Proctor F038 RE-X prefix-ordered functional search
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-prefix-order']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent conflict-prefix trace, exact witnesses, barrier scaling and conditional resources
        run: |
          node mathos/research/f038_rex_width_three_prefix_order_audit.js > /tmp/d6b.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6b.json');a.equal(r.cases,337);a.equal(r.sat,584);a.equal(r.unsat,90);a.equal(r.traceTrials,3664);a.equal(r.traceConflicts,3080);a.equal(r.improved,528);a.equal(r.tied,0);a.equal(r.regressed,48);a.equal(r.arith,20034);a.equal(r.producerChecks,12);a.equal(r.certified,12);console.log('D6B_PREFIX_ORDER_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D6B_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [functional-1-sat, functional-1-unsat, functional-2-sat, functional-2-unsat, barrier-sat, empty-domain]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_prefix_order_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_prefix_order_replay.js" "$mode" descriptor > /tmp/d6b.desc
          node "${p}_prefix_order_replay.js" "$mode" fixtures > /tmp/d6b.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d6b-native
          /tmp/d6b-native /tmp/d6b.desc /tmp/d6b.fixtures > /tmp/d6b-native.out
          python -m mathos.research.f038_rex_width_three_prefix_order_native_verify /tmp/d6b.fixtures /tmp/d6b-native.out "$mode"
