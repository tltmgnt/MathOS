name: PNP cross model separation
on:
  push:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_cross_model.py'
      - 'formal/PnpCrossModel.lean'
      - '.github/workflows/pnp-cross-model.yml'
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_cross_model.py'
      - 'formal/PnpCrossModel.lean'
      - '.github/workflows/pnp-cross-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_pnp_cross_model.py' -v
          mkdir -p artifacts/pnp-cross-model
          python -m mathos.research.pnp_cross_model_frontier --checkpoint artifacts/pnp-cross-model/report.json > /dev/null
          python -m mathos.research.pnp_cross_model_frontier --audit artifacts/pnp-cross-model/report.json > artifacts/pnp-cross-model/audit.json
          python -c "import json; r=json.load(open('artifacts/pnp-cross-model/report.json')); print(json.dumps(r['summary'],indent=2)); assert r['completion']=='completed' and r['summary']['affine_decisions']==12"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-cross-model-evidence
          path: artifacts/pnp-cross-model/
          if-no-files-found: ignore
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -o pipefail
          lean -DwarningAsError=true formal/PnpCrossModel.lean | tee /tmp/pnp-cross-model-lean.txt
          for theorem in cancelShared sameParityNoSingleFlip inconsistentParity; do
            grep -Fx "'PnpCrossModel.$theorem' does not depend on any axioms" /tmp/pnp-cross-model-lean.txt
          done
