name: Proctor F038 RE-X sound conflict-prefix pruning
on:
  push:
    branches: ['research/pnp-f038-rex-width-three-conflict-pruning']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent conflict-prefix trace, exact witnesses, barrier scaling and conditional resources
        run: |
          node mathos/research/f038_rex_width_three_conflict_pruning_audit.js > /tmp/d6a.json
          node -e "const a=require('node:assert/strict'),r=require('/tmp/d6a.json');a.equal(r.cases,335);a.equal(r.sat,588);a.equal(r.unsat,82);a.equal(r.traceTrials,2464);a.equal(r.traceConflicts,1876);a.equal(r.skipped,49271806);a.equal(r.improved,214);a.equal(r.tied,360);a.equal(r.regressed,6);a.equal(r.arith,20034);console.log('D6A_CONFLICT_PRUNING_OK')"
      - name: Inherited governance gates
        run: |
          python -m mathos.research.tga_f038_rex_024d5e > /tmp/w3-gates.json
          python - <<'PY'
          import json
          g=json.load(open('/tmp/w3-gates.json'))
          assert g['PNP_RESOLUTION_STATUS']=='OPEN' and g['PROMOTION']=='NONE'
          assert all(v['status']=='BLOCKED' for v in g['local_routes'].values())
          assert all(v['status']=='BLOCKED' for v in g['global_routes'].values())
          print('REX-024D6A_INHERITED_GATE_OK PNP_RESOLUTION_STATUS=OPEN PROMOTION=NONE')
          PY
  physical:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
        fixture: [radius-three-last, known-radius-three, empty-domain, barrier-sat, barrier-unsat, third-rank-barrier]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original raw-selector physical replay, quotient and cutoff
        run: node mathos/research/f038_rex_width_three_conflict_pruning_replay.js ${{ matrix.mode }} ${{ matrix.fixture }}
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [bounded, full]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent native original-format replay
        run: |
          set -euo pipefail
          p=mathos/research/f038_rex_width_three
          mode=${{ matrix.mode }}
          node "${p}_conflict_pruning_replay.js" "$mode" descriptor > /tmp/d6a.desc
          node "${p}_conflict_pruning_replay.js" "$mode" fixtures > /tmp/d6a.fixtures
          g++ -std=c++17 -O3 "${p}_native.cpp" -o /tmp/d6a-native
          /tmp/d6a-native /tmp/d6a.desc /tmp/d6a.fixtures > /tmp/d6a-native.out
          python -m mathos.research.f038_rex_width_three_conflict_pruning_native_verify /tmp/d6a.fixtures /tmp/d6a-native.out "$mode"
