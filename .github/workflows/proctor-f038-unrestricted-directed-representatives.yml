name: Proctor F038 unrestricted directed representatives
on:
  push:
    branches: ['research/pnp-f038-unrestricted-directed-representatives']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          node --check mathos/research/f038_unrestricted_directed_representatives.js
          node mathos/research/f038_unrestricted_directed_representatives.js | tee /tmp/current.txt
          grep -Fx 'F038_DIRECTED_REPRESENTATIVES_OK {"fixtures":16,"totals":[19,8,36408,14929,3,36405,0,161560,2],"forced":[15441,13377,201],"controls":[[4,9,432,8,3],[8,17,1904,8,6],[16,33,7920,8,14],[32,65,32240,8,30],[64,129,130032,8,62]],"linearChecks":3720}' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_DIRECTED_REPRESENTATIVES_GATE_OK status=OPEN promotion=NONE')
          PY
