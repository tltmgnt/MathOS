name: Millennium breakthrough cycle 2 (scalar and Weil forms)
on:
  push:
    paths:
      - 'mathos/research/breakthrough_cycle2.py'
      - 'tests/test_breakthrough_cycle2.py'
      - 'docs/research/breakthrough/*B002*'
      - '.github/workflows/millennium-breakthrough-cycle2.yml'
  pull_request:
    paths:
      - 'mathos/research/breakthrough_cycle2.py'
      - 'tests/test_breakthrough_cycle2.py'
      - 'docs/research/breakthrough/*B002*'
      - '.github/workflows/millennium-breakthrough-cycle2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_breakthrough_cycle2.py' -v
      - run: |
          mkdir -p artifacts/breakthrough-cycle2
          python -m mathos.research.breakthrough_cycle2 > artifacts/breakthrough-cycle2/report.json
          cat artifacts/breakthrough-cycle2/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: breakthrough-cycle2-evidence
          path: artifacts/breakthrough-cycle2/report.json
          if-no-files-found: error
