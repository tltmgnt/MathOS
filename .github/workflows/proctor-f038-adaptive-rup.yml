name: Proctor F038 adaptive RUP clock
on:
  push:
    branches: ['research/pnp-f038-adaptive-rup-clock']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_adaptive_rup.py
          python -m mathos.research.f038_prefix_clock | tee /tmp/prefix.txt
          grep -Fx 'F038_PREFIX_SEARCH_OK formulas=4096 sat=1360 unsat=2736 events=5888 jumps=4528 skipped=25648 deadline_checks=36864 misses=3152 max_events=4 hist=0,2992,432,656,16,0,0,0,0' /tmp/prefix.txt
          grep -Fx 'F038_PREFIX_COMPILER_OK deadlines=5 patterns=163840 misses=1360,1104,672,16,0 certificates=2304,1688,834,16,0 accepted=0,256,688,1344,1360' /tmp/prefix.txt
          grep -Fx 'F038_PREFIX_CLOCK_BARRIER_OK families=6 events=8,17,34,67,132,261' /tmp/prefix.txt
          python -m mathos.research.f038_adaptive_rup | tee /tmp/rup.txt
          grep -Fx 'F038_ADAPTIVE_RUP_OK formulas=4096 sat=1360 unsat=2736 nodes=4415 branches=303 conflicts=2752 learned=2752 sat_learned=16 unsat_learned=2736 max_nodes=3' /tmp/rup.txt
          grep -Fx 'F038_ADAPTIVE_FULL_WIDTH_OK formulas=256 sat=255 unsat=1 nodes=850 branches=510 conflicts=85 learned=103 max_nodes=7' /tmp/rup.txt
          grep -Fx 'F038_ADAPTIVE_PREFIX_ESCAPE_OK families=6 nodes=6,7,8,9,10,11 learned_each=3' /tmp/rup.txt
          grep -Fx 'F038_RUP_TRACE_COMPILER_OK patterns=4096 valid=216 refutations=4 valid_nonempty=212 invalid_normalized=2800' /tmp/rup.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_ADAPTIVE_RUP_GATE_OK status=OPEN')
          PY
