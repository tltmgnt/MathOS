name: Proctor F038 MRA-X multioutput derivative rank
on:
  push:
    branches: ['research/pnp-f038-mrax-multioutput-derivative-rank']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_multioutput_derivative_rank.py
          python -m mathos.research.f038_affine_selector_rigidity | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_AFFINE_SELECTOR_OK {"controls":4,"flats":[[1,2,1,3,6,[3,3],[0,1],0,2],[2,8,5,95,23024,[95,4465,13941,4235,284,4],[0,6,78,38,4,0],0,4]],"local":[3,51,20,160,1280,8160,192],"volumes":[[1,2,1,1,1,0,"3","1",2],[2,8,5,2,6,4,"95","40",3],[3,26,19,4,28,56,"3741839","507904",8],[4,64,50,7,120,560,"17708796636724409","312811058102272",16]]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_multioutput_derivative_rank | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_DERIVATIVE_RANK_OK {"controls":4,"products":[[1,16,32,8,8,12],[2,256,2048,512,512,768],[3,65536,1572864,393216,393216,589824]],"ranks":[[2,8,8,8,8,8],[3,128,256,640,768,512],[4,256,768,4352,5120,2816]],"selector":[[1,2,4,4,[1]],[2,8,256,256,[1,9,37,93,163,219,247]]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_DERIVATIVE_RANK_GATE_OK status=OPEN')
          PY
