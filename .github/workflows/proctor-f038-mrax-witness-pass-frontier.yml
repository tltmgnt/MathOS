name: Proctor F038 MRA-X witness pass frontier
on:
  push:
    branches: ['research/pnp-f038-mrax-witness-pass-frontier']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m py_compile mathos/research/f038_witness_pass_frontier.py
          python -m mathos.research.f038_bit_witness_consistency | tee /tmp/prior.txt
          grep -Fx 'F038_MRAX_BIT_WITNESS_OK {"controls":4,"ranges":[[2,0,1,4,257,1284,16,-1],[3,0,2,8,230801,1615205,152,22],[3,1,1,8,577,4038,38,1],[3,1,2,8,452161,3616710,152,22],[3,2,2,8,803601,7231623,152,22],[4,1,1,10,785,6279,54,1]],"relations":[65536,65025,961,900,1296,17136,972,16308,1440]}' /tmp/prior.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/prior.txt
          python -m mathos.research.f038_witness_pass_frontier | tee /tmp/current.txt
          grep -Fx 'MRAX_STAGE_GATE PROCEED_RESTRICTED' /tmp/current.txt
          grep -Fx 'TECTX_PRE_GAP_OK targets=universal_lower_bound,machine_cost,discovery,short_proofs status=OPEN' /tmp/current.txt
          grep -Fx 'F038_MRAX_WITNESS_FRONTIER_OK {"cnf":[256,2048,164025,320,265,128,128,77,14],"controls":4,"passes":[[3,384,768,6144,684,84,3118,36,1216,4],[4,1536,3072,49152,2850,222,25876,36,5824,5]]}' /tmp/current.txt
          grep -Fx 'TECTX_POST_GAP_OK status=OPEN promotion=NONE' /tmp/current.txt
          grep -Fx 'MRAX_POST_GATE_OK status=OPEN promotion=NONE' /tmp/current.txt
          python -m mathos.research.tga_pnp_resolution_gap > /tmp/gap.json
          python - <<'PY'
          import json
          with open('/tmp/gap.json') as f:
              gap = json.load(f)
          assert gap['PNP_RESOLUTION_STATUS'] == 'OPEN'
          assert gap['selector_route']['status'] == 'BLOCKED'
          assert gap['mathematical_resolution']['status'] == 'BLOCKED'
          print('F038_MRAX_WITNESS_FRONTIER_GATE_OK status=OPEN')
          PY
