name: PNP v18 rectangular Hall symmetry
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_hall_*.py'
      - 'mathos/research/pnp_bounded_matching.py'
      - 'mathos/research/pnp_signed_hall_subsystem.py'
      - 'tests/independent_pnp_v18_*embedding*.py'
      - 'tests/independent_pnp_v18_hall_memory_probe.py'
      - 'tests/independent_pnp_v18_rectangular_*.py'
      - '.github/workflows/pnp-v18-rectangular-hall.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/pnp-v18-rectangular
          PYTHONPATH=. python tests/independent_pnp_v18_auto_embedding_probe.py > artifacts/pnp-v18-rectangular/prior.json
          python tests/independent_pnp_v18_auto_embedding_audit.py artifacts/pnp-v18-rectangular/prior.json > artifacts/pnp-v18-rectangular/prior-audit.json
          PYTHONPATH=. python tests/independent_pnp_v18_rectangular_probe.py artifacts/pnp-v18-rectangular/prior.json > artifacts/pnp-v18-rectangular/report.json
          python tests/independent_pnp_v18_rectangular_audit.py artifacts/pnp-v18-rectangular/report.json artifacts/pnp-v18-rectangular/prior.json | tee artifacts/pnp-v18-rectangular/audit.json
          (cd artifacts/pnp-v18-rectangular && sha256sum *.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: pnp-v18-rectangular-hall
          path: artifacts/pnp-v18-rectangular/
          if-no-files-found: error
