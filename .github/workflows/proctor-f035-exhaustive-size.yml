name: Proctor F035 exhaustive certificate size obstruction
on:
  pull_request:
    paths:
      - 'formal/Proctor*.lean'
      - 'docs/research/tga-universal/PNP-F035-EXHAUSTIVE-SIZE.md'
      - '.github/workflows/proctor-f035-exhaustive-size.yml'
  push:
    branches: [main, 'research/pnp-f035-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          mkdir -p artifacts/f035-exhaustive-size
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.14.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: |
          set -euo pipefail
          out=artifacts/f035-exhaustive-size
          lean --version | tee "$out/lean-version.txt"
          grep -F 'version 4.14.0' "$out/lean-version.txt"
          cat formal/ProctorHallDeficiency.lean formal/ProctorCapacityDeficiency.lean formal/ProctorMixedInference.lean formal/ProctorPairedReplay.lean formal/ProctorExecutableReplay.lean formal/ProctorCapacityReplay.lean formal/ProctorXorReplay.lean formal/ProctorUnifiedReplay.lean formal/ProctorDataParser.lean formal/ProctorWireRoundtrip.lean formal/ProctorEnvelopeRoundtrip.lean formal/ProctorUnboundedCodec.lean formal/ProctorUnboundedRoundtrip.lean formal/ProctorResolutionBridge.lean formal/ProctorOrdinaryCompleteness.lean formal/ProctorEnvelopeCompleteness.lean formal/ProctorExecutableDiscovery.lean formal/ProctorExhaustiveSize.lean formal/ProctorExhaustiveSizeMain.lean > "$out/combined.lean"
          lean -DwarningAsError=true --run "$out/combined.lean" 2>&1 | tee "$out/kernel.txt"
          grep -Fx 'F035_EXHAUSTIVE_SIZE_OK padded=7 trees=20' "$out/kernel.txt"
          python -m mathos.research.tga_pnp_resolution_gap > "$out/gap-report.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          out = Path("artifacts/f035-exhaustive-size")
          lines = set((out / "kernel.txt").read_text().splitlines())
          groups = {"ProctorExhaustiveSize": ["build_length","nodes_lower","compile_batches","copy_length","compiled_steps","generated_batches","generated_lower","padded_unsat","padded_valid","padded_vars","padded_generator_lower"]}
          names = [f"{ns}.{name}" for ns, ds in groups.items() for name in ds]
          assert len(names)==11
          for name in names:
              if f"'{name}' does not depend on any axioms" not in lines:
                  raise SystemExit(f"strict axiom check failed: {name}")
          gap = json.loads((out/"gap-report.json").read_text())
          assert gap["PNP_RESOLUTION_STATUS"]=="OPEN"
          assert gap["mathematical_resolution"]["status"]=="BLOCKED"
          report = dict(scope="EXHAUSTIVE_CERTIFICATE_SIZE_OBSTRUCTION",
                        verified=names, axiom_gate=True, controls=27,
                        ordinary_typed_completeness_verified=True,
                        exhaustive_output_lower_bound_verified=True,
                        bound_envelope_completeness_verified=True,
                        universal_decimal_encoder_verified=False,
                        total_cost_semantics_verified=False,
                        polynomial_certificate_completeness_verified=False,
                        deterministic_polynomial_discovery_verified=False,
                        independent_review=False, resolution_status="OPEN",
                        source_sha256={ns:hashlib.sha256(Path("formal/"+ns+".lean").read_bytes()).hexdigest()
                                       for ns in groups})
          (out / "report.json").write_text(json.dumps(report, indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f035-exhaustive-size-evidence
          path: artifacts/f035-exhaustive-size/
