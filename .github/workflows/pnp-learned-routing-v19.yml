name: PNP learned certificate-gated routing v19
on:
  pull_request:
    paths:
      - 'mathos/research/pnp_*.py'
      - 'tests/test_pnp_learned_routing_v19.py'
      - '.github/workflows/pnp-learned-routing-v19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_pnp_learned_routing_v19.py' -v
          python -m unittest discover -s tests -p 'test_pnp_unified_discovery_v18.py' -v
          mkdir -p artifacts/pnp-v19
          A=artifacts/pnp-v19
          python -m mathos.research.pnp_evidence_benchmark --checkpoint "$A/source.json" > /dev/null
          python -m mathos.research.pnp_evidence_scheduler --benchmark "$A/source.json" --checkpoint "$A/scheduler.json" > /dev/null
          python -m mathos.research.pnp_failure_synthesis --benchmark "$A/source.json" --scheduler "$A/scheduler.json" --checkpoint "$A/failures.json" > /dev/null
          python -m mathos.research.pnp_library_frontier --benchmark "$A/source.json" --scheduler "$A/scheduler.json" --failures "$A/failures.json" --checkpoint "$A/library.json"
          common=(--benchmark "$A/source.json" --scheduler "$A/scheduler.json" --failures "$A/failures.json" --library "$A/library.json")
          python -m mathos.research.pnp_unified_discovery_frontier_v18 "${common[@]}" --checkpoint "$A/calibration.json"
          python -m mathos.research.pnp_unified_discovery_frontier_v18 "${common[@]}" --audit "$A/calibration.json" > "$A/calibration-audit.json"
          python -m mathos.research.pnp_learned_routing_frontier_v19 "${common[@]}" --calibration "$A/calibration.json" --checkpoint "$A/report.json"
          python -m mathos.research.pnp_learned_routing_frontier_v19 "${common[@]}" --calibration "$A/calibration.json" --audit "$A/report.json" > "$A/audit.json"
          (cd "$A" && sha256sum *.json > SHA256SUMS && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnp-v19-learned-routing-evidence
          path: artifacts/pnp-v19/
          if-no-files-found: ignore
