name: TECT-X LF-dense canonical Weil bump core proof workflow
on:
  pull_request:
    paths:
      - 'mathos/research/riemann_weil_lf_dense_core_workflow.py'
      - 'tests/test_riemann_weil_lf_dense_core_workflow.py'
      - 'docs/research/TECTX_WEIL_LF_DENSE_CORE_WORKFLOW.md'
      - '.github/workflows/riemann-weil-lf-dense-core.yml'
  push:
    branches: [main]
    paths:
      - 'mathos/research/riemann_weil_lf_dense_core_workflow.py'
      - 'tests/test_riemann_weil_lf_dense_core_workflow.py'
      - 'docs/research/TECTX_WEIL_LF_DENSE_CORE_WORKFLOW.md'
      - '.github/workflows/riemann-weil-lf-dense-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-lf-dense-Weil-core-support-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run exact rational topology-core and arithmetic inventory regression
        run: python -m unittest discover -s tests -p 'test_riemann_weil_lf_dense_core_workflow.py' -v
      - name: Generate canonical domain-dense core support evidence
        run: |
          python -m mathos.research.riemann_weil_lf_dense_core_workflow --prefix 8 --output artifacts/riemann/tectx_weil_lf_dense_core_workflow.json
          python -m json.tool artifacts/riemann/tectx_weil_lf_dense_core_workflow.json >/dev/null
      - name: Independently check exact arithmetic support, nesting and RH nonpromotion
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction
          with open('artifacts/riemann/tectx_weil_lf_dense_core_workflow.json',encoding='utf-8') as file:
              r=json.load(file)
          assert r['schema']=='mathos_tectx_weil_lf_dense_core_workflow/1'
          core=r['core']
          assert core['priority']=='PRIMARY_RH_RELEVANT_TEST_FAMILY'
          assert core['finite_prefix']==8
          assert not core['finite_prefix_LF_dense']
          assert not core['infinite_span_LF_dense_automatically_verified']
          assert r['comparison_lattice']['span_LF_dense'] is False
          assert r['arithmetic']['complete_support_pair_count']==36
          pairs=r['arithmetic']['upper_triangle']
          assert {(p['i'],p['j']) for p in pairs} == {
              (i,j) for i in range(8) for j in range(i,8)
          }
          for p in pairs:
              left,right=map(Fraction,p['support'])
              a=core['finite_prefix_functions'][p['i']]
              b=core['finite_prefix_functions'][p['j']]
              assert left==Fraction(a['support_left'])-Fraction(b['support_right'])
              assert right==Fraction(a['support_right'])-Fraction(b['support_left'])
              assert not p['actual_Weil_entry_enclosed']
              for term in p['prime_powers']:
                  assert term['n']>=2 and term['von_mangoldt_base']>=2
          d=next(p for p in pairs if p['i']==0 and p['j']==0)
          assert d['prime_powers']==[{'n':2,'von_mangoldt_base':2}]
          assert not r['arithmetic']['full_Gram_PSD_certified']
          assert not r['proof_decision_gate']['Riemann_hypothesis_proved']
          assert not any(r['assurance'].values())
          PY
