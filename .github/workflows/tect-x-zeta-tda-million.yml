name: TECT-X zeta functions and bounded TDA audit (not RH proof)

on:
  pull_request:
    paths:
      - 'mathos/research/tect_x_zeta_tda_1m.py'
      - 'tests/test_tect_x_zeta_tda_1m.py'
      - 'tests/test_tect_x_zeta_video_reference.py'
      - 'docs/research/TECT_X_ONE_MILLION_ZETA_TDA_GAP_ANALYSIS.md'
      - 'docs/research/TECT_X_ZETA_TDA_AUDIT.v1.json'
      - 'docs/research/TECT_X_VIDEO_REFERENCE_AI_RH_BRUTE_FORCE.md'
      - '.github/workflows/tect-x-zeta-tda-million.yml'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full one-million-variant audit and upload ~17MB gzip CSV'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  bounded-zeta-tda-smoke:
    name: Exact graph identities, TDA controls, and bounded nonpromotion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Adversarial TDA tests
        run: python -m unittest discover -s tests -p 'test_tect_x_zeta_tda_1m.py' -v
      - name: Verify video source provenance and no-proof promotion rules
        run: python -m unittest discover -s tests -p 'test_tect_x_zeta_video_reference.py' -v
      - name: Run smoke audit (400 variants, not million)
        run: |
          python -m mathos.research.tect_x_zeta_tda_1m \
            --per-family 100 --sample-size 64 \
            --report artifacts/zeta-tda/smoke-report.json \
            --dataset artifacts/zeta-tda/smoke-data.csv.gz
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/zeta-tda/smoke-report.json")
          x = json.loads(p.read_text())
          assert x["count_total"] == 400
          assert x["rh_proof"] is False and x["bsd_proof"] is False
          assert not any(v["any_sample_h1"] for v in x["families"].values())
          assert any(v["betti1"] == 1 for v in x["tda_controls"]["circle_positive_control"].values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tect-x-zeta-tda-smoke-not-rh-evidence
          path: artifacts/zeta-tda/
          retention-days: 14

  optional-full-million:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_scan == true }}
    name: Opt-in full 1M function registry and 128-point TDA samples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Compute 1,000,000 variants and bounded TDA
        run: |
          python -m mathos.research.tect_x_zeta_tda_1m \
            --per-family 250000 --sample-size 128 \
            --report artifacts/zeta-tda/one-million-report.json \
            --dataset artifacts/zeta-tda/one-million-features.csv.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tect-x-one-million-zeta-feature-audit-not-rh-proof
          path: artifacts/zeta-tda/
          retention-days: 30
